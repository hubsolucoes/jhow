                  - MONTHLY
                  - BIMONTHLY
                  - QUARTERLY
                  - SEMIANNUALLY
                  - YEARLY
                description:
                  description: Texto descritivo (até 500 caracteres onde aplicável).
                  type: string
                endDate:
                  description: Último vencimento permitido para a recorrência.
                  type: string
                  format: date
                updatePendingPayments:
                  description: true aplica a alteração também às cobranças pendentes.
