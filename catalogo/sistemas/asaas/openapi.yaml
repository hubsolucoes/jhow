    get:
      operationId: asaas__assinatura__listar
      summary: Listar assinaturas
      description: Lista assinaturas com filtros por cliente, grupo, forma de pagamento, status (ACTIVE, EXPIRED, INACTIVE), removidas e externalReference.
      tags:
      - Assinatura
      x-confianca: verificado
      x-fonte-url: https://docs.asaas.com/reference/listar-assinaturas
      x-acao-canonica: listar
      security:
      - accessToken: []
      parameters:
      - name: offset
        in: query
        required: false
        description: Posição inicial da página (começa em 0).
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Tamanho da página; 1 a 100, padrão 10.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: customer
        in: query
        required: false
        description: Filtra pelo cliente.
        schema:
          type: string
      - name: customerGroupName
        in: query
        required: false
        description: Filtra pelo grupo de clientes.
        schema:
          type: string
      - name: billingType
        in: query
        required: false
        description: Filtra por meio de pagamento.
        schema:
          type: string
          enum:
          - UNDEFINED
          - BOLETO
          - CREDIT_CARD
          - DEBIT_CARD
          - TRANSFER
          - DEPOSIT
          - PIX
      - name: status
        in: query
        required: false
        description: Situação do registro (valores no enum).
        schema:
          type: string
          enum:
          - ACTIVE
          - EXPIRED
          - INACTIVE
      - name: deletedOnly
        in: query
        required: false
        description: '''true'' retorna só assinaturas removidas.'
        schema:
          type: string
      - name: includeDeleted
        in: query
        required: false
        description: '''true'' inclui assinaturas removidas.'
        schema:
          type: string
      - name: externalReference
        in: query
        required: false
        description: Filtra pelo seu identificador.
        schema:
          type: string
      - name: order
        in: query
        required: false
        description: Direção da ordenação (asc/desc).
        schema:
          type: string
      - name: sort
        in: query
        required: false
        description: Campo usado na ordenação.
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                object: list
                hasMore: false
                totalCount: 1
                limit: 10
                offset: 0
                data:
                - *id005
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '429':
          description: Limite de requisições atingido
