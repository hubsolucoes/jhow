    post:
      operationId: asaas__webhook__assinar_webhook
      summary: Criar novo webhook
      description: Registra uma URL para receber eventos escolhidos (events), com token de autenticação (authToken enviado no header asaas-access-token)
        e modo de envio sequencial ou paralelo.
