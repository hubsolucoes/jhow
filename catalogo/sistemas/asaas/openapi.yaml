    post:
      operationId: asaas__nota_fiscal__criar__nfse
      summary: Agendar nota fiscal
      description: Agenda a emissão de uma NFS-e vinculada a uma cobrança, parcelamento ou apenas a um cliente, com descrição do serviço, valor,
        deduções, data de emissão e impostos.
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://docs.asaas.com/reference/agendar-nota-fiscal
      x-acao-canonica: criar
      security:
      - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                payment:
                  description: Id da cobrança (pay_...).
                  type: string
                installment:
                  description: Id do parcelamento a que a nota se refere.
                  type: string
                customer:
                  description: Id do cliente tomador (quando não há cobrança).
                  type: string
                serviceDescription:
                  description: Descrição do serviço prestado na NFS-e.
                  type: string
                observations:
                  description: Texto livre de observações.
                  type: string
                externalReference:
                  description: Seu identificador interno para este registro; útil em buscas e conciliação.
                  type: string
                value:
                  description: Valor total dos serviços.
                  type: number
                deductions:
                  description: Deduções da base de cálculo (não mudam o valor total).
                  type: number
                effectiveDate:
                  description: Data de emissão da nota.
                  type: string
                  format: date
                municipalServiceId:
                  description: Id do serviço municipal (lista de serviços da prefeitura).
                  type: string
                municipalServiceCode:
                  description: Código do serviço municipal (LC 116).
                  type: string
                municipalServiceName:
                  description: Nome do serviço municipal.
                  type: string
                updatePayment:
                  description: true desconta os impostos no valor da cobrança vinculada.
                  type: boolean
                taxes:
                  description: Objeto de tributos da nota.
                  type: object
                  properties:
                    nbsCode:
                      description: Código NBS do serviço.
                      type: string
                    taxSituationCode:
                      description: Código de situação tributária (Reforma Tributária).
                      type: string
                    taxClassificationCode:
                      description: Código de classificação tributária.
                      type: string
                    operationIndicatorCode:
                      description: Código do indicador de operação.
                      type: string
                    retainIss:
                      description: Se o tomador retém o ISS.
                      type: boolean
                    iss:
                      description: Alíquota de ISS (%).
                      type: number
                    pisCofinsRetentionType:
                      description: Calculado pelo Asaas; não enviar.
                      type: string
                    pisCofinsTaxStatus:
                      description: Situação tributária de PIS/COFINS.
                      type: string
                    operationPis:
                      description: Alíquota PIS de apuração própria.
                      type: number
                    operationCofins:
                      description: Alíquota COFINS de apuração própria.
                      type: number
                    pis:
                      description: Alíquota PIS retida (%).
                      type: number
                    cofins:
                      description: Alíquota COFINS retida (%).
                      type: number
                    csll:
                      description: Alíquota CSLL (%).
                      type: number
                    inss:
                      description: Alíquota INSS (%).
                      type: number
                    ir:
                      description: Alíquota IR (%).
                      type: number
                    operationTypeCode:
                      description: Tipo de operação da Reforma Tributária (exigido em alguns serviços).
                      type: integer
                    referencedInvoiceAccessKeyList:
                      description: Chaves de NFS-e referenciadas.
                      type: array
                      items:
                        type: string
                    realEstateInfo:
                      description: Dados do imóvel para operações imobiliárias.
                      type: object
                  required:
                  - retainIss
                  - iss
                  - pis
                  - cofins
                  - csll
                  - inss
                  - ir
              required:
              - serviceDescription
              - observations
              - value
              - deductions
              - effectiveDate
              - municipalServiceName
              - taxes
            example:
              payment: pay_000000000001
              serviceDescription: Consultoria em TI - setembro
              observations: Pedido 123
              value: 300.0
              deductions: 0
              effectiveDate: '2026-09-20'
              municipalServiceName: Suporte técnico em informática
              municipalServiceCode: '1.07'
              taxes:
                retainIss: false
                iss: 2
                pis: 0
                cofins: 0
                csll: 0
                inss: 0
                ir: 0
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example: &id007
                object: invoice
                id: inv_000000000001
                status: SCHEDULED
                customer: cus_000000000001
                payment: pay_000000000001
                value: 300.0
                effectiveDate: '2026-09-20'
                pdfUrl: null
                xmlUrl: null
                number: null
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '429':
          description: Limite de requisições atingido
