                  description: Id de uma autorização de Pix Automático a vincular.
                  type: string
                creditCard:
                  description: Dados do cartão (tráfego exige ambiente PCI-DSS).
                  type: object
                  properties:
                    holderName:
                      description: Nome como impresso no cartão.
                      type: string
                    number:
                      description: Número do cartão.
                      type: string
                    expiryMonth:
                      description: Mês de validade com 2 dígitos.
                      type: string
                    expiryYear:
                      description: Ano de validade com 4 dígitos.
                      type: string
                    ccv:
                      description: Código de segurança.
                      type: string
                  required:
                  - holderName
                  - number
                  - expiryMonth
                  - expiryYear
                  - ccv
                creditCardHolderInfo:
                  description: Dados do titular do cartão para antifraude.
                  type: object
                  properties:
                    name:
                      description: Nome do titular.
                      type: string
                    email:
                      description: E-mail do titular.
                      type: string
                    cpfCnpj:
                      description: CPF/CNPJ do titular.
                      type: string
                    postalCode:
                      description: CEP do titular.
                      type: string
                    addressNumber:
                      description: Número do endereço do titular.
                      type: string
                    addressComplement:
                      description: Complemento do endereço do titular.
                      type: string
                    phone:
                      description: Telefone com DDD do titular.
                      type: string
                    mobilePhone:
                      description: Celular do titular.
                      type: string
                  required:
                  - name
                  - email
                  - cpfCnpj
                  - postalCode
                  - addressNumber
                  - phone
                creditCardToken:
                  description: Token de cartão obtido na tokenização (substitui os dados do cartão).
                  type: string
                authorizeOnly:
                  description: true faz só a pré-autorização; a captura é feita depois.
                  type: boolean
                remoteIp:
                  description: IP público do comprador (não o do servidor).
                  type: string
                threeDSecure:
                  description: Ativa autenticação 3D Secure na cobrança.
                  type: object
                  properties:
                    callbackUrl:
                      description: URL de retorno após o desafio 3DS.
                      type: string
                  required:
                  - callbackUrl
                deviceInfo:
                  description: Dados do navegador/dispositivo exigidos pelo 3DS.
