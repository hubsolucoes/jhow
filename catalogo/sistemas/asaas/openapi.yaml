openapi: 3.1.0
info:
  title: Asaas API v3 (reconstrução do catálogo)
  version: 3.0.0
  description: Subconjunto detalhado reconstruído a partir da referência oficial (docs.asaas.com) e da spec pública https://www.asaas.com/openApi/document?version=3&languageCode=pt-BR.
    Consulta em 2026-09-17.
servers:
- url: https://api.asaas.com
  description: Produção
- url: https://api-sandbox.asaas.com
  description: Sandbox
security:
- accessToken: []
components:
  securitySchemes:
    accessToken:
      type: apiKey
      in: header
      name: access_token
      description: Chave de API da conta. Enviar também User-Agent.
  schemas:
    ErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              description:
                type: string
  responses:
    Erro:
      description: Erro com lista errors[]
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            errors:
            - code: invalid_access_token
              description: <mensagem da API>
paths:
  /v3/customers:
    post:
      operationId: asaas__cliente__criar
      summary: Criar novo cliente
      description: Cadastra o pagador (pessoa física ou jurídica) na conta Asaas e devolve o identificador cus_... usado em cobranças, parcelamentos
        e assinaturas.
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://docs.asaas.com/reference/criar-novo-cliente
      x-acao-canonica: criar
      security:
      - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Nome ou razão social do pagador.
                  type: string
                cpfCnpj:
                  description: CPF (11 dígitos) ou CNPJ (14) sem pontuação.
                  type: string
                email:
                  description: Endereço de e-mail.
                  type: string
                phone:
                  description: Telefone fixo com DDD.
                  type: string
                mobilePhone:
                  description: Celular com DDD.
                  type: string
                address:
                  description: Logradouro (rua/avenida).
                  type: string
                addressNumber:
                  description: Número do endereço.
                  type: string
                complement:
                  description: Complemento do endereço (até 255 caracteres).
                  type: string
                province:
                  description: Bairro.
                  type: string
                postalCode:
                  description: CEP, somente dígitos.
                  type: string
                externalReference:
                  description: Seu identificador interno para este registro; útil em buscas e conciliação.
                  type: string
                notificationDisabled:
                  description: Quando true, o Asaas não envia avisos de cobrança a este cliente.
                  type: boolean
                additionalEmails:
                  description: E-mails extras para avisos, separados por vírgula.
                  type: string
                municipalInscription:
                  description: Inscrição municipal do cliente.
                  type: string
                stateInscription:
                  description: Inscrição estadual do cliente.
                  type: string
                observations:
                  description: Texto livre de observações.
                  type: string
                groupName:
                  description: Grupo de clientes (um único nome).
                  type: string
                groupNames:
                  description: Lista de grupos do cliente (até 20 por chamada).
                  type: array
                  items:
                    type: string
                company:
                  description: Nome da empresa do cliente.
                  type: string
                foreignCustomer:
                  description: Marque true para pagador estrangeiro.
                  type: boolean
              required:
              - name
              - cpfCnpj
            example:
              name: Cliente Exemplo Ltda
              cpfCnpj: 00000000000191
              email: financeiro@example.com
              mobilePhone: '11900000000'
              postalCode: '01001000'
              addressNumber: '100'
              externalReference: CLI-001
              notificationDisabled: false
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example: &id001
                object: customer
                id: cus_000000000001
                dateCreated: '2026-09-17'
                name: Cliente Exemplo Ltda
                email: financeiro@example.com
                cpfCnpj: 00000000000191
                personType: JURIDICA
                postalCode: '01001000'
                externalReference: CLI-001
                deleted: false
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '429':
          description: Limite de requisições atingido
    get:
      operationId: asaas__cliente__listar
      summary: Listar clientes
      description: Retorna a lista paginada de clientes com filtros por nome, e-mail, CPF/CNPJ, grupo e externalReference.
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://docs.asaas.com/reference/listar-clientes
      x-acao-canonica: listar
      security:
      - accessToken: []
      parameters:
      - name: offset
        in: query
        required: false
        description: Posição inicial da página (começa em 0).
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Tamanho da página; 1 a 100, padrão 10.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: name
        in: query
        required: false
        description: Filtra por nome.
        schema:
          type: string
      - name: email
        in: query
        required: false
        description: Filtra por e-mail.
        schema:
          type: string
      - name: cpfCnpj
        in: query
        required: false
        description: Filtra por CPF/CNPJ.
        schema:
          type: string
      - name: groupName
        in: query
        required: false
        description: Filtra por grupo.
        schema:
          type: string
      - name: externalReference
        in: query
        required: false
        description: Filtra pelo seu identificador.
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                object: list
                hasMore: false
                totalCount: 1
                limit: 10
                offset: 0
                data:
                - *id001
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '429':
          description: Limite de requisições atingido
  /v3/customers/{id}:
    get:
      operationId: asaas__cliente__obter
      summary: Recuperar um único cliente
      description: Busca os dados cadastrais de um cliente pelo id cus_...; clientes removidos aparecem com deleted=true.
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://docs.asaas.com/reference/recuperar-um-unico-cliente
      x-acao-canonica: obter
      security:
      - accessToken: []
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador do recurso no Asaas, enviado no caminho da URL.
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example: *id001
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '429':
          description: Limite de requisições atingido
        '404':
          description: Recurso não encontrado
    put:
      operationId: asaas__cliente__atualizar
      summary: Atualizar cliente existente
      description: Altera dados cadastrais do cliente; somente os campos enviados são modificados (comportamento parcial inferido pela ausência
        de campos obrigatórios no body).
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://docs.asaas.com/reference/atualizar-cliente-existente
      x-acao-canonica: atualizar
      security:
      - accessToken: []
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador do recurso no Asaas, enviado no caminho da URL.
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  description: Nome ou razão social do pagador.
                  type: string
                cpfCnpj:
                  description: CPF (11 dígitos) ou CNPJ (14) sem pontuação.
                  type: string
                email:
                  description: Endereço de e-mail.
                  type: string
                phone:
                  description: Telefone fixo com DDD.
                  type: string
                mobilePhone:
                  description: Celular com DDD.
                  type: string
                address:
                  description: Logradouro (rua/avenida).
                  type: string
                addressNumber:
                  description: Número do endereço.
                  type: string
                complement:
                  description: Complemento do endereço (até 255 caracteres).
                  type: string
                province:
                  description: Bairro.
                  type: string
                postalCode:
                  description: CEP, somente dígitos.
                  type: string
                externalReference:
                  description: Seu identificador interno para este registro; útil em buscas e conciliação.
                  type: string
                notificationDisabled:
                  description: Quando true, o Asaas não envia avisos de cobrança a este cliente.
                  type: boolean
                additionalEmails:
                  description: E-mails extras para avisos, separados por vírgula.
                  type: string
                municipalInscription:
                  description: Inscrição municipal do cliente.
                  type: string
                stateInscription:
                  description: Inscrição estadual do cliente.
                  type: string
                observations:
                  description: Texto livre de observações.
                  type: string
                groupName:
                  description: Grupo de clientes (um único nome).
                  type: string
                groupNames:
                  description: Lista de grupos do cliente (até 20 por chamada).
                  type: array
                  items:
                    type: string
                company:
                  description: Nome da empresa do cliente.
                  type: string
                foreignCustomer:
                  description: Marque true para pagador estrangeiro.
                  type: boolean
            example:
              email: novo-financeiro@example.com
              notificationDisabled: true
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example: *id001
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '429':
          description: Limite de requisições atingido
        '404':
          description: Recurso não encontrado
    delete:
      operationId: asaas__cliente__excluir
      summary: Remover cliente
      description: 'Remove o cliente da conta. A remoção é lógica: existe o endpoint POST /v3/customers/{id}/restore para restaurar.'
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://docs.asaas.com/reference/remover-cliente
      x-acao-canonica: excluir
      security:
      - accessToken: []
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador do recurso no Asaas, enviado no caminho da URL.
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                deleted: true
                id: cus_000000000001
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '429':
          description: Limite de requisições atingido
        '404':
          description: Recurso não encontrado
  /v3/payments:
    post:
      operationId: asaas__cobranca__criar
      summary: Criar nova cobrança
      description: Emite uma cobrança avulsa ou parcelada por boleto (BOLETO), Pix (PIX), cartão (CREDIT_CARD) ou deixando o pagador escolher
        (UNDEFINED). Retorna invoiceUrl, bankSlipUrl e nossoNumero.
      tags:
      - Cobranca
      x-confianca: verificado
      x-fonte-url: https://docs.asaas.com/reference/criar-nova-cobranca
      x-acao-canonica: criar
      security:
      - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer:
                  description: Id do cliente no Asaas (cus_...).
                  type: string
                billingType:
                  description: 'Meio de pagamento: BOLETO, PIX, CREDIT_CARD ou UNDEFINED (o pagador escolhe na fatura).'
                  type: string
                  enum:
                  - UNDEFINED
                  - BOLETO
                  - CREDIT_CARD
                  - PIX
                value:
                  description: Valor em reais, com ponto decimal.
                  type: number
                dueDate:
                  description: Data de vencimento (AAAA-MM-DD).
                  type: string
                  format: date
                description:
                  description: Texto descritivo (até 500 caracteres onde aplicável).
                  type: string
                daysAfterDueDateToRegistrationCancellation:
                  description: 'Boleto: quantos dias após o vencimento o registro é baixado.'
                  type: integer
                externalReference:
                  description: Seu identificador interno para este registro; útil em buscas e conciliação.
                  type: string
                installmentCount:
                  description: Quantidade de parcelas.
                  type: integer
                totalValue:
                  description: Valor total a ser dividido entre as parcelas.
                  type: number
                installmentValue:
                  description: Valor de cada parcela (alternativa a totalValue).
                  type: number
                discount:
                  description: Objeto de desconto por pagamento antecipado.
                  type: object
                  properties:
                    value:
                      description: Valor ou percentual do desconto.
                      type: number
                    dueDateLimitDays:
                      description: Até quantos dias antes do vencimento o desconto vale (0 = até o vencimento).
                      type: integer
                    type:
                      description: FIXED (valor) ou PERCENTAGE (percentual).
                      type: string
                      enum: &id003
                      - FIXED
                      - PERCENTAGE
                interest:
                  description: Objeto de juros por atraso.
                  type: object
                  properties:
                    value:
                      description: Percentual de juros ao mês após o vencimento.
                      type: number
                fine:
                  description: Objeto de multa por atraso.
                  type: object
                  properties:
                    value:
                      description: Valor ou percentual da multa.
                      type: number
                    type:
                      description: FIXED ou PERCENTAGE.
                      type: string
                      enum: &id004
                      - FIXED
                      - PERCENTAGE
                postalService:
                  description: true para envio do boleto por Correios (serviço tarifado).
                  type: boolean
                split:
                  description: Lista de divisões do valor recebido entre carteiras Asaas.
                  type: array
                  items:
                    type: object
                    properties:
                      walletId:
                        description: walletId da conta que recebe a parte.
                        type: string
                      fixedValue:
                        description: Parte em valor fixo.
                        type: number
                      percentualValue:
                        description: Parte em percentual do valor líquido.
                        type: number
                      totalFixedValue:
                        description: 'Somente parcelamentos: valor fixo sobre o total parcelado.'
                        type: number
                      externalReference:
                        description: Seu identificador para esta divisão.
                        type: string
                      description:
                        description: Descrição da divisão.
                        type: string
                    required:
                    - walletId
                callback:
                  description: Redirecionamento do pagador após pagar a fatura.
                  type: object
                  properties:
                    successUrl:
                      description: URL de retorno após pagamento aprovado.
                      type: string
                    autoRedirect:
                      description: true redireciona automaticamente; false mostra botão.
                      type: boolean
                  required:
                  - successUrl
                pixAutomaticAuthorizationId:
                  description: Id de uma autorização de Pix Automático a vincular.
                  type: string
              required:
              - customer
              - billingType
              - value
              - dueDate
            example:
              customer: cus_000000000001
              billingType: BOLETO
              value: 150.0
              dueDate: '2026-09-30'
              description: Pedido 123
              externalReference: PEDIDO-123
              fine:
                value: 2
                type: PERCENTAGE
              interest:
                value: 1
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example: &id002
                object: payment
                id: pay_000000000001
                dateCreated: '2026-09-17'
                customer: cus_000000000001
                value: 150.0
                netValue: 148.01
                billingType: BOLETO
                status: PENDING
                dueDate: '2026-09-30'
                invoiceUrl: https://sandbox.asaas.com/i/000000000001
                bankSlipUrl: https://sandbox.asaas.com/b/pdf/000000000001
                nossoNumero: '0000001'
                externalReference: PEDIDO-123
                deleted: false
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '429':
          description: Limite de requisições atingido
    get:
      operationId: asaas__cobranca__listar
      summary: Listar cobranças
      description: Lista cobranças com paginação e filtros por cliente, forma de pagamento, status, assinatura, parcelamento, datas (dateCreated/paymentDate/dueDate
        com [ge]/[le]) e QR Code estático.
      tags:
      - Cobranca
      x-confianca: verificado
      x-fonte-url: https://docs.asaas.com/reference/listar-cobrancas
      x-acao-canonica: listar
      security:
      - accessToken: []
      parameters:
      - name: offset
        in: query
        required: false
        description: Posição inicial da página (começa em 0).
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Tamanho da página; 1 a 100, padrão 10.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - name: customer
        in: query
        required: false
        description: Filtra pelo id do cliente.
        schema:
          type: string
      - name: customerGroupName
        in: query
        required: false
        description: Filtra pelo grupo de clientes.
        schema:
          type: string
      - name: billingType
        in: query
        required: false
        description: Filtra por meio de pagamento.
        schema:
          type: string
          enum:
          - UNDEFINED
          - BOLETO
          - CREDIT_CARD
          - PIX
      - name: status
        in: query
        required: false
        description: Situação do registro (valores no enum).
        schema:
          type: string
          enum:
          - PENDING
          - RECEIVED
          - CONFIRMED
          - OVERDUE
          - REFUNDED
          - RECEIVED_IN_CASH
          - REFUND_REQUESTED
          - REFUND_IN_PROGRESS
          - CHARGEBACK_REQUESTED
          - CHARGEBACK_DISPUTE
          - AWAITING_CHARGEBACK_REVERSAL
          - DUNNING_REQUESTED
          - DUNNING_RECEIVED
          - AWAITING_RISK_ANALYSIS
      - name: subscription
        in: query
        required: false
        description: Filtra pelo id da assinatura.
        schema:
          type: string
      - name: installment
        in: query
        required: false
        description: Filtra pelo id do parcelamento.
        schema:
          type: string
      - name: externalReference
        in: query
        required: false
        description: Filtra pelo seu identificador.
        schema:
          type: string
      - name: paymentDate
        in: query
        required: false
        description: Filtra pela data de pagamento.
        schema:
          type: string
      - name: invoiceStatus
        in: query
        required: false
        description: Filtra cobranças pela situação da nota fiscal.
        schema:
          type: string
          enum:
          - SCHEDULED
          - AUTHORIZED
          - PROCESSING_CANCELLATION
          - CANCELED
          - CANCELLATION_DENIED
          - ERROR
      - name: estimatedCreditDate
        in: query
        required: false
        description: Filtra pela data prevista de crédito.
        schema:
          type: string
      - name: pixQrCodeId
        in: query
        required: false
        description: Filtra cobranças geradas por um QR Code estático.
        schema:
          type: string
      - name: anticipated
        in: query
        required: false
        description: Filtra cobranças antecipadas (true/false).
        schema:
          type: boolean
      - name: anticipable
        in: query
        required: false
        description: Filtra cobranças passíveis de antecipação.
        schema:
          type: boolean
      - name: dateCreated[ge]
        in: query
        required: false
        description: Criadas a partir desta data (AAAA-MM-DD).
        schema:
          type: string
      - name: dateCreated[le]
        in: query
        required: false
        description: Criadas até esta data.
        schema:
          type: string
      - name: paymentDate[ge]
        in: query
        required: false
        description: Pagas a partir desta data.
        schema:
          type: string
      - name: paymentDate[le]
        in: query
        required: false
        description: Pagas até esta data.
        schema:
          type: string
      - name: estimatedCreditDate[ge]
        in: query
        required: false
        description: Crédito previsto a partir desta data.
        schema:
          type: string
      - name: estimatedCreditDate[le]
        in: query
        required: false
        description: Crédito previsto até esta data.
        schema:
          type: string
      - name: dueDate[ge]
        in: query
        required: false
        description: Vencimento a partir desta data.
        schema:
          type: string
      - name: dueDate[le]
        in: query
        required: false
        description: Vencimento até esta data.
        schema:
          type: string
      - name: user
        in: query
        required: false
        description: Filtra pelo e-mail do usuário que criou a cobrança.
        schema:
          type: string
      - name: checkoutSession
        in: query
        required: false
        description: Filtra pelo id de sessão de checkout.
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                object: list
                hasMore: false
                totalCount: 1
                limit: 10
                offset: 0
                data:
                - *id002
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/Erro'
        '429':
          description: Limite de requisições atingido
  /v3/payments/:
    post:
      operationId: asaas__cobranca__criar__cartao_credito
      summary: Criar cobrança com cartão de crédito
      description: Cria e já tenta autorizar uma cobrança no cartão, enviando os dados do cartão (creditCard + creditCardHolderInfo) ou um creditCardToken.
        Suporta pré-autorização (authorizeOnly) e 3D Secure.
      tags:
      - Cobranca
      x-confianca: verificado
      x-fonte-url: https://docs.asaas.com/reference/criar-cobranca-com-cartao-de-credito
      x-acao-canonica: criar
      security:
      - accessToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                customer:
                  description: Id do cliente no Asaas (cus_...).
                  type: string
                billingType:
                  description: 'Meio de pagamento: BOLETO, PIX, CREDIT_CARD ou UNDEFINED (o pagador escolhe na fatura).'
                  type: string
                  enum:
                  - UNDEFINED
                  - BOLETO
                  - CREDIT_CARD
                  - PIX
                value:
                  description: Valor em reais, com ponto decimal.
                  type: number
                dueDate:
                  description: Data de vencimento (AAAA-MM-DD).
                  type: string
                  format: date
                description:
                  description: Texto descritivo (até 500 caracteres onde aplicável).
                  type: string
                daysAfterDueDateToRegistrationCancellation:
                  description: 'Boleto: quantos dias após o vencimento o registro é baixado.'
                  type: integer
                externalReference:
                  description: Seu identificador interno para este registro; útil em buscas e conciliação.
                  type: string
                installmentCount:
                  description: Quantidade de parcelas.
                  type: integer
                totalValue:
                  description: Valor total a ser dividido entre as parcelas.
                  type: number
                installmentValue:
                  description: Valor de cada parcela (alternativa a totalValue).
                  type: number
                discount:
                  description: Objeto de desconto por pagamento antecipado.
                  type: object
                  properties:
                    value:
                      description: Valor ou percentual do desconto.
                      type: number
                    dueDateLimitDays:
