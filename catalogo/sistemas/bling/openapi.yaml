        description: Número da página (começa em 1). Avance até receber menos registros que o limite.
        schema:
          type: integer
      - name: limite
        in: query
        required: false
        description: Registros por página; padrão 100. Máximo aceito não informado na doc.
        schema:
          type: integer
      - name: tipo
        in: query
        required: false
        description: 0 todas, 1 despesa, 2 receita, 3 receita e despesa.
        schema:
          type: integer
          enum:
          - 0
          - 1
          - 2
          - 3
      - name: situacao
        in: query
        required: false
        description: 0 ativas e inativas, 1 ativas, 2 inativas.
        schema:
          type: integer
          enum:
          - 0
          - 1
          - 2
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                data:
                - id: 3344
                  idCategoriaPai: 0
                  descricao: Vendas de mercadorias
                  tipo: 2
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '429':
          $ref: '#/components/responses/Erro429'
