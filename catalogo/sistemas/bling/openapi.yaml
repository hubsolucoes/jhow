openapi: 3.1.0
info:
  title: Bling API v3 (reconstrução do catálogo)
  version: '3.0'
  description: 'Reconstrução parcial e autoral da API v3 do Bling para o catálogo (endpoints canônicos). Base: spec oficial
    https://developer.bling.com.br/build/assets/openapi-DKXp8d1e.json e guias em developer.bling.com.br, consultados em 2026-09-17.
    Não há sandbox separado; o segundo servidor é o ambiente de teste usado pelo console da documentação oficial (uso não
    documentado).'
  x-data-consulta: '2026-09-17'
servers:
- url: https://api.bling.com.br/Api/v3
  description: Produção
- url: https://developer.bling.com.br/api/bling
  description: 'Sandbox: não existe; ambiente de teste do console da documentação (declarado na spec oficial, uso não documentado)'
security:
- oauth2Bling: []
paths:
  /oauth/authorize:
    get:
      operationId: bling__autenticacao__autenticar__authorize
      summary: OAuth 2.0 - endpoint authorize (redirecionamento do usuário)
      description: 'Início do fluxo authorization code: o navegador do usuário é enviado ao Bling, que pede login e consentimento
        e devolve um code de uso único na URL de redirecionamento cadastrada no aplicativo.


        Quando usar: Primeira conexão de uma conta Bling ao seu app, ou reautorização depois de revogação, troca de escopos
        ou refresh_token expirado (30 dias). Não é chamada server-to-server: é um link aberto no navegador.'
      tags:
      - Autenticacao
      x-confianca: verificado
      x-fonte-url: https://developer.bling.com.br/aplicativos#authorization-code
      x-entidade-canonica: Autenticacao
      x-acao-canonica: autenticar
      servers:
      - url: https://www.bling.com.br/Api/v3
      parameters:
      - name: response_type
        in: query
        required: true
        description: Sempre o literal code.
        schema:
          type: string
          enum:
          - code
      - name: client_id
        in: query
        required: true
        description: Client ID exibido na aba de informações do aplicativo.
        schema:
          type: string
      - name: state
        in: query
        required: true
        description: Valor aleatório por sessão, devolvido intacto no callback; compare para evitar CSRF. A doc do Postman
          indica que não pode ser vazio.
        schema:
          type: string
      responses:
        '302':
          description: Redireciona para o link cadastrado com code e state (ou error).
      security: []
  /oauth/token:
    post:
      operationId: bling__autenticacao__autenticar__token
      summary: OAuth 2.0 - endpoint token (authorization_code e refresh_token)
      description: 'Troca o code pelo par access_token/refresh_token ou renova o access_token com o refresh_token. Autenticação
        do app via HTTP Basic (client_id:client_secret em base64), corpo x-www-form-urlencoded.


        Quando usar: Logo após o callback do authorize (grant_type=authorization_code, até 1 minuto) e sempre que o access_token
        expirar ou a API devolver 401 invalid_token (grant_type=refresh_token). Sempre server-side.'
      tags:
      - Autenticacao
      x-confianca: verificado
      x-fonte-url: https://developer.bling.com.br/aplicativos#tokens-de-acesso
      x-entidade-canonica: Autenticacao
      x-acao-canonica: autenticar
      parameters:
      - name: enable-jwt
        in: header
        required: false
        description: Envie 1 para receber JWT; o token opaco está descontinuado (data de bloqueio ainda em definição). Mantenha
          também na renovação e nas chamadas da API.
        schema:
          type: string
          enum:
          - '1'
      - name: Accept
        in: header
        required: false
        description: Os exemplos oficiais enviam o valor 1.0 nesta chamada.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum:
                  - authorization_code
                  - refresh_token
                  description: authorization_code na troca inicial; refresh_token na renovação.
                code:
                  type: string
                  description: Obrigatório com grant_type=authorization_code. Validade de 1 minuto, uso único.
                refresh_token:
                  type: string
                  description: Obrigatório com grant_type=refresh_token. Validade de 30 dias.
              required:
              - grant_type
            example:
              grant_type: authorization_code
              code: <<CODE_DO_CALLBACK>>
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                access_token: <<SEU_ACCESS_TOKEN>>
                expires_in: 21600
                token_type: Bearer
                scope: <<IDS_DE_ESCOPO>>
                refresh_token: <<SEU_REFRESH_TOKEN>>
        '400':
          $ref: '#/components/responses/Erro400'
        '429':
          $ref: '#/components/responses/Erro429'
      security:
      - basicCliente: []
  /oauth/revoke:
    post:
      operationId: bling__autenticacao__autenticar__revogar
      summary: OAuth 2.0 - revogação de token (/oauth/revoke)
      description: 'Invalida um access_token ou refresh_token. Com revoke_action/revoke_target, remove todos os tokens do
        usuário ou da empresa (logout ou desinstalação).


        Quando usar: Quando o cliente desconecta o Bling no seu produto, ao desinstalar o app de uma empresa ou em incidente
        de segurança. Não use para renovar token.'
      tags:
      - Autenticacao
      x-confianca: inferido
      x-fonte-url: https://developer.bling.com.br/aplicativos#revogando-o-access-token
      x-entidade-canonica: Autenticacao
      x-acao-canonica: autenticar
      servers:
      - url: https://api.bling.com.br
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                token:
                  type: string
                  description: O access_token ou refresh_token a invalidar.
                token_type_hint:
                  type: string
                  enum:
                  - access_token
                  - refresh_token
                  description: Indica o tipo do token enviado.
                revoke_action:
                  type: string
                  enum:
                  - logout
                  - uninstall
                  description: Amplia a revogação. Sem ele, só o token enviado é revogado.
                revoke_target:
                  type: string
                  enum:
                  - user
                  - company
                  description: Alvo da revogação ampliada; padrão user.
              required:
              - token
            example:
              token: <<SEU_REFRESH_TOKEN>>
              token_type_hint: refresh_token
              revoke_action: uninstall
              revoke_target: company
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example: {}
        '400':
          $ref: '#/components/responses/Erro400'
      security:
      - basicCliente: []
  /empresas/me/dados-basicos:
    get:
      operationId: bling__empresa__obter
      summary: Obtém dados básicos da empresa
      description: 'Devolve os dados básicos da conta Bling que autorizou o app: id da empresa, nome, CNPJ, e-mail e data
        de início do contrato.


        Quando usar: Logo após autorizar, para descobrir a qual empresa pertence o token e guardar o id (é o companyId que
        chega nos webhooks). Útil para multiempresa/multitenant.'
      tags:
      - Empresa
      x-confianca: verificado
      x-fonte-url: https://developer.bling.com.br/referencia#/Empresas
      x-entidade-canonica: Empresa
      x-acao-canonica: obter
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                data:
                  id: <<ID_EMPRESA_HEX>>
                  nome: Empresa Exemplo LTDA
                  cnpj: 00.000.000/0001-91
                  email: financeiro@example.com
                  dataContrato: '2026-01-01'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '429':
          $ref: '#/components/responses/Erro429'
  /contatos:
    get:
      operationId: bling__pessoa__listar
      summary: Obtém contatos
      description: 'Lista contatos da conta (clientes, fornecedores, transportadoras etc. no mesmo cadastro), paginado por
        pagina/limite, com filtros por texto, documento, datas e tipo de contato.


        Quando usar: Sincronizar a carteira de clientes/fornecedores, localizar um contato pelo CPF/CNPJ antes de criar pedido
        ou nota e alimentar dashboards de clientes. Para um contato conhecido pelo ID, prefira bling.pessoa.obter.'
      tags:
      - Pessoa
      x-confianca: verificado
      x-fonte-url: https://developer.bling.com.br/referencia#/Contatos
      x-entidade-canonica: Pessoa
      x-acao-canonica: listar
      parameters:
      - name: pagina
        in: query
        required: false
        description: Número da página (começa em 1). Avance até receber menos registros que o limite.
        schema:
          type: integer
      - name: limite
        in: query
        required: false
        description: Registros por página; padrão 100. Máximo aceito não informado na doc.
        schema:
          type: integer
      - name: pesquisa
        in: query
        required: false
        description: Busca livre por nome, fantasia, CPF/CNPJ, e-mail ou código.
        schema:
          type: string
      - name: criterio
        in: query
        required: false
        description: 'Recorte da listagem: 1 todos, 2 excluídos, 3 últimos incluídos (padrão), 4 sem movimento.'
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
      - name: numeroDocumento
        in: query
        required: false
        description: CPF/CNPJ só com dígitos para localizar o contato.
        schema:
          type: string
      - name: tipoPessoa
        in: query
        required: false
        description: 1 física, 2 jurídica, 3 estrangeiro.
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
      - name: idTipoContato
        in: query
        required: false
        description: Filtra pelo tipo de contato (cliente, fornecedor...) - IDs vêm de GET /contatos/tipos.
        schema:
          type: integer
      - name: dataAlteracaoInicial
        in: query
        required: false
        description: Traz só registros alterados a partir deste momento (base para carga incremental).
        schema:
          type: string
      - name: dataAlteracaoFinal
        in: query
        required: false
        description: Limite superior da data de alteração.
        schema:
          type: string
      - name: dataInclusaoInicial
        in: query
        required: false
        description: Início do período de cadastro.
        schema:
          type: string
      - name: dataInclusaoFinal
        in: query
        required: false
        description: Fim do período de cadastro.
        schema:
          type: string
      - name: uf
        in: query
        required: false
        description: Sigla da UF do endereço.
        schema:
          type: string
      - name: idVendedor
        in: query
        required: false
        description: ID do vendedor cadastrado.
        schema:
          type: integer
      - name: idsContatos[]
        in: query
        required: false
        description: Lista de IDs para buscar vários contatos numa chamada.
        schema:
          type: array
          items:
            type: integer
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                data:
                - id: 12345678
                  nome: Cliente Exemplo LTDA
                  codigo: C001
                  situacao: A
                  numeroDocumento: 00.000.000/0001-91
                  telefone: (11) 0000-0000
                  celular: ''
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '429':
          $ref: '#/components/responses/Erro429'
    post:
      operationId: bling__pessoa__criar
      summary: Cria um contato
      description: 'Cadastra um contato (cliente, fornecedor ou ambos, conforme tiposContato) com documento, IE, endereços
        e dados financeiros.


        Quando usar: Antes de lançar pedido, proposta ou nota para alguém que ainda não existe no Bling. Procure antes por
        numeroDocumento em bling.pessoa.listar para não duplicar.'
      tags:
      - Pessoa
      x-confianca: verificado
      x-fonte-url: https://developer.bling.com.br/referencia#/Contatos
      x-entidade-canonica: Pessoa
      x-acao-canonica: criar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  description: Nome/razão social.
                tipo:
                  type: string
                  enum: &id001
                  - J
                  - F
                  - E
                  description: J jurídica, F física, E estrangeira.
                situacao:
                  type: string
                  enum: &id002
                  - A
                  - E
                  - I
                  - S
                  description: A ativo, E excluído, I inativo, S sem movimentação.
                numeroDocumento:
                  type: string
                  description: CPF ou CNPJ.
                codigo:
                  type: string
                  description: Código interno do contato (útil como id_externo).
                fantasia:
                  type: string
                  description: Nome fantasia.
                indicadorIe:
                  type: integer
                  enum: &id003
                  - 1
                  - 2
                  - 9
                  description: 1 contribuinte ICMS, 2 isento, 9 não contribuinte.
                ie:
                  type: string
                  description: Inscrição estadual.
                inscricaoMunicipal:
                  type: string
                  description: Inscrição municipal (PJ).
                email:
                  type: string
                  description: E-mail principal.
                emailNotaFiscal:
                  type: string
                  description: E-mail que recebe a NF-e.
                telefone:
                  type: string
                  description: Telefone fixo.
                celular:
                  type: string
                  description: Celular.
                endereco:
                  type: object
                  properties:
                    geral:
                      type: object
                      properties:
                        endereco:
                          type: string
                          description: Logradouro.
                        numero:
                          type: string
                          description: Número.
                        complemento:
                          type: string
                          description: Complemento.
                        bairro:
                          type: string
                          description: Bairro.
                        cep:
                          type: string
                          description: CEP.
                        municipio:
                          type: string
                          description: Nome do município.
                        uf:
                          type: string
                          description: UF.
                tiposContato:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: IDs dos tipos de contato (cliente, fornecedor...), obtidos em GET /contatos/tipos.
                vendedor:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Vendedor responsável.
                financeiro:
                  type: object
                  properties:
                    limiteCredito:
                      type: number
                      description: Limite de crédito do cliente.
              required:
              - nome
              - tipo
              - situacao
            example: &id004
              nome: Cliente Exemplo LTDA
              codigo: C001
              situacao: A
              tipo: J
              numeroDocumento: 00000000000191
              indicadorIe: 9
              email: compras@example.com
              telefone: (11) 0000-0000
              endereco:
                geral:
                  endereco: Rua Exemplo
                  numero: '100'
                  bairro: Centro
                  cep: '01000000'
                  municipio: São Paulo
                  uf: SP
              tiposContato:
              - id: 12345678
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              example:
                data:
                  id: 12345678
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '429':
          $ref: '#/components/responses/Erro429'
  /contatos/{idContato}:
    get:
      operationId: bling__pessoa__obter
      summary: Obtém um contato
      description: 'Retorna o cadastro completo de um contato: documento, IE, endereços geral e de cobrança, dados financeiros,
        vendedor e tipos de contato.


        Quando usar: Quando já tem o ID (vindo de pedido, nota ou listagem) e precisa do endereço/IE para faturar ou do papel
        (cliente/fornecedor).'
      tags:
      - Pessoa
      x-confianca: verificado
      x-fonte-url: https://developer.bling.com.br/referencia#/Contatos
      x-entidade-canonica: Pessoa
      x-acao-canonica: obter
      parameters:
      - name: idContato
        in: path
        required: true
        description: ID do contato no Bling.
        schema:
          type: integer
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                data:
                  id: 12345678
                  nome: Cliente Exemplo LTDA
                  tipo: J
                  numeroDocumento: 00000000000191
                  indicadorIe: 9
                  email: compras@example.com
                  endereco:
                    geral:
                      endereco: Rua Exemplo
                      numero: '100'
                      bairro: Centro
                      cep: 01000-000
                      municipio: São Paulo
                      uf: SP
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '429':
          $ref: '#/components/responses/Erro429'
    put:
      operationId: bling__pessoa__substituir
      summary: Altera um contato
      description: 'Regrava o cadastro do contato com o objeto enviado (PUT = atualização de todos os dados, segundo o guia
        REST do Bling).


        Quando usar: Sincronização de cadastro vinda de outro sistema-mestre. Para mudar só a situação use bling.pessoa.atualizar.situacao.'
      tags:
      - Pessoa
      x-confianca: verificado
      x-fonte-url: https://developer.bling.com.br/referencia#/Contatos
      x-entidade-canonica: Pessoa
      x-acao-canonica: substituir
      parameters:
      - name: idContato
        in: path
        required: true
        description: ID do contato.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nome:
                  type: string
                  description: Nome/razão social.
                tipo:
                  type: string
                  enum: *id001
                  description: J jurídica, F física, E estrangeira.
                situacao:
                  type: string
                  enum: *id002
                  description: A ativo, E excluído, I inativo, S sem movimentação.
                numeroDocumento:
                  type: string
                  description: CPF ou CNPJ.
                codigo:
                  type: string
                  description: Código interno do contato (útil como id_externo).
                fantasia:
                  type: string
                  description: Nome fantasia.
                indicadorIe:
                  type: integer
                  enum: *id003
                  description: 1 contribuinte ICMS, 2 isento, 9 não contribuinte.
                ie:
                  type: string
                  description: Inscrição estadual.
                inscricaoMunicipal:
                  type: string
                  description: Inscrição municipal (PJ).
                email:
                  type: string
                  description: E-mail principal.
              required:
              - nome
              - tipo
              - situacao
            example: *id004
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '429':
          $ref: '#/components/responses/Erro429'
    delete:
      operationId: bling__pessoa__excluir
      summary: Remove um contato
      description: 'Remove um contato pelo ID.


        Quando usar: Limpeza de cadastros criados por engano. Para apenas desativar, prefira mudar a situação para I (inativo).'
      tags:
      - Pessoa
      x-confianca: verificado
      x-fonte-url: https://developer.bling.com.br/referencia#/Contatos
      x-entidade-canonica: Pessoa
      x-acao-canonica: excluir
      parameters:
      - name: idContato
        in: path
        required: true
        description: ID do contato.
        schema:
          type: integer
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '429':
          $ref: '#/components/responses/Erro429'
  /contatos/{idContato}/situacoes:
    patch:
      operationId: bling__pessoa__atualizar__situacao
      summary: Altera a situação de um contato
      description: 'Altera apenas a situação do contato (ativo, inativo, excluído, sem movimentação).


        Quando usar: Inativar/reativar clientes ou fornecedores sem mexer no restante do cadastro.'
      tags:
      - Pessoa
      x-confianca: verificado
      x-fonte-url: https://developer.bling.com.br/referencia#/Contatos
      x-entidade-canonica: Pessoa
      x-acao-canonica: atualizar
      parameters:
      - name: idContato
        in: path
        required: true
        description: ID do contato.
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                situacao:
                  type: string
                  enum:
                  - A
                  - I
                  - E
                  - S
                  description: 'Nova situação: A, I, E ou S.'
            example:
              situacao: I
      responses:
        '204':
          description: Sucesso
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '404':
          $ref: '#/components/responses/Erro404'
        '429':
          $ref: '#/components/responses/Erro429'
  /produtos:
    get:
      operationId: bling__produto__listar
      summary: Obtém produtos
      description: 'Lista produtos e serviços com preço, código (SKU), situação, formato e saldo resumido, com filtros por
        tipo, categoria, loja, SKU, GTIN, datas e saldo.


        Quando usar: Carga do catálogo para e-commerce/BI, busca por SKU ou GTIN e acompanhamento de alterações (dataAlteracaoInicial).'
      tags:
      - Produto
      x-confianca: verificado
      x-fonte-url: https://developer.bling.com.br/referencia#/Produtos
      x-entidade-canonica: Produto
      x-acao-canonica: listar
      parameters:
      - name: pagina
        in: query
        required: false
        description: Número da página (começa em 1). Avance até receber menos registros que o limite.
        schema:
          type: integer
      - name: limite
        in: query
        required: false
        description: Registros por página; padrão 100. Máximo aceito não informado na doc.
        schema:
          type: integer
      - name: criterio
        in: query
        required: false
        description: 'Recorte: 1 últimos incluídos (padrão), 2 ativos, 3 inativos, 4 excluídos, 5 todos.'
        schema:
          type: integer
          enum:
          - 1
          - 2
          - 3
          - 4
          - 5
      - name: tipo
        in: query
        required: false
        description: T todos, P produtos, S serviços, E composições, PS produtos simples, C com variações, V variações.
        schema:
          type: string
          enum:
          - T
          - P
          - S
          - E
          - PS
          - C
          - V
