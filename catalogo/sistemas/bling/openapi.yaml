  /logisticas/remessas:
    post:
      operationId: bling__envio__criar__remessa
      summary: Cria uma remessa de postagem de uma logística
      description: 'Cria uma remessa (lista de postagem/PLP) agrupando objetos de uma logística.


        Quando usar: Fechamento do lote diário de postagem.'
      tags:
      - Envio
      x-confianca: inferido
      x-fonte-url: https://developer.bling.com.br/referencia#/Log%C3%ADsticas%20-%20Remessas
      x-entidade-canonica: Envio
      x-acao-canonica: criar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                numeroPlp:
                  type: string
                  description: Número da PLP/remessa.
                situacao:
                  type: integer
                  enum:
                  - -3
                  - -2
                  - -1
                  - 0
                  - 1
                  - 2
                  - 3
                  - 4
                  description: -3 a corrigir, -2 em processamento, -1 cancelado, 0 em aberto, ... (enum).
                descricao:
                  type: string
                  description: Descrição da remessa.
                logistica:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Logística.
                objetos:
                  type: array
                  description: Objetos logísticos incluídos (estrutura na referência).
              required:
              - numeroPlp
              - situacao
              - descricao
            example:
              numeroPlp: PLP-20260917
              situacao: 0
              descricao: Remessa_17092026
              logistica:
                id: 5566
              objetos:
              - id: 12345678
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              example:
                data:
                  id: 12345678
        '400':
          $ref: '#/components/responses/Erro400'
        '401':
          $ref: '#/components/responses/Erro401'
        '403':
          $ref: '#/components/responses/Erro403'
        '429':
          $ref: '#/components/responses/Erro429'
components:
  securitySchemes:
    oauth2Bling:
      type: oauth2
      description: 'Authorization code; access_token Bearer + header enable-jwt: 1'
      flows:
        authorizationCode:
          authorizationUrl: https://www.bling.com.br/Api/v3/oauth/authorize
          tokenUrl: https://api.bling.com.br/Api/v3/oauth/token
          refreshUrl: https://api.bling.com.br/Api/v3/oauth/token
          scopes: {}
    basicCliente:
      type: http
      scheme: basic
      description: client_id:client_secret do aplicativo
  schemas:
    Erro:
      type: object
      properties:
        error:
          type: object
          required:
          - type
          - message
          - description
          properties:
            type:
              type: string
              description: 'Ex.: VALIDATION_ERROR, MISSING_REQUIRED_FIELD_ERROR, UNAUTHORIZED, FORBIDDEN, RESOURCE_NOT_FOUND,
                TOO_MANY_REQUESTS, SERVER_ERROR, invalid_token, insufficient_scope'
            message:
              type: string
            description:
              type: string
            limit:
              type: integer
              description: Presente em 429 (3 ou 120000)
            period:
              type: string
              description: Presente em 429 (second ou day)
            fields:
              type: array
              items:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  element:
                    type: string
                  namespace:
                    type: string
                  collection:
                    type: array
                    items:
                      type: object
  responses:
    Erro400:
      description: Validação (VALIDATION_ERROR, MISSING_REQUIRED_FIELD_ERROR...)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro401:
      description: Token inválido/expirado (invalid_token)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro403:
      description: Escopo insuficiente (insufficient_scope)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro404:
      description: Recurso não encontrado (RESOURCE_NOT_FOUND)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro429:
      description: Limite de requisições (TOO_MANY_REQUESTS)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    Erro500:
      description: Erro interno (SERVER_ERROR)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
