    post:
      operationId: bling__nota_fiscal__criar__nfse
      summary: Cria uma nota de serviço
      description: 'Cria uma NFS-e (RPS) pendente com tomador, serviços, retenção de ISS, desconto e parcelas.


        Quando usar: Faturamento de serviços recorrentes ou avulsos gerado por outro sistema (contratos, agenda, CRM).'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://developer.bling.com.br/referencia#/Notas%20Fiscais%20de%20Servi%C3%A7o%20Eletr%C3%B4nicas
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: criar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                numeroRPS:
                  type: string
                  description: Número do RPS.
                serie:
                  type: string
                  description: Série do RPS.
                data:
                  type: string
                  format: date
                  description: Data usada na criação.
                contato:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Tomador (ID).
                    nome:
                      type: string
                      description: Nome do tomador.
                    numeroDocumento:
                      type: string
                      description: CPF/CNPJ do tomador.
                    email:
                      type: string
                      description: E-mail do tomador.
                    im:
                      type: string
                      description: Inscrição municipal do tomador.
                servicos:
                  type: array
                  items:
                    type: object
                    properties:
                      codigo:
                        type: string
                        description: Código do serviço (lista municipal/LC 116).
                      descricao:
                        type: string
                        description: Descrição do serviço.
                      valor:
                        type: number
                        description: Valor do serviço.
                reterISS:
                  type: boolean
                  description: Retém ISS; se omitido vale a configuração da conta.
                baseCalculo:
                  type: number
                  description: Base de cálculo.
                desconto:
                  type: number
                  description: Desconto.
                parcelas:
                  type: array
                  items:
                    type: object
                    properties:
                      data:
                        type: string
                        format: date
                        description: Vencimento da parcela.
              required:
              - numeroRPS
              - serie
            example:
              numeroRPS: '33'
              serie: '1'
              data: '2026-09-17'
              contato:
                id: 87654321
                nome: Tomador Exemplo LTDA
                numeroDocumento: 00000000000191
                email: fiscal@example.com
              servicos:
              - codigo: '10301'
                descricao: Consultoria
                valor: 1500.0
              reterISS: false
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              example:
                data:
                  id: 12345678
                  numeroRPS: '33'
                  serie: '1'
        '400':
