  /pagamentos:
    get:
      operationId: nomus__pagamento__listar
      summary: Listar pagamentos
      description: 'Lista os pagamentos lançados (saídas de caixa), com data, valor pago, juros/multa, desconto, pessoa, conta bancária, forma
        de pagamento, classificação financeira e o título a pagar baixado.


        Quando usar: Para fluxo de caixa realizado (saídas), conferência de pagamentos por fornecedor ou por conta bancária e conciliação com
        o extrato. Quando não usar: Não use para títulos ainda em aberto: esses estão em GET /contasPagar.


        Armadilhas: idContaPagar = 0 indica pagamento avulso, sem título vinculado. As datas trazem hora (''04/08/2026 00:00:00''). Valores são
        texto pt-BR.'
      tags:
      - Pagamento
      x-confianca: verificado
      x-fonte-url: https://documenter.getpostman.com/view/22813773/2s93JutNgM
      x-data-consulta: '2026-10-09'
