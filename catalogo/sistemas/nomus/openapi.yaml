  /contasPagar:
    get:
      operationId: nomus__conta_pagar__listar
      summary: Listar contas a pagar
      description: 'Lista os títulos a pagar com vencimento, valor, saldo, situação de baixa, fornecedor, empresa e conta bancária.


        Quando usar: Para programação de pagamentos, fluxo de caixa previsto e conferência de títulos em aberto por fornecedor. Recorte por dataVencimento.
        Quando não usar: Não use para saber o que já foi pago num período: as baixas efetivas estão em GET /pagamentos.


        Armadilhas: Os campos de valor das contas a pagar reaproveitam os nomes das contas a receber (valorReceber, saldoReceber, valorRecebido)
        e, no exemplo oficial, vêm negativos (''-5,00''). Ao somar com contas a receber, use o sinal como está; ao montar relatório de pagar,
        inverta o sinal se quiser valores positivos. Valores são texto pt-BR.'
