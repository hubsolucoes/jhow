      description: 'Devolve um título a receber pelo id, com os mesmos campos da listagem (valor, vencimento, saldo, baixa, cliente, conta bancária
        e classificação).


        Quando usar: Para conferir um título específico, por exemplo a partir do idContaReceber de um boleto ou de um recebimento. Quando não
        usar: Não use em laço para montar relatório: com o limite de 1 requisição a cada 20 s, a listagem com filtro query é muito mais barata.


        Armadilhas: A API não documenta a resposta para id inexistente (status e corpo). O registro pode conter o PDF do boleto em Base64 no campo
        boletoBancario.'
