openapi: 3.1.0
info:
  title: Nomus ERP — API REST (recorte do catálogo)
  version: coleção Postman publicada em 2023-03-14, consultada em 2026-10-09
  summary: Reconstrução das leituras e de quatro escritas de referência da API REST do Nomus ERP Industrial.
  description: Reconstruído a partir da coleção Postman oficial (https://documenter.getpostman.com/view/22813773/2s93JutNgM) e dos artigos da
    seção API REST da Central de Ajuda (https://atendimento.nomus.com.br/hc/pt-br/articles/35195281009819-Introdu%C3%A7%C3%A3o-%C3%A0-integra%C3%A7%C3%A3o-com-API-REST),
    consultados em 2026-10-09. As descrições são autorais; caminhos, parâmetros e campos são fatos técnicos e estão exatos. A Nomus não publica
    spec OpenAPI nem número de versão da API. As demais operações estão em endpoints.json > endpoints_secundarios.
  contact:
    name: Suporte Nomus
    url: https://atendimento.nomus.com.br/hc/pt-br
  x-fonte-url: https://documenter.getpostman.com/view/22813773/2s93JutNgM
  x-data-consulta: '2026-10-09'
externalDocs:
  description: Introdução à integração com API REST (Central de Ajuda Nomus)
  url: https://atendimento.nomus.com.br/hc/pt-br/articles/35195281009819-Introdu%C3%A7%C3%A3o-%C3%A0-integra%C3%A7%C3%A3o-com-API-REST
servers:
- url: https://{empresa}.nomus.com.br/{contexto}/rest
  description: Produção, um endereço por cliente (endereço do ERP + contexto + /rest). Instalações locais ou em servidor dedicado têm host próprio.
  variables:
    empresa:
      default: empresa
      description: Subdomínio do ERP do cliente.
    contexto:
      default: empresa
      description: Nome do contexto da aplicação; na coleção oficial é igual ao subdomínio.
x-sandbox: Não há sandbox público. O comparativo oficial de produtos diz que a instalação de base de testes é permitida no Nomus ERP Industrial
  (não no Start), sem publicar procedimento, endereço nem custo. Registrado em system.json > lacunas.
x-limite-requisicoes: '1 requisição a cada 20 segundos (comparativo oficial Nomus Start x Nomus ERP Industrial); excesso responde 429 com {"tempoAteLiberar":
  <segundos>}.'
security:
- ChaveIntegracaoREST: []
components:
  securitySchemes:
    ChaveIntegracaoREST:
      type: apiKey
      in: header
      name: Authorization
      description: Valor 'Basic ' seguido da chave do campo 'Chave de acesso para integração com o erp via REST' (tela Configuração Geral). A
        documentação descreve a chave 'em Base64'; não é o Basic usuário:senha.
  responses:
    Throttling:
      description: Limite de requisições atingido. Aguardar tempoAteLiberar segundos e repetir.
      content:
        application/json:
          schema:
            type: object
            properties:
              tempoAteLiberar:
                type: integer
          example:
            tempoAteLiberar: 20
paths:
  /contasReceber:
    get:
      operationId: nomus__conta_receber__listar
      summary: Listar contas a receber
      description: 'Lista os títulos a receber com valor, vencimento, saldo, situação de baixa, cliente, empresa, conta bancária, forma de pagamento
        e classificação financeira.


        Quando usar: Para aging de recebíveis, inadimplência, previsão de entradas e conferência com os recebimentos. Recorte por dataVencimento
        e, para títulos confirmados, por tipo==1. Quando não usar: Não use para saber quanto entrou de fato num período: as baixas com data e
        valor recebido estão em GET /recebimentos (nomus.pagamento.listar.recebimentos).


        Armadilhas: Valores chegam como texto no formato brasileiro (''11.245,57'') e precisam de conversão. Alguns registros trazem o PDF do
        boleto inteiro em Base64 no campo boletoBancario, o que deixa a página pesada: não use esse campo como coluna. Campos sem valor podem
        simplesmente não vir no JSON. O campo status é a situação de baixa (true = baixada), não um código de etapa.'
      tags:
      - ContaReceber
      x-confianca: verificado
      x-fonte-url: https://documenter.getpostman.com/view/22813773/2s93JutNgM
      x-data-consulta: '2026-10-09'
      x-id-canonico: nomus.conta_receber.listar
      x-entidade-canonica: ContaReceber
      x-acao-canonica: listar
      x-seguro-para-executar: true
      x-fonte-complementar-url: https://atendimento.nomus.com.br/hc/pt-br/articles/35195264712219-Contas-a-receber
      parameters:
      - name: pagina
        in: query
        required: false
        description: 'Número da página. Cada página traz no máximo 50 registros; sem o parâmetro a API devolve os 50 registros mais recentes.
          Não existe parâmetro de tamanho de página: o tamanho é fixo em 50.'
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: query
        in: query
        required: false
        description: 'Filtro na sintaxe da Nomus: campo==valor, com os operadores == != < <= > >=, '';'' para E e '','' para OU. Pode usar qualquer
          campo que o endpoint devolve. Datas vão no formato yyyy-MM-ddTHH:mm:ss. As datas são filtradas em formato ISO, mas voltam na resposta
          como dd/mm/aaaa. Texto com espaço vai entre aspas, ex.: municipio=="São Paulo".'
        schema:
          type: string
      responses:
        '200':
          description: Sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    classificacao:
                      type: string
                    cnpjPessoa:
                      type: string
                    dataAgendamento:
                      type: string
                      description: data dd/mm/aaaa
                    dataCompetencia:
                      type: string
                      description: data dd/mm/aaaa
                    dataHoraCriacao:
                      type: string
                      description: data e hora dd/mm/aaaa hh:mm:ss
                    dataModificacao:
                      type: string
                      description: data e hora dd/mm/aaaa hh:mm:ss
                    dataVencimento:
                      type: string
                      description: data dd/mm/aaaa
                    descricaoLancamento:
                      type: string
                    id:
                      type: integer
                    idClassificacao:
                      type: string
                    idContaBancaria:
                      type: integer
                    idEmpresa:
                      type: integer
                    idFormaPagamento:
                      type: integer
                    idPessoa:
                      type: integer
                    nomeClassificacao:
                      type: string
                    nomeContaBancaria:
                      type: string
                    nomeEmpresa:
                      type: string
                    nomeFormaPagamento:
                      type: string
                    nomePessoa:
                      type: string
                    saldoReceber:
                      type: string
                      description: decimal pt-BR
                    status:
                      type: boolean
                    tipo:
                      type: integer
                    valorReceber:
                      type: string
                      description: decimal pt-BR
                    valorReceberAgendado:
                      type: string
                      description: decimal pt-BR
                    valorRecebido:
                      type: string
                      description: decimal pt-BR
                    suspenderCobranca:
                      type: boolean
                    telefonePessoa:
                      type: string
                    comentarios:
                      type: string
                    dataBaixa:
                      type: string
                    linhaDigitavelBoleto:
                      type: string
                    boletoBancario:
                      type: string
              example:
              - classificacao: '10.01'
                cnpjPessoa: 00.000.000/0001-91
                dataAgendamento: 21/08/2026
                dataCompetencia: 13/08/2026
                dataHoraCriacao: 13/08/2026 16:17:43
                dataModificacao: 13/08/2026 16:17:45
                dataVencimento: 21/08/2026
                descricaoLancamento: Documento 10070 - Parcela 1 de 1
