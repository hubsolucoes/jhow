  /rec:
    post:
      tags:
      - Assinatura
      operationId: pix-bacen__assinatura__criar
      summary: Criar recorrência do Pix Automático
      description: 'Cria a recorrência (autorização de débito recorrente) do Pix Automático: o contrato entre recebedor e
        pagador que define objeto, periodicidade, data do primeiro pagamento, valor e política de retentativa. O PSP devolve
        o idRec de 29 caracteres.


        Quando usar: Primeiro passo de qualquer assinatura, mensalidade ou conta de consumo no Pix Automático. A recorrência
        nasce CRIADA e só vira APROVADA depois que o pagador autoriza no app do banco dele.'
      x-confianca: verificado
      x-fonte-url: https://github.com/bacen/pix-api/releases/tag/2.10.0
      x-entidade-canonica: Assinatura
      x-acao-canonica: criar
      x-seguro-para-executar: false
      security:
      - OAuth2:
        - rec.write
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                description: '{"idRec": "string de 29 caracteres", "status": "CRIADA", "vinculo": "objeto", "calendario":
                  "objeto", "valor": "objeto", "politicaRetentativa": "enum", "atualizacao": "array com o histórico de status"}'
              example:
                idRec: RR0000000020260801abcdefghijk
                vinculo: &id021
                  contrato: CT-2026-4210
                  objeto: Plano mensal Exemplo
                  devedor:
                    cpf: '00000000000'
                    nome: Fulano de Tal
                calendario: &id022
                  dataInicial: '2026-09-05'
                  periodicidade: MENSAL
                valor: &id023
                  valorRec: '99.90'
                recebedor: &id024
                  ispbParticipante: '00000000'
                  cnpj: 00000000000191
                  convenio: CONV-001
                status: CRIADA
                politicaRetentativa: PERMITE_3R_7D
                loc: &id025
                  id: 9001
                  location: pix.example.com/qr/v2/rec/2353c790eefb11eaadc10242ac120002
                  criacao: '2026-08-01T10:00:00.000Z'
                  idRec: RR0000000020260801abcdefghijk
                atualizacao:
                - status: CRIADA
                  data: '2026-08-01T10:00:00.000Z'
                ativacao: &id026
                  tipoJornada: JORNADA_3
        '400':
          description: RecOperacaoInvalida — A recorrência não respeita o schema ou está semanticamente errada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: AcessoNegado — Requisição de participante autenticado que viola alguma regra de autorização.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '503':
          description: ServicoIndisponivel — Serviço indisponível; pode estar em manutenção ou fora da janela de funcionamento.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '500':
          description: ErroInternoDoServidor — Condição inesperada ao processar a requisição.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                vinculo.contrato:
                  type: string
                  maxLength: 35
                  description: Número ou código do contrato/pedido que a recorrência representa.
                vinculo.objeto:
                  type: string
                  maxLength: 35
                  description: 'Texto livre que ajuda o pagador a reconhecer o que está autorizando (ex.: ''Plano mensal Exemplo'').'
                vinculo.devedor.cpf:
                  type: string
                  pattern: ^[0-9]{11}$
                  description: CPF do devedor da recorrência. Exclusivo com cnpj.
                vinculo.devedor.cnpj:
                  type: string
                  pattern: ^[0-9A-Z]{14}$
                  description: CNPJ do devedor. Exclusivo com cpf.
                vinculo.devedor.nome:
                  type: string
                  maxLength: 200
                  description: Nome ou razão social do devedor.
                calendario.dataInicial:
                  type: string
                  format: date
                  description: Data estimada do primeiro pagamento, em YYYY-MM-DD.
                calendario.dataFinal:
                  type: string
                  format: date
                  description: Fim da vigência, quando a autorização tem prazo definido.
                calendario.periodicidade:
                  type: string
                  enum:
                  - SEMANAL
                  - MENSAL
                  - TRIMESTRAL
                  - SEMESTRAL
                  - ANUAL
                  description: Intervalo entre as cobranças.
                valor.valorRec:
                  type: string
                  description: Valor fixo das parcelas, quando não varia. Omita em conta de consumo com valor variável.
                valor.valorMinimoRecebedor:
                  type: string
                  description: Piso definido pelo recebedor para o valor máximo que o pagador pode fixar.
                politicaRetentativa:
                  type: string
                  enum:
                  - NAO_PERMITE
                  - PERMITE_3R_7D
                  description: 'NAO_PERMITE: uma única tentativa. PERMITE_3R_7D: até 3 novas tentativas dentro de 7 dias após
                    o vencimento.'
                recebedor.convenio:
                  type: string
                  maxLength: 60
                  description: Convênio entre o recebedor e o PSP, usado para segmentar carteiras.
                loc:
                  type: integer
                  description: Id de uma location de recorrência (POST /locrec) para servir o QR composto.
                ativacao.dadosJornada:
                  type: object
                  description: Dados da jornada de autorização quando a ativação já nasce vinculada a uma cobrança (jornada
                    3).
              required:
              - vinculo.contrato
              - calendario.dataInicial
              - calendario.periodicidade
              - politicaRetentativa
            example:
              vinculo:
                contrato: CT-2026-4210
                objeto: Plano mensal Exemplo
                devedor:
                  cpf: '00000000000'
                  nome: Fulano de Tal
              calendario:
                dataInicial: '2026-09-05'
                periodicidade: MENSAL
              valor:
                valorRec: '99.90'
              politicaRetentativa: PERMITE_3R_7D
              recebedor:
                convenio: CONV-001
    get:
      tags:
      - Assinatura
      operationId: pix-bacen__assinatura__listar
      summary: Consultar lista de recorrências
      description: 'Lista as recorrências criadas no período, com filtros por devedor, status, convênio e presença de location.


        Quando usar: Planilha da base de assinantes: quantas autorizações foram criadas no mês, quantas o cliente aprovou,
        quantas caducaram sem resposta e quantas foram canceladas — a taxa de conversão da adesão ao Pix Automático.'
