      security:
      - OAuth2:
        - rec.read
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                description: '{"parametros": "objeto com filtros e paginacao", "recs": "array de RecCompleta"}'
              example:
                parametros:
                  inicio: '2026-08-01T00:00:00Z'
                  fim: '2026-08-31T23:59:59Z'
                  paginacao:
                    paginaAtual: 0
                    itensPorPagina: 100
                    quantidadeDePaginas: 1
                    quantidadeTotalDeItens: 57
                recs:
                - &id027
                  idRec: RR0000000020260801abcdefghijk
                  vinculo: *id021
                  calendario: *id022
                  valor: *id023
                  recebedor: *id024
                  status: APROVADA
                  politicaRetentativa: PERMITE_3R_7D
                  loc: *id025
                  atualizacao:
                  - &id028
                    status: CRIADA
                    data: '2026-08-01T10:00:00.000Z'
                  - &id029
                    status: APROVADA
                    data: '2026-08-01T10:07:41.000Z'
                  ativacao: *id026
        '400':
          description: RecConsultaInvalida — Parâmetros de consulta fora do schema ou sem sentido semântico.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: AcessoNegado — Requisição de participante autenticado que viola alguma regra de autorização.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '503':
          description: ServicoIndisponivel — Serviço indisponível; pode estar em manutenção ou fora da janela de funcionamento.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
      parameters:
      - name: inicio
        in: query
        required: true
        description: 'Limite inferior do período: devolve registros cuja data de criação da recorrência seja maior ou igual
          a este instante.'
        schema:
          type: string
          format: date-time
      - name: fim
        in: query
        required: true
        description: 'Limite superior do período: devolve registros cuja data de criação da recorrência seja menor ou igual
          a este instante.'
        schema:
          type: string
          format: date-time
      - name: cpf
        in: query
        required: false
        description: Filtra pelo CPF do devedor. Não pode ser combinado com cnpj.
        schema:
          type: string
          pattern: ^[0-9]{11}$
      - name: cnpj
        in: query
        required: false
        description: Filtra pelo CNPJ do devedor. Não pode ser combinado com cpf.
        schema:
          type: string
          pattern: ^[0-9A-Z]{14}$
      - name: status
        in: query
        required: false
        description: Filtra pelo status da recorrência.
        schema:
          type: string
          enum:
