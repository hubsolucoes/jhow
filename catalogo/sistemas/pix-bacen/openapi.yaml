openapi: 3.1.0
info:
  title: API Pix — padrão do Banco Central (reconstruída para o catálogo)
  version: 2.10.0
  summary: Contrato que todo PSP recebedor expõe ao usuário recebedor no arranjo Pix.
  description: 'Reconstrução, para uso do catálogo, da API Pix especificada pelo Banco Central do Brasil (repositório oficial
    bacen/pix-api, release 2.10.0 de 19/08/2026). Não substitui a especificação oficial: use-a como referência de integração.


    Base URL: o padrão do Banco Central define caminhos e schemas, não host. Quem hospeda a API é o PSP recebedor (banco ou
    instituição de pagamento) do cliente, e a especificação usa servidores fictícios (pix.example.com). Use a base publicada
    pelo seu PSP, com o major v2 no caminho, e uma base separada para homologação.


    Autenticação: OAuth 2.0 no fluxo client credentials sobre TLS mútuo obrigatório (RFC 8705). O certificado cliente emitido
    pelo PSP vai no handshake da chamada de token e de toda chamada da API; o access_token fica vinculado ao thumbprint desse
    certificado, e o token viaja em Authorization: Bearer. Não há refresh token: expirou, peça outro.


    Modelo de erro: RFC 7807 (application/problem+json) com type no padrão https://pix.bcb.gov.br/api/v2/error/<TipoErro>,
    mais title, status, detail, correlationId e, em erro de campo, o array violacoes[] com razao, propriedade e valor.


    O endpoint POST /oauth/token descrito aqui é ilustrativo: fica no Authorization Server do PSP, cujo caminho e TTL de token
    não são padronizados pelo arranjo.'
  contact:
    name: Suporte Pix — Banco Central do Brasil
    url: https://www.bcb.gov.br/estabilidadefinanceira/pix
  license:
    name: Apache 2.0
    identifier: Apache-2.0
externalDocs:
  description: Especificação oficial da API Pix (bacen/pix-api 2.10.0)
  url: https://github.com/bacen/pix-api/releases/tag/2.10.0
servers:
- url: https://{hostProducao}/{basePath}
  description: Produção — host definido por cada PSP recebedor; não existe base URL do Banco Central.
  variables:
    hostProducao:
      default: api.seupsp.com.br
      description: Host de produção publicado pelo seu PSP.
    basePath:
      default: pix/v2
      description: Caminho base; o major v2 do padrão aparece aqui.
- url: https://{hostHomologacao}/{basePath}
  description: Homologação/sandbox — ofertada por cada PSP; o Banco Central não publica sandbox.
  variables:
    hostHomologacao:
      default: api-h.seupsp.com.br
      description: Host de homologação publicado pelo seu PSP.
    basePath:
      default: pix/v2
      description: Caminho base de homologação.
tags:
- name: Cobranca
  description: cob, cobv, lotecobv, loc e cobr do Pix Automático
- name: Transacao
  description: Pix recebidos e devoluções
- name: Webhook
  description: webhook, webhookrec e webhookcobr
- name: Assinatura
  description: rec, solicrec e locrec do Pix Automático
- name: Autenticacao
  description: token OAuth2 no Authorization Server do PSP
paths:
  /cob/{txid}:
    put:
      tags:
      - Cobranca
      operationId: pix-bacen__cobranca__criar
      summary: Criar cobrança imediata (txid definido pelo recebedor)
      description: 'Cria uma cobrança Pix imediata (QR dinâmico sem vencimento) com um txid escolhido pelo usuário recebedor.
        Se o txid já existir e a cobrança estiver ATIVA, a chamada atualiza os campos enviados e incrementa a revisão.


        Quando usar: Forma recomendada de criar cobrança: como o txid é seu, a operação vira idempotente — repetir o PUT com
        o mesmo txid e o mesmo corpo não gera uma segunda cobrança, o que salva a integração em timeout e retry. Use o número
        do pedido/título do ERP dentro do txid para conciliar depois.'
      x-confianca: verificado
      x-fonte-url: https://github.com/bacen/pix-api/releases/tag/2.10.0
      x-entidade-canonica: Cobranca
      x-acao-canonica: criar
      x-seguro-para-executar: false
      security:
      - OAuth2:
        - cob.write
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                description: '{"calendario": {"criacao": "datetime", "expiracao": "integer"}, "txid": "string", "revisao":
                  "integer", "status": "CobStatus", "devedor": "objeto opcional", "valor": {"original": "string decimal"},
                  "chave": "string", "loc": "objeto location", "location": "string", "pixCopiaECola": "string (BR Code)"}'
              example: &id006
                calendario: &id001
                  criacao: '2026-08-12T14:02:11.358Z'
                  expiracao: 3600
                txid: pedido2026081200000000000042
                revisao: 0
                status: ATIVA
                devedor: &id002
                  cnpj: 00000000000191
                  nome: Comercio Exemplo Ltda
                valor: &id005
                  original: '149.90'
                  modalidadeAlteracao: 0
                chave: 00000000-0000-4000-8000-000000000000
                solicitacaoPagador: Pedido 4210
                loc: &id003
                  id: 7788
                  location: pix.example.com/qr/v2/2353c790eefb11eaadc10242ac120002
                  tipoCob: cob
                  criacao: '2026-08-12T14:02:11.001Z'
                location: pix.example.com/qr/v2/2353c790eefb11eaadc10242ac120002
                pixCopiaECola: 00020101021226870014br.gov.bcb.pix...6304ABCD
        '400':
          description: CobOperacaoInvalida — A requisição que cria ou altera a cobrança imediata não respeita o schema ou
            está semanticamente errada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: AcessoNegado — Requisição de participante autenticado que viola alguma regra de autorização.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '404':
          description: CobNaoEncontrado — Cobrança não encontrado(a).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '503':
          description: ServicoIndisponivel — Serviço indisponível; pode estar em manutenção ou fora da janela de funcionamento.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '500':
          description: ErroInternoDoServidor — Condição inesperada ao processar a requisição.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
      parameters:
      - name: txid
        in: path
        required: true
        description: Identificador da transação definido pelo usuário recebedor. Escolha um valor derivado do seu documento
          de origem, por exemplo o número do pedido com prefixo e padding.
        schema:
          type: string
          pattern: '[a-zA-Z0-9]{26,35}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                calendario.expiracao:
                  type: integer
                  minimum: 1
                  default: 3600
                  description: 'Tempo de vida da cobrança em segundos, contado da criação. Padrão do arranjo: 3600.'
                devedor.cpf:
                  type: string
                  pattern: ^[0-9]{11}$
                  description: CPF do devedor. Exclusivo com devedor.cnpj.
                devedor.cnpj:
                  type: string
                  pattern: ^[0-9A-Z]{14}$
                  description: CNPJ do devedor. Exclusivo com devedor.cpf.
                devedor.nome:
                  type: string
                  maxLength: 200
                  description: Nome ou razão social do devedor.
                valor.original:
                  type: string
                  description: Valor da cobrança em reais, como texto com duas casas decimais.
                valor.modalidadeAlteracao:
                  type: integer
                  enum: &id004
                  - 0
                  - 1
                  default: 0
                  description: 0 (padrão) não deixa o pagador alterar o valor; 1 permite valor aberto no app do pagador.
                chave:
                  type: string
                  maxLength: 77
                  description: Chave Pix do recebedor, registrada no DICT, que receberá o crédito.
                solicitacaoPagador:
                  type: string
                  maxLength: 140
                  description: 'Texto exibido ao pagador pedindo uma informação (ex.: número do pedido).'
                infoAdicionais:
                  type: array
                  description: Lista de pares {nome, valor} mostrados ao pagador no app. nome até 50 e valor até 200 caracteres.
                loc.id:
                  type: integer
                  description: Id de uma location criada em POST /loc, para servir o QR dinâmico nessa URL.
              required:
              - valor.original
            example:
              calendario:
                expiracao: 3600
              devedor:
                cnpj: 00000000000191
                nome: Comercio Exemplo Ltda
              valor:
                original: '149.90'
              chave: 00000000-0000-4000-8000-000000000000
              solicitacaoPagador: Pedido 4210
              infoAdicionais:
              - nome: Pedido
                valor: '4210'
    patch:
      tags:
      - Cobranca
      operationId: pix-bacen__cobranca__atualizar
      summary: Revisar cobrança imediata
      description: 'Altera campos de uma cobrança imediata ATIVA, incrementando revisao, ou remove a cobrança enviando status
        REMOVIDA_PELO_USUARIO_RECEBEDOR.


        Quando usar: Use para corrigir valor, devedor ou informações adicionais antes do pagamento, e para cancelar uma cobrança
        que não será mais paga — no Pix, cancelar é justamente este PATCH com status REMOVIDA_PELO_USUARIO_RECEBEDOR.'
      x-confianca: verificado
      x-fonte-url: https://github.com/bacen/pix-api/releases/tag/2.10.0
      x-entidade-canonica: Cobranca
      x-acao-canonica: atualizar
      x-seguro-para-executar: false
      security:
      - OAuth2:
        - cob.write
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                description: '{"txid": "string", "revisao": "integer incrementado", "status": "CobStatus", "valor": "objeto"}'
              example:
                calendario: *id001
                txid: pedido2026081200000000000042
                revisao: 1
                status: ATIVA
                devedor: *id002
                valor:
                  original: '159.90'
                  modalidadeAlteracao: 0
                chave: 00000000-0000-4000-8000-000000000000
                solicitacaoPagador: Pedido 4210
                loc: *id003
                location: pix.example.com/qr/v2/2353c790eefb11eaadc10242ac120002
                pixCopiaECola: 00020101021226870014br.gov.bcb.pix...6304ABCD
        '400':
          description: CobOperacaoInvalida — Cobrança não está ATIVA, ou a remoção veio junto com outras alterações.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: AcessoNegado — Requisição de participante autenticado que viola alguma regra de autorização.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '404':
          description: CobNaoEncontrado — Cobrança não encontrado(a).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '503':
          description: ServicoIndisponivel — Serviço indisponível; pode estar em manutenção ou fora da janela de funcionamento.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
      parameters:
      - name: txid
        in: path
        required: true
        description: Identificador da transação definido pelo usuário recebedor.
        schema:
          type: string
          pattern: '[a-zA-Z0-9]{26,35}'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - REMOVIDA_PELO_USUARIO_RECEBEDOR
                  description: Envie REMOVIDA_PELO_USUARIO_RECEBEDOR para cancelar a cobrança.
                devedor.cpf:
                  type: string
                  pattern: ^[0-9]{11}$
                  description: CPF do devedor. Exclusivo com devedor.cnpj.
                devedor.cnpj:
                  type: string
                  pattern: ^[0-9A-Z]{14}$
                  description: CNPJ do devedor. Exclusivo com devedor.cpf.
                devedor.nome:
                  type: string
                  maxLength: 200
                  description: Nome ou razão social do devedor.
                valor.original:
                  type: string
                  description: Valor da cobrança em reais, como texto com duas casas decimais.
                valor.modalidadeAlteracao:
                  type: integer
                  enum: *id004
                  default: 0
                  description: 0 (padrão) não deixa o pagador alterar o valor; 1 permite valor aberto no app do pagador.
                chave:
                  type: string
                  maxLength: 77
                  description: Chave Pix do recebedor, registrada no DICT, que receberá o crédito.
                solicitacaoPagador:
                  type: string
                  maxLength: 140
                  description: 'Texto exibido ao pagador pedindo uma informação (ex.: número do pedido).'
                infoAdicionais:
                  type: array
                  description: Lista de pares {nome, valor} mostrados ao pagador no app. nome até 50 e valor até 200 caracteres.
                loc.id:
                  type: integer
                  description: Id de uma location criada em POST /loc, para servir o QR dinâmico nessa URL.
              required:
              - valor.original
            example:
              valor:
                original: '159.90'
              solicitacaoPagador: Pedido 4210 - revisado
    get:
      tags:
      - Cobranca
      operationId: pix-bacen__cobranca__obter
      summary: Consultar cobrança imediata
      description: 'Devolve uma cobrança imediata pelo txid, com status, valores, BR Code e o array pix[] com os pagamentos
        já liquidados e suas devoluções.


        Quando usar: É a confirmação oficial de que um Pix foi recebido: o webhook é só um aviso sem assinatura, então consulte
        aqui (ou GET /pix) antes de liberar pedido ou dar baixa no título. Também serve para recuperar uma revisão anterior.'
      x-confianca: verificado
      x-fonte-url: https://github.com/bacen/pix-api/releases/tag/2.10.0
      x-entidade-canonica: Cobranca
      x-acao-canonica: obter
      x-seguro-para-executar: true
      security:
      - OAuth2:
        - cob.read
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                description: '{"calendario": "objeto", "txid": "string", "revisao": "integer", "status": "CobStatus", "valor":
                  "objeto", "chave": "string", "pixCopiaECola": "string", "pix": "array de Pix liquidados, com endToEndId,
                  valor, horario e devolucoes[]"}'
              example:
                calendario: *id001
                txid: pedido2026081200000000000042
                revisao: 0
                status: CONCLUIDA
                devedor: *id002
                valor: *id005
                chave: 00000000-0000-4000-8000-000000000000
                solicitacaoPagador: Pedido 4210
                loc: *id003
                location: pix.example.com/qr/v2/2353c790eefb11eaadc10242ac120002
                pixCopiaECola: 00020101021226870014br.gov.bcb.pix...6304ABCD
                pix:
                - endToEndId: E00000000202608121402abcdef123456
                  txid: pedido2026081200000000000042
                  valor: '149.90'
                  horario: '2026-08-12T14:09:52.771Z'
                  infoPagador: Pedido 4210
        '404':
          description: CobNaoEncontrado — Cobrança não encontrado(a).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '400':
          description: CobConsultaInvalida — Parâmetros de consulta fora do schema ou sem sentido semântico.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: AcessoNegado — Requisição de participante autenticado que viola alguma regra de autorização.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '503':
          description: ServicoIndisponivel — Serviço indisponível; pode estar em manutenção ou fora da janela de funcionamento.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '410':
          description: PermanentementeRemovido — A entidade existiu e foi removida em definitivo.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
      parameters:
      - name: txid
        in: path
        required: true
        description: Identificador da transação definido pelo usuário recebedor.
        schema:
          type: string
          pattern: '[a-zA-Z0-9]{26,35}'
      - name: revisao
        in: query
        required: false
        description: Recupera uma revisão específica da cobrança. Sem o parâmetro, vem a revisão corrente.
        schema:
          type: integer
          minimum: 0
  /cob:
    post:
      tags:
      - Cobranca
      operationId: pix-bacen__cobranca__criar__cob_txid_psp
      summary: Criar cobrança imediata com txid gerado pelo PSP
      description: 'Cria uma cobrança Pix imediata deixando a geração do txid a cargo do PSP recebedor. O txid gerado volta
        no corpo da resposta.


        Quando usar: Use quando não houver um identificador próprio para amarrar à cobrança — carrinho anônimo, totem, doação.
        Para qualquer fluxo com pedido/título no ERP, prefira o PUT /cob/{txid}: o POST não é idempotente e uma retentativa
        por timeout cria uma segunda cobrança.'
      x-confianca: verificado
      x-fonte-url: https://github.com/bacen/pix-api/releases/tag/2.10.0
      x-entidade-canonica: Cobranca
      x-acao-canonica: criar
      x-seguro-para-executar: false
      security:
      - OAuth2:
        - cob.write
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                description: '{"txid": "string gerado pelo PSP", "revisao": "integer", "status": "CobStatus", "calendario":
                  "objeto", "valor": "objeto", "location": "string", "pixCopiaECola": "string"}'
              example:
                calendario: *id001
                txid: 7978c0c97ea847e78e8849634473c1f1
                revisao: 0
                status: ATIVA
                devedor: *id002
                valor:
                  original: '45.00'
                  modalidadeAlteracao: 0
                chave: 00000000-0000-4000-8000-000000000000
                solicitacaoPagador: Doacao campanha 2026
                loc: *id003
                location: pix.example.com/qr/v2/2353c790eefb11eaadc10242ac120002
                pixCopiaECola: 00020101021226870014br.gov.bcb.pix...6304ABCD
        '400':
          description: CobOperacaoInvalida — Corpo fora do schema ou semanticamente inválido.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: AcessoNegado — Requisição de participante autenticado que viola alguma regra de autorização.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '503':
          description: ServicoIndisponivel — Serviço indisponível; pode estar em manutenção ou fora da janela de funcionamento.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '500':
          description: ErroInternoDoServidor — Condição inesperada ao processar a requisição.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                calendario.expiracao:
                  type: integer
                  minimum: 1
                  default: 3600
                  description: Tempo de vida da cobrança em segundos a partir da criação.
                devedor.cpf:
                  type: string
                  pattern: ^[0-9]{11}$
                  description: CPF do devedor. Exclusivo com devedor.cnpj.
                devedor.cnpj:
                  type: string
                  pattern: ^[0-9A-Z]{14}$
                  description: CNPJ do devedor. Exclusivo com devedor.cpf.
                devedor.nome:
                  type: string
                  maxLength: 200
                  description: Nome ou razão social do devedor.
                valor.original:
                  type: string
                  description: Valor da cobrança em reais, como texto com duas casas decimais.
                valor.modalidadeAlteracao:
                  type: integer
                  enum: *id004
                  default: 0
                  description: 0 (padrão) não deixa o pagador alterar o valor; 1 permite valor aberto no app do pagador.
                chave:
                  type: string
                  maxLength: 77
                  description: Chave Pix do recebedor, registrada no DICT, que receberá o crédito.
                solicitacaoPagador:
                  type: string
                  maxLength: 140
                  description: 'Texto exibido ao pagador pedindo uma informação (ex.: número do pedido).'
                infoAdicionais:
                  type: array
                  description: Lista de pares {nome, valor} mostrados ao pagador no app. nome até 50 e valor até 200 caracteres.
                loc.id:
                  type: integer
                  description: Id de uma location criada em POST /loc, para servir o QR dinâmico nessa URL.
              required:
              - valor.original
            example:
              calendario:
                expiracao: 900
              valor:
                original: '45.00'
              chave: 00000000-0000-4000-8000-000000000000
              solicitacaoPagador: Doacao campanha 2026
    get:
      tags:
      - Cobranca
      operationId: pix-bacen__cobranca__listar
      summary: Consultar lista de cobranças imediatas
      description: 'Lista cobranças imediatas criadas dentro de um período, com filtros por CPF/CNPJ do devedor, status e
        presença de location, e paginação por página.


        Quando usar: É a consulta que alimenta planilha de cobranças emitidas: quantas foram geradas no mês, quais continuam
        ATIVA e quais já foram pagas. Para extrato de dinheiro recebido, use GET /pix — aqui aparecem cobranças, inclusive
        as nunca pagas.'
      x-confianca: verificado
      x-fonte-url: https://github.com/bacen/pix-api/releases/tag/2.10.0
      x-entidade-canonica: Cobranca
      x-acao-canonica: listar
      x-seguro-para-executar: true
      security:
      - OAuth2:
        - cob.read
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                description: '{"parametros": {"inicio": "datetime", "fim": "datetime", "paginacao": {"paginaAtual": "integer",
                  "itensPorPagina": "integer", "quantidadeDePaginas": "integer", "quantidadeTotalDeItens": "integer"}}, "cobs":
                  "array de CobCompleta"}'
              example:
                parametros:
                  inicio: '2026-08-01T00:00:00Z'
                  fim: '2026-08-31T23:59:59Z'
                  paginacao:
                    paginaAtual: 0
                    itensPorPagina: 100
                    quantidadeDePaginas: 3
                    quantidadeTotalDeItens: 214
                cobs:
                - *id006
        '400':
          description: CobConsultaInvalida — Parâmetros de consulta fora do schema ou sem sentido semântico.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '403':
          description: AcessoNegado — Requisição de participante autenticado que viola alguma regra de autorização.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '503':
          description: ServicoIndisponivel — Serviço indisponível; pode estar em manutenção ou fora da janela de funcionamento.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problema'
        '504':
