  /v1/payments/search:
    get:
      operationId: mercado-pago__cobranca__listar
      summary: Buscar em pagamentos
      description: 'Busca pagamentos da conta com filtros de período, ordenação e referência externa. A resposta é um envelope
        com paging (total, limit, offset) e results[] com os pagamentos completos. Cobre apenas os últimos doze meses contados
        da data da consulta.


        Quando usar: É o endpoint central para extrair vendas para planilha, Power BI e conciliação: aprovados, recusados,
        estornados, por meio de pagamento e por período. Para integrações no Checkout Transparente novo, o equivalente é GET
        /v1/orders.'
