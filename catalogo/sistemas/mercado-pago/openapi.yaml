  /v1/payments:
    post:
      operationId: mercado-pago__cobranca__criar
      summary: Criar pagamento
      description: 'Cria um pagamento na Payments API: cartão de crédito/débito com token gerado no frontend, Pix (payment_method_id=pix,
        resposta com QR code em point_of_interaction) ou boleto (payment_method_id=bolbradesco). É a API clássica do Checkout
        Transparente.


        Quando usar: Quando a integração já roda na Payments API, ou quando um recurso ainda não existe na Orders API. Para
        integração NOVA, a documentação recomenda a Orders API: a Payments API continua funcionando, mas só recebe correções
        de segurança e estabilidade.'
      tags:
      - Cobranca
      x-confianca: verificado
      x-fonte-url: https://www.mercadopago.com.br/developers/pt/reference/online-payments/checkout-api-payments/create-payment/post
      x-entidade-canonica: Cobranca
      x-acao-canonica: criar
      x-data-consulta: '2026-09-17'
      security:
      - bearerAuth: []
      parameters:
      - name: X-Idempotency-Key
        in: header
        required: true
        description: Chave única da requisição (UUID v4 recomendado). Evita criar dois pagamentos iguais ao repetir a chamada.
        schema:
          type: string
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                  status:
                    type: string
                  status_detail:
                    type: string
                  date_created:
                    type: string
                  date_approved:
                    type: string
                  date_last_updated:
                    type: string
                  date_of_expiration:
                    type: string
                  money_release_date:
                    type: string
                  payment_method_id:
                    type: string
                  payment_type_id:
                    type: string
                  currency_id:
                    type: string
                  transaction_amount:
                    type: number
                  transaction_amount_refunded:
                    type: number
                  external_reference:
                    type: string
                  description:
                    type: string
                  live_mode:
                    type: boolean
                  collector_id:
                    type: number
                  payer:
                    type: object
                  transaction_details:
                    type: object
                  fee_details:
                    type: array
                  captured:
                    type: boolean
                  installments:
                    type: number
                  card:
                    type: object
                  point_of_interaction:
                    type: object
              example:
                id: 20359978
                status: pending
                status_detail: pending_waiting_transfer
                date_created: '2026-09-17T14:47:58.000-03:00'
                date_approved: null
                date_of_expiration: '2026-09-18T18:00:00.000-03:00'
                payment_method_id: pix
                payment_type_id: bank_transfer
                currency_id: BRL
                transaction_amount: 50.0
                transaction_amount_refunded: 0
                external_reference: PEDIDO-2026-0001
                description: Pedido 2026-0001
                live_mode: false
                collector_id: 448876418
                payer:
                  email: comprador@example.com
                  identification:
                    type: CPF
                    number: '00000000000'
                transaction_details:
                  net_received_amount: 0
                  total_paid_amount: 50.0
        '400':
          description: '1: Params Error: algum parâmetro está ausente ou malformado.'
        '401':
          description: 'unauthorized: Access Token ausente, inválido ou do ambiente errado. Confirmado em 2026-09-17: a resposta
            vem como {"message":"Unauthorized use of live credentials","error":"unauthorized","status":401,"cause":[{"code":7,...}]}.'
        '403':
          description: '4: O chamador não tem autorização para acessar o recurso.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transaction_amount:
                  type: number
                  description: Valor do pagamento, com até duas casas decimais.
                payment_method_id:
                  type: string
                  description: 'Identificador do meio: pix, bolbradesco, visa, master, elo, amex... Lista completa em GET
                    /v1/payment_methods.'
                token:
                  type: string
                  description: Token do cartão gerado no frontend pelo MercadoPago.js. Uso único e validade curta.
                installments:
                  type: number
                  description: Número de parcelas no cartão.
                issuer_id:
                  type: string
                  description: Identificador do banco emissor do cartão.
                description:
                  type: string
                  description: Descrição que aparece para o comprador e no extrato do Mercado Pago.
                external_reference:
                  type: string
                  description: Sua referência interna; é a chave de conciliação com o ERP.
                notification_url:
                  type: string
                  description: URL que receberá o webhook deste pagamento.
                callback_url:
                  type: string
                  description: URL de retorno do comprador.
                date_of_expiration:
                  type: string
                  description: 'Vencimento do pagamento, no formato yyyy-MM-dd''T''HH:mm:ssz (ex.: 2026-11-17T09:37:52.000-03:00).'
                  format: date-time
                capture:
                  type: boolean
                  description: false reserva o valor no cartão sem debitar (captura diferida); true captura na hora.
                binary_mode:
                  type: boolean
                  description: true força o resultado a ser só aprovado ou recusado, sem estado pendente de análise.
                statement_descriptor:
                  type: string
                  description: Texto que aparece na fatura do cartão do comprador.
                application_fee:
                  type: number
                  description: Comissão da plataforma em integrações de marketplace.
                coupon_amount:
                  type: number
                  description: Valor do desconto de cupom.
                metadata:
                  type: object
                  description: Objeto livre para dados seus; volta nas consultas.
                payer:
                  type: object
                  description: Objeto composto; veja os campos com notação de ponto em endpoints.json.
                additional_info:
                  type: object
                  description: Dados extras (itens, endereço de entrega, dados do comprador) repassados às camadas de antifraude
                    e de impostos. Melhora a taxa de aprovação.
              required:
              - transaction_amount
              - payer
