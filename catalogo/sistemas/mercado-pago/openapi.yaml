openapi: 3.1.0
info:
  title: Mercado Pago — API reconstruída para o catálogo
  version: v1-2026-09-17
  description: Reconstrução da API REST do Mercado Pago a partir da referência oficial em mercadopago.com.br/developers (pt-BR),
    consultada em 2026-09-17. O Mercado Pago não publica OpenAPI oficial. Cobre autenticação OAuth, Orders API (Checkout Transparente
    recomendado), Payments API (legado em manutenção), preferências do Checkout Pro, pedidos comerciais, clientes e cartões,
    assinaturas e relatórios financeiros. Endpoints não detalhados estão em endpoints.json > endpoints_secundarios.
  contact:
    url: https://www.mercadopago.com.br/developers/pt/support/center
  license:
    name: Termos de uso do Mercado Pago
    url: https://www.mercadopago.com.br/developers/pt/docs/resources/legal/terms-and-conditions
servers:
- url: https://api.mercadopago.com
  description: Produção — use Access Token APP_USR-...
- url: https://api.mercadopago.com
  description: Teste/sandbox — MESMA URL, com Access Token TEST-... (ou credenciais de produção de um usuário de teste na
    Orders API)
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: 'Access Token da aplicação. O prefixo define o ambiente: TEST- para teste, APP_USR- para produção.'
security:
- bearerAuth: []
tags:
- name: Assinatura
- name: Autenticacao
- name: Cliente
- name: Cobranca
- name: Pedido
- name: TabelaAuxiliar
- name: Transacao
paths:
  /oauth/token:
    post:
      operationId: mercado-pago__autenticacao__autenticar
      summary: Criar e atualizar token
      description: 'Emite ou renova o Access Token de uma aplicação Mercado Pago. Atende os três fluxos OAuth 2.0 suportados:
        authorization_code (o vendedor autoriza a plataforma por redirecionamento), refresh_token (renova sem interação) e
        client_credentials (token da própria aplicação, sem usuário).


        Quando usar: Em integrações de marketplace ou plataforma, quando você cobra em nome de outros vendedores e precisa
        de um token por vendedor. Para operar só na sua conta, não use este endpoint: copie o Access Token direto do painel
        Suas integrações.'
      tags:
      - Autenticacao
      x-confianca: verificado
      x-fonte-url: https://www.mercadopago.com.br/developers/pt/reference/authentication/oauth/_oauth_token/post
      x-entidade-canonica: Autenticacao
      x-acao-canonica: autenticar
      x-data-consulta: '2026-09-17'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                  expires_in:
                    type: number
                  scope:
                    type: string
                  user_id:
                    type: number
                  refresh_token:
                    type: string
                  public_key:
                    type: string
                  live_mode:
                    type: boolean
              example:
                access_token: APP_USR-0000000000000000-000000-xxxxxxxxxxxxxxxx-000000000
                token_type: bearer
                expires_in: 15552000
                scope: read write offline_access
                user_id: 241983636
                refresh_token: TG-0000000000000000-241983636
                public_key: APP_USR-00000000-0000-0000-0000-000000000000
                live_mode: true
        '400':
          description: 'invalid_client: client_id e/ou client_secret errados.'
        '429':
          description: 'local_rate_limited: Limitação de taxa no endpoint de token.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                client_id:
                  type: string
                  description: Identificador único da sua aplicação (par de credenciais Client ID/Client Secret do painel).
                client_secret:
                  type: string
                  description: Chave privada da aplicação. Nunca exponha no frontend.
                grant_type:
                  type: string
                  description: Fluxo desejado.
                  enum:
                  - authorization_code
                  - refresh_token
                  - client_credentials
                code:
                  type: string
                  description: Código devolvido pelo servidor de autorização no redirecionamento. Vale 10 minutos. Obrigatório
                    quando grant_type=authorization_code.
                redirect_uri:
                  type: string
                  description: URL estática cadastrada no campo Redirect URLs da aplicação. Obrigatória quando grant_type=authorization_code
                    e precisa bater exatamente com a cadastrada.
                code_verifier:
                  type: string
                  description: Verificador PKCE, quando a aplicação usa PKCE no fluxo authorization_code.
                refresh_token:
                  type: string
                  description: Concessão temporária recebida junto do Access Token. Obrigatória quando grant_type=refresh_token.
                test_token:
                  type: string
                  description: Enviar com valor true apenas quando se quer gerar credenciais de teste.
              required:
              - client_id
              - client_secret
              - grant_type
  /v1/orders:
    post:
      operationId: mercado-pago__cobranca__criar__order
      summary: Criar order
      description: 'Cria uma order do Checkout Transparente, que é o contêiner da venda e das transações de pagamento. Em
        processing_mode=automatic a order já é processada na mesma chamada; em manual ela nasce com status created e devolve
        um client_token para o frontend completar o pagamento. É por aqui que se emitem Pix (payment_method.id=pix, type=bank_transfer),
        boleto (id=boleto, type=ticket) e cartão tokenizado.


        Quando usar: Integração nova de Checkout Transparente. A documentação recomenda a Orders API para quem está começando;
        a Payments API antiga continua funcionando, mas só recebe correções de segurança e estabilidade.'
      tags:
      - Cobranca
      x-confianca: verificado
      x-fonte-url: https://www.mercadopago.com.br/developers/pt/reference/online-payments/checkout-api/create-order/post
      x-entidade-canonica: Cobranca
      x-acao-canonica: criar
      x-data-consulta: '2026-09-17'
      security:
      - bearerAuth: []
      parameters:
      - name: X-Idempotency-Key
        in: header
        required: true
        description: Chave única da requisição (UUID v4 recomendado), de 1 a 128 caracteres. Repetir a mesma chave não cria
          uma segunda order.
        schema:
          type: string
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  processing_mode:
                    type: string
                  status:
                    type: string
                  status_detail:
                    type: string
                  external_reference:
                    type: string
                  total_amount:
                    type: string
                  total_paid_amount:
                    type: string
                  country_code:
                    type: string
                  created_date:
                    type: string
                  last_updated_date:
                    type: string
                  client_token:
                    type: string
                  transactions:
                    type: object
                    properties:
                      payments:
                        type: array
                  items:
                    type: array
              example:
                id: ORD01J49MMW3SSBK5PSV3DFR32959
                type: online
                processing_mode: automatic
                external_reference: PEDIDO-2026-0001
                total_amount: '50.00'
                status: processed
                status_detail: accredited
                country_code: BR
                created_date: '2026-09-17T13:06:51.045Z'
                last_updated_date: '2026-09-17T13:06:51.045Z'
                transactions:
                  payments:
                  - id: PAY01J67CQQH5904WDBVZEM4JMEP3
                    amount: '50.00'
                    status: processed
                    status_detail: accredited
                    payment_method:
                      id: pix
                      type: bank_transfer
        '400':
          description: 'empty_required_header: Header X-Idempotency-Key obrigatório não enviado.'
        '409':
          description: 'idempotency_key_already_used: A chave de idempotência já foi usada em outra requisição.'
        '402':
          description: '402: A order foi criada mas alguma transação falhou.'
        '401':
          description: '401: Access Token ausente, inválido, revogado ou do ambiente errado (TEST- x APP_USR-).'
        '403':
          description: 'forbidden: A aplicação não tem permissão/escopo para o recurso.'
        '429':
          description: 'too_many_requests: Limite de requisições do Client ID atingido no gateway.'
        '500':
          description: 'internal_error: Erro genérico do servidor.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: Tipo da order. Para pagamento online, o único valor possível é online.
                  enum:
                  - online
                processing_mode:
                  type: string
                  description: Define se a transação é processada na criação (automatic) ou depois, em etapas (manual).
                  enum:
                  - automatic
                  - manual
                capture_mode:
                  type: string
                  description: Como o valor é capturado. automatic captura junto com a autorização; manual reserva o valor
                    no cartão para captura posterior; automatic_async permite processamento assíncrono.
                  enum:
                  - automatic
                  - manual
                  - automatic_async
                total_amount:
                  type: string
                  description: 'Valor total da order, como string decimal (ex.: "50.00").'
                external_reference:
                  type: string
                  description: Sua referência interna. Máximo 64 caracteres, só números, letras, hífen e underscore. Obrigatória
                    para Pix.
                description:
                  type: string
                  description: Descrição da venda.
                transactions:
                  type: object
                  description: Objeto composto; veja os campos com notação de ponto em endpoints.json.
                payer:
                  type: object
                  description: Objeto composto; veja os campos com notação de ponto em endpoints.json.
                items:
                  type: array
                  description: Itens da venda (title, unit_price, quantity, description, external_code, category_id...).
                  items: {}
                shipment:
                  type: object
                  description: Objeto composto; veja os campos com notação de ponto em endpoints.json.
                integration_data:
                  type: object
                  description: Objeto composto; veja os campos com notação de ponto em endpoints.json.
                config:
                  type: object
                  description: Objeto composto; veja os campos com notação de ponto em endpoints.json.
              required:
              - total_amount
              - payer
    get:
      operationId: mercado-pago__cobranca__listar__orders
      summary: Buscar order
      description: 'Busca orders do Checkout Transparente em lote, com filtros de período, status, meio de pagamento e referência
        externa, e paginação por página. O envelope traz data[] com as orders e paging com total, total_pages, offset e limit.


        Quando usar: Extração para planilha e conciliação de vendas do Checkout Transparente novo. É o endpoint de listagem
        da Orders API; para integrações antigas em Payments API, use GET /v1/payments/search.'
      tags:
      - Cobranca
      x-confianca: verificado
      x-fonte-url: https://www.mercadopago.com.br/developers/pt/reference/online-payments/checkout-api/search-order/get
      x-entidade-canonica: Cobranca
      x-acao-canonica: listar
      x-data-consulta: '2026-09-17'
      security:
      - bearerAuth: []
      parameters:
      - name: begin_date
        in: query
        required: true
        description: 'Início do período, pela data de criação, em RFC 3339 (ex.: 2026-09-01T00:00:00Z).'
        schema:
          type: string
          format: date-time
      - name: end_date
        in: query
        required: true
        description: Fim do período, pela data de criação, em RFC 3339.
        schema:
          type: string
          format: date-time
      - name: external_reference
        in: query
        required: false
        description: Filtra pela sua referência interna.
        schema:
          type: string
      - name: type
        in: query
        required: false
        description: Tipo da order. Para pagamento online, online.
        schema:
          type: string
          enum:
          - online
      - name: status
        in: query
        required: false
        description: Status atual da order.
        schema:
          type: string
          enum:
          - created
          - processed
          - action_required
          - failed
          - processing
          - refunded
          - canceled
      - name: status_detail
        in: query
        required: false
        description: Detalhe do status (accredited, refunded, partially_refunded, waiting_capture, rejected_by_issuer...).
        schema:
          type: string
      - name: payment_method_id
        in: query
        required: false
        description: Meio de pagamento (pix, boleto, visa, master...).
        schema:
          type: string
      - name: payment_method_type
        in: query
        required: false
        description: Tipo do meio (bank_transfer, ticket, credit_card, debit_card, account_money).
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Página, começando em 1.
        schema:
          type: integer
      - name: page_size
        in: query
        required: false
        description: Registros por página. Máximo 100; padrão 20.
        schema:
          type: integer
      - name: sort_by
        in: query
        required: false
        description: Ordena por data de criação ou de última atualização.
        schema:
          type: string
      - name: sort_order
        in: query
        required: false
        description: Sentido da ordenação.
        schema:
          type: string
          enum:
          - asc
          - desc
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        type:
                          type: string
                        processing_mode:
                          type: string
                        external_reference:
                          type: string
                        total_amount:
                          type: string
                        total_paid_amount:
                          type: string
                        user_id:
                          type: string
                        status:
                          type: string
                        status_detail:
                          type: string
                        capture_mode:
                          type: string
                        currency:
                          type: string
                        created_date:
                          type: string
                        last_updated_date:
                          type: string
                        transactions:
                          type: object
                  paging:
                    type: object
                    properties:
                      total:
                        type: string
                      total_pages:
                        type: string
                      offset:
                        type: string
                      limit:
                        type: string
              example:
                data:
                - id: ORD01K9SN1Q5959CGN8QGW00EH7V5
                  type: online
                  processing_mode: automatic
                  external_reference: PEDIDO-2026-0001
                  total_amount: '50.00'
                  total_paid_amount: '50.00'
                  user_id: '12345'
                  status: processed
                  status_detail: accredited
                  capture_mode: automatic
                  currency: BRL
                  created_date: '2026-09-17T13:06:51.045Z'
                  last_updated_date: '2026-09-17T13:06:51.045Z'
                paging:
                  total: '54'
                  total_pages: '3'
                  offset: '0'
                  limit: '20'
        '400':
          description: 'required_search_params: begin_date e end_date não foram enviados.'
        '401':
          description: '401: Access Token ausente, inválido, revogado ou do ambiente errado (TEST- x APP_USR-).'
        '403':
          description: 'forbidden: A aplicação não tem permissão/escopo para o recurso.'
        '429':
          description: 'too_many_requests: Limite de requisições do Client ID atingido no gateway.'
        '500':
          description: 'internal_error: Erro genérico do servidor.'
  /v1/orders/{id}:
    get:
      operationId: mercado-pago__cobranca__obter__order
      summary: Obter order por ID
      description: 'Devolve o estado atual de uma order do Checkout Transparente, com as transações de pagamento, os reembolsos,
        os itens e o status em tempo real.


        Quando usar: Ao receber uma notificação do tópico order, para buscar o estado real antes de dar baixa. Também para
        conferir se o Pix foi pago ou se o boleto foi compensado.'
      tags:
      - Cobranca
      x-confianca: verificado
      x-fonte-url: https://www.mercadopago.com.br/developers/pt/reference/online-payments/checkout-api/get-order/get
      x-entidade-canonica: Cobranca
      x-acao-canonica: obter
      x-data-consulta: '2026-09-17'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Identificador da order devolvido na criação (formato ORD...).
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  type:
                    type: string
                  processing_mode:
                    type: string
                  external_reference:
                    type: string
                  total_amount:
                    type: string
                  total_paid_amount:
                    type: string
                  status:
                    type: string
                  status_detail:
                    type: string
                  capture_mode:
                    type: string
                  currency:
                    type: string
                  country_code:
                    type: string
                  user_id:
                    type: string
                  created_date:
                    type: string
                  last_updated_date:
                    type: string
                  transactions:
                    type: object
                    properties:
                      payments:
                        type: array
                      refunds:
                        type: array
                  items:
                    type: array
              example:
                id: ORD01J49MMW3SSBK5PSV3DFR32959
                processing_mode: automatic
                external_reference: PEDIDO-2026-0001
                total_amount: '50.00'
                total_paid_amount: '50.00'
                status: processed
                status_detail: accredited
                currency: BRL
                country_code: BR
                user_id: '12345'
                created_date: '2026-09-17T13:06:51.045Z'
                last_updated_date: '2026-09-17T13:10:02.001Z'
                transactions:
                  payments:
                  - id: PAY01J67CQQH5904WDBVZEM4JMEP3
                    amount: '50.00'
                    status: processed
                    status_detail: accredited
        '400':
          description: 'invalid_path_param: O id informado não tem formato de order.'
        '404':
          description: 'order_not_found: Order inexistente, de outra conta ou do outro ambiente.'
        '401':
          description: '401: Access Token ausente, inválido, revogado ou do ambiente errado (TEST- x APP_USR-).'
        '403':
          description: 'forbidden: A aplicação não tem permissão/escopo para o recurso.'
        '429':
          description: 'too_many_requests: Limite de requisições do Client ID atingido no gateway.'
        '500':
          description: 'internal_error: Erro genérico do servidor.'
  /v1/orders/{order_id}/cancel:
    post:
      operationId: mercado-pago__cobranca__cancelar__order
      summary: Cancelar order por ID
      description: 'Cancela uma order e suas transações. Só funciona enquanto a order está em status created ou action_required
        — depois de processada, o caminho é o reembolso.


        Quando usar: Para derrubar um Pix ou boleto ainda não pago, ou abandonar uma order em modo manual que o cliente não
        concluiu.'
      tags:
      - Cobranca
      x-confianca: verificado
      x-fonte-url: https://www.mercadopago.com.br/developers/pt/reference/online-payments/checkout-api/cancel-order/post
      x-entidade-canonica: Cobranca
      x-acao-canonica: cancelar
      x-data-consulta: '2026-09-17'
      security:
      - bearerAuth: []
      parameters:
      - name: X-Idempotency-Key
        in: header
        required: true
        description: Chave única da requisição (UUID v4), de 1 a 128 caracteres.
        schema:
          type: string
      - name: order_id
        in: path
        required: true
        description: ID da order a cancelar (ORD...).
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  status_detail:
                    type: string
                  transactions:
                    type: object
                    properties:
                      payments:
                        type: array
              example:
                id: ORD01J49MMW3SSBK5PSV3DFR32959
                status: canceled
                status_detail: canceled_transaction
                transactions:
                  payments:
                  - id: PAY01J67CQQH5904WDBVZEM4JMEP3
                    status: canceled
                    status_detail: canceled_transaction
        '400':
          description: 'empty_required_header: Header X-Idempotency-Key obrigatório não enviado.'
        '409':
          description: 'idempotency_key_already_used: A chave de idempotência já foi usada em outra requisição.'
        '404':
          description: 'order_not_found: Order inexistente ou de outra conta.'
        '401':
          description: '401: Access Token ausente, inválido, revogado ou do ambiente errado (TEST- x APP_USR-).'
        '403':
          description: 'forbidden: A aplicação não tem permissão/escopo para o recurso.'
        '429':
          description: 'too_many_requests: Limite de requisições do Client ID atingido no gateway.'
        '500':
          description: 'internal_error: Erro genérico do servidor.'
  /v1/orders/{order_id}/refund:
    post:
      operationId: mercado-pago__cobranca__estornar__order
      summary: Reembolsar uma order
      description: 'Devolve ao comprador o valor das transações de uma order. Sem corpo na requisição, o reembolso é total;
        com transactions[].id e amount, é parcial. A order fica totalmente reembolsada quando todas as transações forem devolvidas
        integralmente.


        Quando usar: Devolução de venda, cancelamento após pagamento, acordo com o cliente. Para Pix, o reembolso devolve
        o valor pela própria rede Pix e a resposta traz o e2e_id da devolução.'
      tags:
      - Cobranca
      x-confianca: verificado
      x-fonte-url: https://www.mercadopago.com.br/developers/pt/reference/online-payments/checkout-api/refund-order/post
      x-entidade-canonica: Cobranca
      x-acao-canonica: estornar
      x-data-consulta: '2026-09-17'
      security:
      - bearerAuth: []
      parameters:
      - name: X-Idempotency-Key
        in: header
        required: true
        description: Chave única da requisição (UUID v4), de 1 a 128 caracteres.
        schema:
          type: string
      - name: order_id
        in: path
        required: true
        description: ID da order a reembolsar (ORD...).
        schema:
          type: string
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  status_detail:
                    type: string
                  transactions:
                    type: object
                    properties:
                      refunds:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: string
                            transaction_id:
                              type: string
                            reference_id:
                              type: string
                            amount:
                              type: string
                            status:
                              type: string
                            e2e_id:
                              type: string
              example:
                id: ORD01J49MMW3SSBK5PSV3DFR32959
                status: processed
                status_detail: refunded
                transactions:
                  refunds:
                  - id: REF01J49MMW3SSBK5PSV3DFR32959
                    transaction_id: PAY01JEVQM06WDW16MAQ8B5SC0MSC
                    reference_id: 01JEVQM899NWSQC4FYWWW7KTF9
                    amount: '10.00'
                    status: processed
                    e2e_id: E18236120202609281610s04cf5a1234
        '400':
          description: 'empty_required_header: Header X-Idempotency-Key obrigatório não enviado.'
        '409':
          description: 'idempotency_key_already_used: A chave de idempotência já foi usada em outra requisição.'
        '404':
          description: 'order_not_found: Order inexistente ou de outra conta.'
        '403':
          description: 'forbidden: A aplicação não tem permissão/escopo para o recurso.'
        '429':
          description: 'too_many_requests: Limite de requisições do Client ID atingido no gateway.'
        '500':
          description: 'internal_error: Erro genérico do servidor.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                transactions:
                  type: array
