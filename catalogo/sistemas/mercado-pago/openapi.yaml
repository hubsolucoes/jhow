  /v1/account/release_report/search:
    get:
      operationId: mercado-pago__relatorio__listar__liberacao
      summary: Consultar lista de relatórios de liberações
      description: 'Busca os relatórios de liberação de dinheiro já gerados, com filtros por período reportado, janela de
        criação, origem (manual ou agendado), moeda e formato, e paginação offset/limit com envelope paging + results[]. Cada
        resultado traz o file_name usado no download.


        Quando usar: Primeiro passo da rotina automática de conciliação: descobrir qual arquivo baixar. Ordenado por data
        de criação, do mais recente para o mais antigo.'
      tags:
      - Transacao
      x-confianca: verificado
      x-fonte-url: https://www.mercadopago.com.br/developers/pt/reference/releases-report/search-report/get
      x-entidade-canonica: Relatorio
      x-acao-canonica: listar
      x-data-consulta: '2026-09-17'
      security:
      - bearerAuth: []
      parameters:
      - name: id
        in: query
        required: false
        description: Identificador específico do relatório.
        schema:
          type: integer
      - name: file_name
        in: query
        required: false
        description: Nome exato do arquivo. Diferencia maiúsculas de minúsculas.
        schema:
          type: string
      - name: begin_date
        in: query
        required: false
        description: Início do período REPORTADO (não é a data de criação do relatório). ISO 8601 UTC.
        schema:
          type: string
          format: date-time
      - name: end_date
        in: query
        required: false
        description: Fim do período reportado. ISO 8601 UTC.
        schema:
          type: string
          format: date-time
      - name: created_from
        in: query
        required: false
        description: Origem do relatório.
        schema:
          type: string
          enum:
          - manual
          - schedule
      - name: range
        in: query
        required: false
        description: Campo do filtro por janela. Só aceita date_created; exige range_begin_date e range_end_date.
        schema:
          type: string
          enum:
          - date_created
      - name: range_begin_date
        in: query
        required: false
        description: Início da janela de criação. Obrigatório quando range é enviado.
        schema:
          type: string
          format: date-time
      - name: range_end_date
        in: query
        required: false
        description: Fim da janela de criação. Obrigatório quando range é enviado.
        schema:
          type: string
          format: date-time
      - name: account_id
        in: query
        required: false
        description: Conta associada ao relatório.
        schema:
          type: integer
      - name: currency_id
        in: query
        required: false
        description: Moeda do relatório, em ISO 4217, só maiúsculas, até 10 caracteres.
        schema:
          type: string
      - name: format
        in: query
        required: false
        description: Formato do arquivo.
        schema:
          type: string
          enum:
          - CSV
          - XLSX
      - name: offset
        in: query
        required: false
        description: Início da paginação. Máximo 10000.
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        description: Registros por página. De 1 a 500. Padrão 30.
        schema:
          type: integer
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  paging:
                    type: object
                    properties:
                      total:
                        type: number
                      limit:
                        type: number
                      offset:
                        type: number
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                        user_id:
                          type: number
                        account_id:
                          type: number
                        begin_date:
                          type: string
                        end_date:
                          type: string
                        file_name:
                          type: string
                        created_from:
                          type: string
                        date_created:
                          type: string
                        download_date:
                          type: string
                        status:
                          type: string
                        origin:
                          type: string
                        sub_type:
                          type: string
                        metadata:
                          type: string
                        model:
                          type: string
                        currency_id:
                          type: string
                        format:
                          type: string
              example:
                paging:
                  total: 4
                  limit: 30
                  offset: 0
                results:
                - id: 17001104
                  user_id: 574264905
                  account_id: 208361929
                  begin_date: '2026-09-01T03:00:00Z'
                  end_date: '2026-10-01T02:59:59Z'
                  file_name: release-report-USER_ID-2026-09-17-104118.csv
                  created_from: manual
                  date_created: '2026-09-17T10:41:19.000-03:00'
                  download_date: null
                  status: enabled
                  origin: date_range
                  sub_type: release
                  model: release
                  currency_id: BRL
                  format: CSV
        '400':
          description: 'invalid_offset: offset inválido ou acima de 10000.'
        '401':
          description: 'unauthorized_user_id: Usuário não autorizado a acessar o recurso.'
        '500':
          description: 'internal_error: Erro interno do servidor.'
  /v1/account/release_report/{file_name}:
    get:
      operationId: mercado-pago__relatorio__baixar_arquivo__liberacao
      summary: Baixar relatório de liberações
      description: 'Baixa o arquivo do relatório de liberação de dinheiro, em CSV ou XLSX, pelo nome do arquivo. É a extração
        financeira mais completa do Mercado Pago: uma linha por movimento, com valor bruto, taxas, frete, impostos, valor
        líquido, parcelas, meio de pagamento, referência externa, loja, ponto de venda e id de reembolso.


        Quando usar: É o melhor endpoint para montar a planilha de conciliação: ele já vem com as taxas discriminadas, o que
        a busca de pagamentos não entrega de forma somável. Use junto com a listagem, que dá o file_name.'
      tags:
      - Transacao
      x-confianca: verificado
      x-fonte-url: https://www.mercadopago.com.br/developers/pt/reference/releases-report/download-report/get
      x-entidade-canonica: Relatorio
      x-acao-canonica: baixar_arquivo
      x-data-consulta: '2026-09-17'
      security:
      - bearerAuth: []
      parameters:
      - name: file_name
        in: path
        required: true
        description: 'Nome do arquivo do relatório, exatamente como veio na listagem (ex.: release-report-USER_ID-2026-09-17-104118.csv).'
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  arquivo:
                    type: string
              example:
                cabecalho: DATE,SOURCE_ID,EXTERNAL_REFERENCE,RECORD_TYPE,DESCRIPTION,NET_CREDIT_AMOUNT,NET_DEBIT_AMOUNT,GROSS_AMOUNT,SELLER_AMOUNT,MP_FEE_AMOUNT,FINANCING_FEE_AMOUNT,SHIPPING_FEE_AMOUNT,TAXES_AMOUNT,COUPON_AMOUNT,INSTALLMENTS,PAYMENT_METHOD,TAX_DETAIL,TAX_AMOUNT_TELCO,TRANSACTION_APPROVAL_DATE,POS_ID,POS_NAME,EXTERNAL_POS_ID,STORE_ID,STORE_NAME,EXTERNAL_STORE_ID,TAXES_DISAGGREGATED,METADATA,REFUND_ID
                observacao: As colunas efetivas dependem da configuração salva em /v1/account/release_report/config.
        '401':
          description: 'Invalid token: Access Token inválido.'
        '404':
          description: 'not_found: Arquivo não encontrado.'
