      description: 'Busca os casos de chargeback (contestação) ligados a um pagamento, com o valor contestado, o motivo, se
        a cobertura do Mercado Pago se aplica, o status da documentação comprobatória e o prazo para enviá-la.


        Quando usar: Ao receber notificação do tópico topic_chargebacks_wh, e para montar o painel de perdas por contestação.
