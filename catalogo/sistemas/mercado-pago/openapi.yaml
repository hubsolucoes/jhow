      x-fonte-url: https://www.mercadopago.com.br/developers/pt/reference/online-payments/subscriptions/export-preapproval/get
      x-entidade-canonica: Assinatura
      x-acao-canonica: baixar_arquivo
      x-data-consulta: '2026-09-17'
      security:
      - bearerAuth: []
      parameters:
      - name: collector_id
        in: query
        required: true
        description: ID do recebedor que está pedindo as assinaturas (user_id do vendedor).
        schema:
          type: integer
      - name: preapproval_plan_id
        in: query
        required: false
        description: Filtra por plano.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Filtra por status. Aceita um, vários ou nenhum.
        schema:
          type: string
