      x-fonte-url: https://www.mercadopago.com.br/developers/pt/reference/online-payments/subscriptions/create-preapproval/post
      x-entidade-canonica: Assinatura
      x-acao-canonica: criar
      x-data-consulta: '2026-09-17'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  version:
                    type: number
                  application_id:
                    type: number
                  collector_id:
                    type: number
                  preapproval_plan_id:
                    type: string
                  reason:
                    type: string
                  external_reference:
                    type: string
                  back_url:
                    type: string
                  init_point:
                    type: string
                  auto_recurring:
                    type: object
                  payer_id:
                    type: number
                  card_id:
                    type: number
                  payment_method_id:
                    type: string
                  next_payment_date:
                    type: string
                  date_created:
                    type: string
                  last_modified:
                    type: string
                  status:
                    type: string
                  summarized:
                    type: object
              example:
                id: 2c938084726fca480172750000000000
                version: 0
                collector_id: 100200300
                preapproval_plan_id: 2c938084726fca480172750000000000
                reason: Plano Pro mensal
                external_reference: ASSIN-2026-0001
                init_point: https://www.mercadopago.com.br/subscriptions/checkout?preapproval_id=2c938084726fca480172750000000000
                auto_recurring:
                  frequency: 1
                  frequency_type: months
                  start_date: '2026-09-17T13:07:14.260Z'
                  currency_id: BRL
                  transaction_amount: 99.9
                payer_id: 123123123
                card_id: 123123123
                payment_method_id: visa
                next_payment_date: '2026-10-17T11:12:25.892-03:00'
                date_created: '2026-09-17T11:12:25.892-03:00'
                last_modified: '2026-09-17T11:12:25.892-03:00'
                status: authorized
        '400':
          description: '400: Requisição inválida: campo obrigatório ausente, formato errado ou combinação de recorrência não
            aceita.'
        '401':
          description: '401: Access Token ausente, inválido ou do ambiente errado.'
        '403':
          description: '403: Sem permissão para o recurso.'
        '500':
          description: '500: Erro interno.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                preapproval_plan_id:
                  type: string
                  description: ID do plano. Com plano, a recorrência vem do plano e alterações no plano se propagam.
                reason:
                  type: string
                  description: Descrição curta vista pelo assinante. Obrigatória em assinatura sem plano.
                external_reference:
                  type: string
                  description: Sua referência interna. Obrigatória em assinatura sem plano.
