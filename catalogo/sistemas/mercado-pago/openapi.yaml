  /v1/account/release_report:
    post:
      operationId: mercado-pago__relatorio__criar__liberacao
      summary: Criar relatório de liberações
      description: 'Dispara a geração manual do relatório de liberação de dinheiro (Releases) para um intervalo de datas.
        A geração é assíncrona: a resposta é 202 sem corpo, e o arquivo aparece depois na lista de relatórios.


        Quando usar: Fechamento financeiro e conciliação: este relatório é a composição do saldo disponível, com valor bruto,
        taxa do Mercado Pago, taxa de parcelamento, frete, impostos, valor líquido e data de liberação de cada movimento.'
      tags:
      - Transacao
      x-confianca: verificado
      x-fonte-url: https://www.mercadopago.com.br/developers/pt/reference/releases-report/create-report/post
      x-entidade-canonica: Relatorio
      x-acao-canonica: criar
      x-data-consulta: '2026-09-17'
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
                properties:
                  corpo:
                    type: string
              example:
                observacao: 202 Accepted sem corpo de resposta. Acompanhe pela consulta da task ou pela lista de relatórios.
        '400':
          description: 'invalid_begin_date: begin_date não informado ou inválido.'
        '401':
          description: 'Invalid token: Access Token inválido para a requisição.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                begin_date:
                  type: string
                  description: 'Início do intervalo, em UTC com sufixo Z (ex.: 2026-09-01T00:00:00Z).'
                  format: date-time
                end_date:
                  type: string
                  description: Fim do intervalo, em UTC com sufixo Z.
                  format: date-time
              required:
              - begin_date
              - end_date
  /v1/account/release_report/task/{task-id}:
    get:
      operationId: mercado-pago__relatorio__consultar_status__liberacao
      summary: Consultar tarefa de criação de relatório
      description: 'Consulta o andamento de uma geração de relatório de liberações pelo id da tarefa: status (pending, processing,
        processed, failed, deleted), formato, número de tentativas e, quando pronto, o file_name do arquivo.


