  /preapproval:
    post:
      operationId: mercado-pago__assinatura__criar
      summary: Criar assinatura
      description: 'Cria uma assinatura: a ligação entre um assinante e uma recorrência. Pode ser criada a partir de um plano
        (preapproval_plan_id) ou sem plano, declarando reason, external_reference e auto_recurring. Com card_token_id ela
        já nasce autorizada; sem ele, nasce pending e o assinante conclui pelo init_point.


