      description: 'Captura integralmente o valor autorizado de uma order criada com capture_mode=manual. Todos os pagamentos
        associados são capturados. Só vale para cartão de crédito.


        Quando usar: Fluxo de reserva e captura: você autoriza o valor no cartão na hora da compra e só captura quando confirma
        estoque, envia o produto ou conclui o serviço.'
      tags:
