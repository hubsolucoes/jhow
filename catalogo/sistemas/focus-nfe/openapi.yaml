  /v2/nfce:
    post:
      operationId: focus-nfe__nota_fiscal__emitir__nfce
      summary: NFCe > Emitir
      description: 'Emite a NFC-e (modelo 65) de forma síncrona: a mesma chamada devolve autorizado ou erro_autorizacao, com
        chave, caminhos do XML/DANFE, qrcode_url e url_consulta_nf. Suporta contingência offline com forma_emissao=offline.'
      tags:
      - nfce
      x-confianca: verificado
      x-fonte-url: https://doc.focusnfe.com.br/reference/emitir_nfce
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: emitir
      parameters:
      - name: ref
        in: query
        required: true
        description: Identificador único do NFC-e no seu sistema; será usado nas consultas, cancelamento e eventos.
        schema:
          type: string
          description: Identificador único do NFC-e no seu sistema; será usado nas consultas, cancelamento e eventos.
      - name: completa
        in: query
        required: false
        description: Com 1, a resposta inclui os dados completos da requisição e do protocolo.
        schema:
          type: integer
          description: Com 1, a resposta inclui os dados completos da requisição e do protocolo.
          enum: *id014
      - name: forma_emissao
        in: query
        required: false
        description: Use 'offline' para emissão em contingência manual (exige numero, serie e codigo_unico no corpo).
        schema:
          type: string
          description: Use 'offline' para emissão em contingência manual (exige numero, serie e codigo_unico no corpo).
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              example:
                ref: venda789
                status: autorizado
                status_sefaz: '100'
                numero: '15'
                serie: '1'
        '400':
          description: Faltou ?ref= na URL de emissão.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: requisicao_invalida
                mensagem: Parâmetro "ref" não informado.
        '401':
          description: Não autenticado
          content:
            text/html:
              schema:
                type: string
        '403':
          description: O CNPJ não está cadastrado/habilitado para o token usado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: permissao_negada
                mensagem: CNPJ do emitente não autorizado.
        '422':
          description: CSC/ID token do ambiente não cadastrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: ambiente_nao_configurado
                mensagem: Ambiente não configurado para emissão de NFCe
        '415':
          description: Corpo vazio ou sem Content-Type JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: formato_invalido
                mensagem: Recebida requisição vazia quando eram esperados dados.
        '429':
          description: Mais de 100 requisições por minuto no mesmo token (doc legada oficial) ou, como observado em teste,
            várias autenticações falhas do mesmo IP (codigo limite_excedido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: ''
                mensagem: Too many requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cnpj_emitente:
                  type: string
                  description: CNPJ do emitente habilitado para NFC-e.
                data_emissao:
                  type: string
                  format: date-time
                  description: Data/hora de emissão.
                natureza_operacao:
                  type: string
                  description: Natureza da operação.
                presenca_comprador:
                  type: string
                  description: Indicador de presença (tag indPres); NFC-e é operação presencial ou entrega a domicílio.
                modalidade_frete:
                  type: string
                  description: Modalidade do frete (9 = sem frete).
                local_destino:
                  type: string
                  description: Destino da operação (1 = interna).
                indicador_inscricao_estadual_destinatario:
                  type: string
                  description: Indicador de IE do consumidor, se identificado.
                nome_destinatario:
                  type: string
                  description: Nome do consumidor (opcional).
                cpf_destinatario:
                  type: string
                  description: CPF do consumidor (CPF na nota).
                cnpj_destinatario:
                  type: string
                  description: CNPJ do consumidor PJ.
                informacoes_adicionais_contribuinte:
                  type: string
                  description: Informações complementares.
                numero:
                  type: string
                  description: Número (obrigatório em contingência offline).
                serie:
                  type: string
                  description: Série (obrigatória em contingência offline).
                codigo_unico:
                  type: string
                  description: Código numérico da chave, usado em contingência offline.
                items:
                  type: array
                  description: Itens da NFC-e.
                  items:
                    type: object
                    properties:
                      numero_item:
                        type: string
                        description: Sequência do item.
                      codigo_produto:
                        type: string
                        description: Código do produto.
                      descricao:
                        type: string
                        description: Descrição.
                      codigo_ncm:
                        type: string
                        description: NCM.
                        pattern: ^[0-9]{8}$
                      cfop:
                        type: string
                        description: CFOP (vendas internas, geralmente 5xxx).
                      quantidade_comercial:
                        type: number
                        description: Quantidade comercial.
                      quantidade_tributavel:
                        type: number
                        description: Quantidade tributável.
                      valor_unitario_comercial:
                        type: number
                        description: Preço unitário.
                      valor_unitario_tributavel:
                        type: number
                        description: Valor unitário tributável.
                      valor_bruto:
                        type: number
                        description: Valor bruto do item.
                      valor_desconto:
                        type: number
                        description: Desconto do item.
                      unidade_comercial:
                        type: string
                        description: Unidade comercial.
                      unidade_tributavel:
                        type: string
                        description: Unidade tributável.
                      icms_origem:
                        type: string
                        description: Origem da mercadoria.
                      icms_situacao_tributaria:
                        type: string
                        description: CST ou CSOSN do ICMS.
                      valor_total_tributos:
                        type: number
                        description: Tributos aproximados (Lei da Transparência).
                    required:
                    - numero_item
                    - codigo_produto
                    - descricao
                    - codigo_ncm
                    - cfop
                    - quantidade_comercial
                    - quantidade_tributavel
                    - valor_unitario_comercial
                    - valor_unitario_tributavel
                    - valor_bruto
                    - unidade_comercial
                    - unidade_tributavel
                    - icms_origem
                    - icms_situacao_tributaria
                formas_pagamento:
                  type: array
                  description: Pagamentos (obrigatório na NFC-e).
                  items:
                    type: object
                    properties:
                      forma_pagamento:
                        type: string
                        description: Código tPag (01 dinheiro, 03 crédito, 04 débito, 17 Pix dinâmico...).
                      valor_pagamento:
                        type: number
                        description: Valor pago.
                      tipo_integracao:
                        type: string
                        description: 1 integrado (TEF/e-commerce), 2 não integrado (POS).
                      nome_credenciadora:
                        type: string
                        description: Credenciadora do cartão.
                      bandeira_operadora:
                        type: string
                        description: Bandeira do cartão.
                      numero_autorizacao:
                        type: string
                        description: Código de autorização da transação.
                    required:
                    - forma_pagamento
                    - valor_pagamento
              required:
              - cnpj_emitente
              - data_emissao
              - natureza_operacao
              - presenca_comprador
              - modalidade_frete
              - local_destino
              - items
              - formas_pagamento
            example:
              cnpj_emitente: 00000000000191
              data_emissao: '2026-09-17T10:00:00-03:00'
              natureza_operacao: Venda ao consumidor
              presenca_comprador: '1'
              modalidade_frete: '9'
              local_destino: '1'
              items:
              - numero_item: '1'
                codigo_produto: SKU-001
                descricao: Produto de exemplo
                codigo_ncm: '61091000'
                cfop: '5102'
                quantidade_comercial: 1
                quantidade_tributavel: 1
                valor_unitario_comercial: 50.0
                valor_unitario_tributavel: 50.0
                valor_bruto: 50.0
                unidade_comercial: UN
                unidade_tributavel: UN
                icms_origem: '0'
                icms_situacao_tributaria: '102'
              formas_pagamento:
              - forma_pagamento: '01'
                valor_pagamento: 50.0
