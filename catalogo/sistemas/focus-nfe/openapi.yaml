  /v2/nfe/inutilizacao:
    post:
      operationId: focus-nfe__nota_fiscal__inutilizar__nfe
      summary: NFe > Inutilizar Numeração
      description: Pede à SEFAZ a inutilização de uma faixa de números de NF-e que não foram usados. Resposta síncrona com
        protocolo e caminho do XML.
      tags:
      - nfe
      x-confianca: verificado
      x-fonte-url: https://doc.focusnfe.com.br/reference/inutilizar_numeracao
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: inutilizar
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                status: autorizado
                status_sefaz: '102'
                mensagem_sefaz: Inutilizacao de numero homologado
                modelo: '55'
                serie: '1'
                numero_inicial: '10'
                numero_final: '12'
        '400':
          description: Faltou identificar o emitente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: requisicao_invalida
                mensagem: Parâmetros "cnpj" ou "cpf" não informados.
        '401':
          description: Não autenticado
          content:
            text/html:
              schema:
                type: string
        '415':
          description: Corpo vazio ou sem Content-Type JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: formato_invalido
                mensagem: Recebida requisição vazia quando eram esperados dados.
        '422':
          description: Empresa não habilitada para este documento no token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: permissao_negada
                mensagem: CNPJ do emitente não autorizado.
        '429':
          description: Mais de 100 requisições por minuto no mesmo token (doc legada oficial) ou, como observado em teste,
            várias autenticações falhas do mesmo IP (codigo limite_excedido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: ''
                mensagem: Too many requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cnpj:
                  type: string
                  description: CNPJ do emitente dono da série.
                serie:
                  type: string
                  description: Série da faixa.
                numero_inicial:
                  type: string
                  description: Primeiro número a inutilizar.
                numero_final:
                  type: string
                  description: Último número a inutilizar.
                justificativa:
                  type: string
                  description: Motivo da inutilização (15 a 255 caracteres, regra SEFAZ).
                  maxLength: 255
                  minLength: 15
              required:
              - cnpj
              - serie
              - numero_inicial
              - numero_final
              - justificativa
            example:
              cnpj: 00000000000191
              serie: '1'
              numero_inicial: '10'
              numero_final: '12'
              justificativa: Falha no sistema gerou salto de numeracao
