                        type: string
                        description: 'Meio de pagamento (tPag): 01 dinheiro, 03 crédito, 04 débito, 15 boleto, 17 Pix dinâmico,
                          20 Pix estático, 90 sem pagamento, 99 outros, entre outros.'
                        enum: *id012
                      descricao_pagamento:
                        type: string
                        description: Descrição do meio quando forma_pagamento = 99.
                      valor_pagamento:
                        type: number
                        description: Valor pago nesse meio.
              required:
              - natureza_operacao
              - data_emissao
              - tipo_documento
              - finalidade_emissao
              - items
