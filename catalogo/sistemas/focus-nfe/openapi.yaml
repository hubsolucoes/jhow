      responses:
        '200':
          description: Sucesso
          content:
            application/pdf:
              example: {}
        '401':
          description: Não autenticado
          content:
            text/html:
              schema:
                type: string
        '429':
          description: Mais de 100 requisições por minuto no mesmo token (doc legada oficial) ou, como observado em teste,
            várias autenticações falhas do mesmo IP (codigo limite_excedido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: ''
                mensagem: Too many requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                natureza_operacao:
                  type: string
