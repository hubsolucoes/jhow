  /v2/nfse:
    post:
      operationId: focus-nfe__nota_fiscal__emitir__nfse
      summary: NFSe > Emitir
      description: Envia um RPS no layout unificado da Focus para a prefeitura do prestador. Há pré-validação síncrona; se
        aceito, o processamento é assíncrono e o resultado sai na consulta ou no webhook. Campos marcados como Reforma Tributária
        podem ser ignorados por municípios em transição.
      tags:
      - nfse
      x-confianca: verificado
      x-fonte-url: https://doc.focusnfe.com.br/reference/emitir_nfse
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: emitir
      parameters:
      - name: ref
        in: query
        required: true
        description: Identificador único do NFS-e no seu sistema; será usado nas consultas, cancelamento e eventos.
        schema:
          type: string
          description: Identificador único do NFS-e no seu sistema; será usado nas consultas, cancelamento e eventos.
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              example:
                cnpj_prestador: 00000000000191
                ref: os555
                status: processando_autorizacao
        '400':
          description: Campo obrigatório ausente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: requisicao_invalida
                mensagem: Parâmetro "prestador.codigo_municipio" não informado
        '401':
          description: Não autenticado
          content:
            text/html:
              schema:
                type: string
        '422':
          description: Reenvio da ref com outro prestador.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: erro_validacao
                mensagem: O emitente da nota fiscal é diferente do usado no primeiro envio
        '429':
          description: Mais de 100 requisições por minuto no mesmo token (doc legada oficial) ou, como observado em teste,
            várias autenticações falhas do mesmo IP (codigo limite_excedido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: ''
                mensagem: Too many requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                data_emissao:
                  type: string
                  format: date-time
                  description: Data/hora de emissão do RPS.
                natureza_operacao:
                  type: string
                  description: Natureza da operação no padrão ABRASF (1 a 6); o significado varia por município.
                  enum:
                  - '1'
                  - '2'
                  - '3'
                  - '4'
                  - '5'
                  - '6'
                regime_especial_tributacao:
                  type: string
                  description: Regime especial (1 a 6).
                  enum:
                  - '1'
                  - '2'
                  - '3'
                  - '4'
                  - '5'
                  - '6'
                optante_simples_nacional:
                  type: boolean
                  description: Prestador é do Simples Nacional.
                incentivador_cultural:
                  type: boolean
                  description: Prestador é incentivador cultural.
                prestador:
                  type: object
                  description: Dados do prestador.
                  properties:
                    cnpj:
                      type: string
                      description: CNPJ do prestador (14 dígitos).
                      pattern: ^\d{14}$
                    inscricao_municipal:
                      type: string
                      description: Inscrição municipal do prestador.
                    codigo_municipio:
                      type: string
                      description: IBGE do município do prestador (a API retorna erro se não informado).
                      maxLength: 7
                  required:
                  - cnpj
                  - inscricao_municipal
                tomador:
                  type: object
                  description: Dados do tomador.
                  properties:
                    cpf:
                      type: string
                      description: CPF do tomador (informe cpf ou cnpj; o schema marca ambos como obrigatórios em alternativa).
                      pattern: ^[0-9]{11}$
                    cnpj:
                      type: string
                      description: CNPJ do tomador.
                      pattern: ^[0-9]{14}$
                    nif:
                      type: string
                      description: NIF de tomador estrangeiro.
                    motivo_ausencia_nif:
                      type: string
                      description: Motivo de não informar NIF.
                      enum:
                      - '0'
                      - '1'
                      - '2'
                    inscricao_municipal:
                      type: string
                      description: IM do tomador.
                    razao_social:
                      type: string
                      description: Nome/razão social.
                      maxLength: 115
                    telefone:
                      type: string
                      description: Telefone com DDD (10-11 dígitos).
                      pattern: ^[0-9]{10,11}$
                    email:
                      type: string
                      description: E-mail do tomador.
                      maxLength: 80
                    endereco:
                      type: object
                      properties:
                        logradouro:
                          type: string
                          description: Logradouro.
                          maxLength: 125
                        tipo_logradouro:
                          type: string
                          description: Tipo (sigla até 3 caracteres).
                          maxLength: 3
                        numero:
                          type: string
                          description: Número.
                          maxLength: 10
                        complemento:
                          type: string
                          description: Complemento.
                          maxLength: 60
                        bairro:
                          type: string
                          description: Bairro.
                          maxLength: 60
                        codigo_municipio:
                          type: string
                          description: IBGE do município.
                        uf:
                          type: string
                          description: UF.
                          maxLength: 2
                        cep:
                          type: string
                          description: CEP.
                          pattern: ^[0-9]{8}$
                servico:
                  type: object
                  description: Dados do serviço.
                  properties:
                    valor_servicos:
                      type: number
                      description: Valor total dos serviços.
                    valor_deducoes:
                      type: number
                      description: Deduções da base.
                    valor_pis:
                      type: number
                      description: PIS retido.
                    valor_cofins:
                      type: number
                      description: COFINS retida.
                    valor_inss:
                      type: number
                      description: INSS retido.
                    valor_ir:
                      type: number
                      description: IR retido.
                    valor_csll:
                      type: number
                      description: CSLL retida.
                    iss_retido:
                      type: boolean
                      description: ISS retido pelo tomador.
                    valor_iss:
                      type: number
                      description: Valor do ISS.
                    valor_iss_retido:
                      type: number
                      description: ISS retido.
                    outras_retencoes:
                      type: number
                      description: Outras retenções.
                    base_calculo:
                      type: number
                      description: Base de cálculo.
                    aliquota:
                      type: number
                      description: Alíquota do ISS (%).
                    desconto_incondicionado:
                      type: number
                      description: Desconto incondicionado.
                    desconto_condicionado:
                      type: number
                      description: Desconto condicionado.
                    item_lista_servico:
                      type: string
                      description: Item da LC 116 no formato aceito pelo município (ver /v2/municipios/{codigo}/itens_lista_servico).
                    codigo_cnae:
                      type: string
                      description: CNAE do serviço (alguns municípios exigem).
                    codigo_tributario_municipio:
                      type: string
                      description: Código tributário próprio do município.
                    discriminacao:
                      type: string
                      description: Descrição do serviço prestado.
                    codigo_municipio:
                      type: string
                      description: IBGE do município onde o serviço foi prestado.
                    percentual_total_tributos:
                      type: number
                      description: Percentual aproximado de tributos.
                    fonte_total_tributos:
                      type: string
                      description: 'Fonte do percentual (ex.: IBPT).'
                    codigo_nbs:
                      type: string
                      description: 'Reforma Tributária: código NBS.'
                    codigo_indicador_operacao:
                      type: string
                      description: 'Reforma Tributária: indicador da operação (cIndOp).'
                    ibs_cbs_classificacao_tributaria:
                      type: string
                      description: 'Reforma Tributária: cClassTrib.'
                    ibs_cbs_situacao_tributaria:
                      type: string
                      description: 'Reforma Tributária: CST IBS/CBS.'
                    ibs_cbs_base_calculo:
                      type: number
                      description: 'Reforma Tributária: base IBS/CBS.'
                    ibs_uf_aliquota:
                      type: number
                      description: 'Reforma Tributária: alíquota IBS UF.'
                    ibs_mun_aliquota:
                      type: number
                      description: 'Reforma Tributária: alíquota IBS município.'
                    cbs_aliquota:
                      type: number
                      description: 'Reforma Tributária: alíquota CBS.'
                    ibs_uf_valor:
                      type: number
                      description: 'Reforma Tributária: valor IBS UF.'
                    ibs_mun_valor:
                      type: number
                      description: 'Reforma Tributária: valor IBS município.'
                    cbs_valor:
                      type: number
                      description: 'Reforma Tributária: valor CBS.'
                  required:
                  - valor_servicos
                  - iss_retido
                  - item_lista_servico
                  - discriminacao
                  - codigo_municipio
                intermediario:
                  type: object
                  description: Intermediário do serviço (cpf/cnpj/nif, inscricao_municipal, razao_social).
                codigo_obra:
                  type: string
                  description: Código da obra (construção civil).
                  maxLength: 15
                art:
                  type: string
                  description: ART da obra.
                numero_nfse_substituido:
                  type: string
                  description: NFS-e substituída.
                numero_rps_substituido:
                  type: string
                  description: RPS substituído.
                serie_rps_substituido:
                  type: string
                  description: Série do RPS substituído.
                tipo_rps_substituido:
                  type: string
                  description: Tipo do RPS substituído.
              required:
              - data_emissao
              - natureza_operacao
              - optante_simples_nacional
              - prestador
              - tomador
              - servico
            example:
              data_emissao: '2026-09-17T10:00:00-03:00'
              natureza_operacao: '1'
              optante_simples_nacional: false
              prestador:
                cnpj: 00000000000191
                inscricao_municipal: <<INSCRICAO_MUNICIPAL>>
                codigo_municipio: '3550308'
              tomador:
                cnpj: 00000000000191
                razao_social: Tomador Exemplo Ltda
                email: contato@example.com
                endereco:
                  logradouro: Rua Exemplo
                  numero: '100'
                  bairro: Centro
                  codigo_municipio: '3550308'
                  uf: SP
                  cep: '01001000'
              servico:
                valor_servicos: 1000.0
                iss_retido: false
                aliquota: 2.0
                item_lista_servico: '0107'
                discriminacao: Suporte técnico em informática - setembro/2026
                codigo_municipio: '3550308'
  /v2/nfse/{referencia}:
    get:
      operationId: focus-nfe__nota_fiscal__consultar_status__nfse
      summary: NFSe > Consultar
      description: 'Mostra o andamento da NFS-e: processando, autorizado (número, código de verificação, URL da prefeitura,
        URL do DANFSe e XML), cancelado ou erro_autorizacao com erros do município.'
