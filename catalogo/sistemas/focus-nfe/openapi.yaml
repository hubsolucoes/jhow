                  maxLength: 60
                data_emissao:
                  type: string
                  format: date-time
                  description: Data/hora de emissão com fuso (ISO-8601).
                data_entrada_saida:
                  type: string
                  format: date-time
                  description: Data/hora de saída (nota de saída) ou entrada (nota de entrada).
                tipo_documento:
                  type: integer
                  description: 0 = entrada, 1 = saída.
                  enum: *id001
                finalidade_emissao:
                  type: integer
                  description: 1 normal, 2 complementar, 3 ajuste, 4 devolução.
                  enum: *id002
                local_destino:
                  type: integer
                  description: 1 operação interna, 2 interestadual, 3 exterior.
                  enum: *id003
                consumidor_final:
                  type: integer
                  description: 1 quando o destinatário é consumidor final.
                  enum: *id004
                presenca_comprador:
                  type: integer
                  description: Indicador de presença do comprador (tag indPres).
                  enum: *id005
                serie:
                  type: integer
                  description: Série; omita para a API numerar automaticamente (recomendado).
                numero:
                  type: integer
                  description: Número; omita para numeração automática.
                cnpj_emitente:
                  type: string
                  description: CNPJ do emitente (ou cpf_emitente para produtor rural). Deve estar cadastrado e habilitado
                    na conta.
                cpf_emitente:
                  type: string
                  description: CPF do emitente pessoa física (produtor rural).
                inscricao_estadual_emitente:
                  type: string
                  description: IE do emitente; padrão = cadastro.
                regime_tributario_emitente:
                  type: integer
                  description: 'CRT: 1 Simples Nacional, 2 Simples com excesso de sublimite, 3 Regime Normal, 4 MEI. Padrão
                    = cadastro.'
                  enum: *id006
                codigo_municipio_emitente:
                  type: integer
                  description: Código IBGE do município do emitente; padrão = cadastro.
                nome_destinatario:
                  type: string
                  description: Nome/razão social do destinatário.
                cnpj_destinatario:
                  type: string
                  description: CNPJ do destinatário (use cpf_destinatario para PF).
                cpf_destinatario:
                  type: string
                  description: CPF do destinatário pessoa física.
                inscricao_estadual_destinatario:
                  type: string
                  description: IE do destinatário, quando contribuinte.
                indicador_inscricao_estadual_destinatario:
                  type: integer
                  description: 1 contribuinte ICMS, 2 isento, 9 não contribuinte.
                  enum: *id007
                logradouro_destinatario:
                  type: string
                  description: Logradouro do destinatário.
                numero_destinatario:
                  type: string
                  description: Número do endereço.
                bairro_destinatario:
                  type: string
                  description: Bairro.
                municipio_destinatario:
                  type: string
                  description: Nome do município.
                codigo_municipio_destinatario:
                  type: integer
                  description: Código IBGE do município do destinatário.
                uf_destinatario:
                  type: string
                  description: UF do destinatário.
                cep_destinatario:
                  type: string
                  description: CEP do destinatário, só dígitos.
                pais_destinatario:
                  type: string
                  description: País do destinatário.
                telefone_destinatario:
                  type: string
                  description: Telefone do destinatário.
                email_destinatario:
                  type: string
                  description: E-mail para envio automático do XML/DANFE.
                modalidade_frete:
                  type: integer
                  description: 0 por conta do emitente, 1 do destinatário, 2 de terceiros, 9 sem frete (enum do OpenAPI).
                  enum: *id008
                valor_frete:
                  type: number
                  description: Total de frete.
                valor_seguro:
                  type: number
                  description: Total de seguro.
                valor_desconto:
                  type: number
                  description: Total de descontos.
                valor_outras_despesas:
                  type: number
                  description: Outras despesas acessórias.
                valor_produtos:
                  type: number
                  description: Soma dos produtos.
                valor_total:
                  type: number
                  description: Total da nota; se omitido, a API calcula a partir de produtos, descontos, ST, frete, seguro
                    etc.
                informacoes_adicionais_contribuinte:
                  type: string
                  description: Texto livre de informações complementares.
                items:
                  type: array
                  description: Itens da nota (1 a 990). A página de campos chama a coleção de 'itens', mas o JSON usa 'items'.
                  items:
                    type: object
                    properties:
                      numero_item:
                        type: integer
                        description: Sequência do item, começando em 1.
                      codigo_produto:
                        type: string
                        description: Código interno do produto.
                      descricao:
                        type: string
                        description: Descrição do produto.
                      cfop:
                        type: string
                        description: CFOP do item.
                        pattern: ^[1-7][0-9]{3}$
                      codigo_ncm:
                        type: string
                        description: NCM de 8 dígitos.
                        pattern: ^[0-9]{8}$
                      cest:
                        type: string
                        description: CEST (7 dígitos), quando sujeito a ST.
                      codigo_barras_comercial:
                        type: string
                        description: GTIN/EAN comercial.
                      unidade_comercial:
                        type: string
                        description: Unidade comercial (UN, KG...).
                      quantidade_comercial:
                        type: number
                        description: Quantidade comercial.
                      valor_unitario_comercial:
                        type: number
                        description: Preço unitário comercial.
                      unidade_tributavel:
                        type: string
                        description: Unidade tributável.
                      quantidade_tributavel:
                        type: number
                        description: Quantidade tributável.
                      valor_unitario_tributavel:
                        type: number
                        description: Valor unitário tributável.
                      valor_bruto:
                        type: number
                        description: Quantidade × valor unitário.
                      inclui_no_total:
                        type: integer
                        description: 1 se o item compõe o total da nota.
                        enum: *id009
                      icms_origem:
                        type: integer
                        description: Origem da mercadoria (0 a 8).
                      icms_situacao_tributaria:
                        type: string
                        description: 'CST (regime normal: 00, 10, 20, 40...) ou CSOSN (Simples: 101, 102, 500, 900...). Valores
                          como 10_partilha também existem. Campo obrigatório na página de campos; cada código exige campos
                          adicionais.'
                      icms_modalidade_base_calculo:
                        type: integer
                        description: Modalidade da BC do ICMS (0 MVA, 1 pauta, 2 preço tabelado, 3 valor da operação).
                        enum: *id010
                      icms_base_calculo:
                        type: number
                        description: Base de cálculo do ICMS.
                      icms_aliquota:
                        type: number
                        description: Alíquota do ICMS (%).
                      icms_valor:
                        type: number
                        description: Valor do ICMS.
                      pis_situacao_tributaria:
                        type: string
                        description: CST do PIS.
                      cofins_situacao_tributaria:
                        type: string
                        description: CST da COFINS.
                      ibs_cbs_situacao_tributaria:
                        type: string
                        description: 'Reforma Tributária: CST do IBS/CBS (3 caracteres). Marcado como obrigatório na página
                          de campos; o guia oficial diz que é exigido de Lucro Real/Presumido e não do Simples/MEI por ora.'
                        maxLength: 3
                      ibs_cbs_classificacao_tributaria:
                        type: string
                        description: 'Reforma Tributária: cClassTrib (6 caracteres).'
                        maxLength: 6
                      ibs_cbs_base_calculo:
                        type: number
                        description: 'Reforma Tributária: base de cálculo do IBS/CBS.'
                      cbs_aliquota:
                        type: number
                        description: 'Reforma Tributária: alíquota da CBS.'
                      cbs_valor:
                        type: number
                        description: 'Reforma Tributária: valor da CBS.'
                      ibs_uf_aliquota:
                        type: number
                        description: 'Reforma Tributária: alíquota do IBS estadual.'
                      ibs_uf_valor:
                        type: number
                        description: 'Reforma Tributária: valor do IBS estadual.'
                      ibs_mun_aliquota:
                        type: number
                        description: 'Reforma Tributária: alíquota do IBS municipal.'
                      ibs_mun_valor:
                        type: number
                        description: 'Reforma Tributária: valor do IBS municipal.'
                    required:
                    - numero_item
                    - codigo_produto
                    - descricao
                    - cfop
                    - codigo_ncm
                    - quantidade_comercial
                    - valor_unitario_comercial
                    - valor_bruto
                formas_pagamento:
                  type: array
