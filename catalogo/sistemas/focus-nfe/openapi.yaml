      description: Lista os ZIPs mensais de XMLs (NF-e, NFC-e, CT-e, MDF-e) e DANFEs de um CNPJ. Gerados no dia 1º, com parcial
        aos sábados; mantidos por pelo menos 6 meses.
      tags:
      - Documento
      x-confianca: verificado
      x-fonte-url: https://doc.focusnfe.com.br/reference/consultar_backups_por_cnpj
      x-entidade-canonica: Documento
      x-acao-canonica: listar
      parameters:
      - name: cnpj
        in: path
        required: true
        description: CNPJ emitente.
        schema:
          type: string
          description: CNPJ emitente.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
              - mes: '202608'
                danfes: <<URL_ZIP_DANFES>>
                xmls: <<URL_ZIP_XMLS>>
        '401':
          description: Não autenticado
          content:
            text/html:
              schema:
                type: string
        '403':
          description: O CNPJ não está cadastrado/habilitado para o token usado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: permissao_negada
                mensagem: CNPJ do emitente não autorizado.
        '429':
          description: Mais de 100 requisições por minuto no mesmo token (doc legada oficial) ou, como observado em teste,
            várias autenticações falhas do mesmo IP (codigo limite_excedido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: ''
                mensagem: Too many requests
