      x-entidade-canonica: NotaFiscal
      x-acao-canonica: consultar_status
      parameters:
      - name: referencia
        in: path
        required: true
        description: Valor de ref usado na emissão do NFS-e (identificador do seu sistema).
        schema:
          type: string
          description: Valor de ref usado na emissão do NFS-e (identificador do seu sistema).
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                ref: os555
                status: autorizado
                numero: '123'
                codigo_verificacao: <<CODIGO>>
        '401':
          description: Não autenticado
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Referência/chave/ID inexistente para este token ou ambiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: nao_encontrado
                mensagem: Nota fiscal não encontrada
        '429':
          description: Mais de 100 requisições por minuto no mesmo token (doc legada oficial) ou, como observado em teste,
            várias autenticações falhas do mesmo IP (codigo limite_excedido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: ''
                mensagem: Too many requests
    delete:
      operationId: focus-nfe__nota_fiscal__cancelar__nfse
      summary: NFSe > Cancelar
      description: 'Solicita o cancelamento da nota de serviço. A resposta é síncrona: cancelado ou erro_cancelamento com
        a lista de erros do autorizador.'
      tags:
      - nfse
      x-confianca: verificado
      x-fonte-url: https://doc.focusnfe.com.br/reference/cancelar_nfse
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: cancelar
      parameters:
      - name: referencia
        in: path
        required: true
        description: Valor de ref usado na emissão do NFS-e (identificador do seu sistema).
        schema:
          type: string
          description: Valor de ref usado na emissão do NFS-e (identificador do seu sistema).
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              example:
                status: erro_cancelamento
                erros:
                - codigo: V999
                  mensagem: NFSe fora do prazo de cancelamento permitido
                  correcao: null
        '400':
          description: Nota ainda em processamento ou rejeitada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: nfe_nao_autorizada
                mensagem: Nota fiscal não autorizada não pode ser cancelada
        '401':
          description: Não autenticado
          content:
            text/html:
              schema:
                type: string
        '404':
          description: Referência/chave/ID inexistente para este token ou ambiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: nao_encontrado
                mensagem: Nota fiscal não encontrada
        '429':
          description: Mais de 100 requisições por minuto no mesmo token (doc legada oficial) ou, como observado em teste,
            várias autenticações falhas do mesmo IP (codigo limite_excedido).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'
              example:
                codigo: ''
                mensagem: Too many requests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                justificativa:
                  type: string
                  description: Motivo do cancelamento (até 255 caracteres; alguns autorizadores exigem).
                  maxLength: 255
            example:
              justificativa: Servico nao prestado por desistencia do cliente
