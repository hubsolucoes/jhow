  /ws/nfeinutilizacao/nfeinutilizacao4.asmx:
    post:
      operationId: sefaz-nfe__nota_fiscal__inutilizar
      summary: NfeInutilizacao - metodo nfeInutilizacaoNF (schema inutNFe_v4.00.xsd)
      description: 'Declara ao Fisco que uma faixa de numeracao de determinada serie nao sera utilizada, fechando o buraco
        na sequencia. Processo sincrono e assinado digitalmente. Aceita ate 10.000 numeros por pedido e exige justificativa
        de 15 a 255 caracteres. O retorno de sucesso e cStat 102 com numero de protocolo de inutilizacao.


        Quando usar: Quando um numero foi consumido pelo sistema mas nunca chegou a ser autorizado (falha de impressao, erro
        de sequencia, teste em producao) e a numeracao ficou com lacuna. E obrigacao acessoria: a maioria das UF exige a inutilizacao
        ate o mes seguinte. Nao serve para anular nota autorizada, para isso e cancelamento.


        Transporte: SOAP 1.2 sobre HTTPS com autenticacao mutua (certificado ICP-Brasil). O corpo e um envelope soap12:Envelope
        com nfeCabecMsg (cUF e versaoDados) no Header e nfeDadosMsg no Body. O HTTP devolve sempre 200: o resultado de negocio
        esta em cStat e xMotivo.


        URL real deste servico: /ws/nfeinutilizacao/nfeinutilizacao4.asmx'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=LrBx7WT9PuA=
      x-acao-canonica: inutilizar
      x-entidade-canonica: NotaFiscal
      x-url-real: /ws/nfeinutilizacao/nfeinutilizacao4.asmx
      x-seguro-para-executar: false
      requestBody:
        required: true
        content:
          application/soap+xml:
            schema:
              type: string
              contentMediaType: application/soap+xml
              description: Envelope SOAP 1.2 completo. O conteudo de nfeDadosMsg segue o schema XSD indicado em x-schema-xsd.
            example: '{"soap_body": "<inutNFe versao=\"4.00\" xmlns=\"http://www.portalfiscal.inf.br/nfe\"><infInut Id=\"ID43260000000000019155001000000101000000120\"><tpAmb>2</tpAmb><xServ>INUTILIZAR</xServ><cUF>43</cUF><ano>26</ano><CNPJ>00000000000191</CNPJ><mod>55</mod><serie>1</serie><nNFIni>101</nNFIni><nNFFin>120</nNFFin><xJust>Falha
              de impressao com perda da sequencia de numeracao</xJust></infInut><Signature>...</Signature></inutNFe>"}'
      responses:
        '200':
          description: Envelope SOAP 1.2 de resposta. cStat/xMotivo indicam sucesso ou rejeicao; consulte a lista de codigos
            em erros[] do endpoints.json.
          content:
            application/soap+xml:
              schema:
                type: string
                contentMediaType: application/soap+xml
              example: '{"retInutNFe": {"infInut": {"tpAmb": "2", "cStat": "102", "xMotivo": "Inutilizacao de numero homologado",
                "cUF": "43", "ano": "26", "CNPJ": "00000000000191", "mod": "55", "serie": "1", "nNFIni": "101", "nNFFin":
                "120", "dhRecbto": "2026-09-18T11:00:00-03:00", "nProt": "143260000000200"}}}'
        '500':
          description: SOAP Fault. Costuma indicar payload malformado, versaoDados incompativel ou indisponibilidade do autorizador.
      parameters:
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - application/soap+xml; charset=utf-8
        description: SOAP 1.2 usa application/soap+xml, nao text/xml.
  /ws/recepcaoevento/recepcaoevento4.asmx:
    post:
      operationId: sefaz-nfe__nota_fiscal__cancelar
      summary: NFeRecepcaoEvento - evento 110111 Cancelamento (schema envEventoCancNFe_v1.00.xsd)
      description: 'Registra o evento de cancelamento de uma NF-e ou NFC-e ja autorizada, informando o protocolo de autorizacao
        e uma justificativa de 15 a 255 caracteres. E sincrono e vai dentro do envelope generico de eventos (envEvento), que
        aceita ate 20 eventos por lote. Sucesso devolve cStat 135 no evento, com protocolo proprio; algumas UF aceitam cancelamento
        fora do prazo e devolvem cStat 155.


        Quando usar: Quando a operacao nao vai acontecer e a nota foi autorizada ha menos de 24 horas (prazo nacional para
        NF-e; a NFC-e tem prazo estadual bem menor). Passado o prazo, o autorizador rejeita com cStat 501 e a correcao so
        pode ser feita por nota de devolucao ou ajuste.


        Transporte: SOAP 1.2 sobre HTTPS com autenticacao mutua (certificado ICP-Brasil). O corpo e um envelope soap12:Envelope
        com nfeCabecMsg (cUF e versaoDados) no Header e nfeDadosMsg no Body. O HTTP devolve sempre 200: o resultado de negocio
        esta em cStat e xMotivo.


        URL real deste servico: /ws/recepcaoevento/recepcaoevento4.asmx'
