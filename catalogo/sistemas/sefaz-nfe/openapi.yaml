openapi: 3.1.0
info:
  title: SEFAZ - web services de NF-e e NFC-e (reconstruido)
  version: '4.00'
  summary: Descricao OpenAPI, reconstruida a partir da documentacao oficial, dos web services SOAP 1.2 de NF-e (modelo 55)
    e NFC-e (modelo 65).
  description: 'AVISO IMPORTANTE: a SEFAZ nao publica OpenAPI. Esta spec foi reconstruida a partir do Manual de Orientacao
    do Contribuinte (MOC) 7.0 e das Notas Tecnicas vigentes, para servir de documentacao legivel por maquina. Os servicos
    sao SOAP 1.2 (WS-I Basic Profile, Document/Literal), nao REST: cada operacao e um POST no caminho do arquivo .asmx (ou
    endpoint equivalente) do autorizador, com um envelope soap12:Envelope no corpo.


    NAO EXISTE BASE URL UNICA. Os servers abaixo usam o SVRS (NF-e modelo 55) como referencia. A URL real varia por UF do
    emitente, por ambiente (producao/homologacao) e por modelo (55 x 65), e a tabela oficial de producao esta em https://www.nfe.fazenda.gov.br/portal/webServices.aspx?tipoConteudo=OUC/YVNWZfo=
    . As URLs de homologacao ficam nos portais das SEFAZ estaduais e do SVRS. Operacoes do Ambiente Nacional (NFeDistribuicaoDFe,
    manifestacao do destinatario e EPEC) e a consulta cadastro trazem servers proprios no nivel da operacao.


    AUTENTICACAO: TLS 1.2 ou superior com autenticacao mutua, apresentando certificado ICP-Brasil (A1 ou A3) que contenha
    o CNPJ no OID 2.16.76.1.3.3 ou o CPF no OID 2.16.76.1.3.1, com Extended Key Usage de autenticacao de cliente. Nao ha token,
    header de API key nem OAuth. Alem disso, as mensagens de escrita precisam ir assinadas com XML-DSig sobre o elemento identificado
    pelo atributo Id. Isso nao e representavel pelos securitySchemes do OpenAPI, entao esta declarado apenas em texto e na
    extensao x-autenticacao.


    O HTTP devolve 200 mesmo em rejeicao: o resultado de negocio vem nos campos cStat e xMotivo.'
  contact:
    name: Portal Nacional da Nota Fiscal Eletronica
    url: https://www.nfe.fazenda.gov.br/portal/
externalDocs:
  description: Manual de Orientacao do Contribuinte (MOC) 7.0 e anexos
  url: https://www.nfe.fazenda.gov.br/portal/listaConteudo.aspx?tipoConteudo=ndIjl+iEFdE=
x-autenticacao:
  tipo: certificado ICP-Brasil em TLS mutuo (mTLS) + assinatura XML-DSig no documento
  observacao: Sem OAuth, sem token, sem header de credencial. O certificado de transmissao e o de assinatura podem ser diferentes.
  oid_cnpj: 2.16.76.1.3.3
  oid_cpf: 2.16.76.1.3.1
servers:
- url: https://nfe.svrs.rs.gov.br
  description: SVRS - NF-e modelo 55 - PRODUCAO (referencia; use a URL da UF do emitente)
- url: https://nfe-homologacao.svrs.rs.gov.br
  description: SVRS - NF-e modelo 55 - HOMOLOGACAO (sandbox)
- url: https://nfce.svrs.rs.gov.br
  description: SVRS - NFC-e modelo 65 - PRODUCAO
- url: https://nfce-homologacao.svrs.rs.gov.br
  description: SVRS - NFC-e modelo 65 - HOMOLOGACAO
- url: https://nfe.fazenda.sp.gov.br
  description: SEFAZ-SP - NF-e - PRODUCAO
- url: https://homologacao.nfe.fazenda.sp.gov.br
  description: SEFAZ-SP - NF-e - HOMOLOGACAO
- url: https://www.sefazvirtual.fazenda.gov.br
  description: SVAN e SVC-AN - PRODUCAO
tags:
- name: NotaFiscal
  description: Autorizacao, consulta, eventos, inutilizacao e distribuicao de NF-e e NFC-e.
- name: Pessoa
  description: Consulta ao cadastro de contribuintes do ICMS.
paths:
  /ws/NfeAutorizacao/NFeAutorizacao4.asmx:
    post:
      operationId: sefaz-nfe__nota_fiscal__emitir
      summary: NfeAutorizacao - metodo nfeAutorizacaoLote (schema enviNFe_v4.00.xsd)
      description: 'Envia um lote com ate 50 NF-e (modelo 55) ou exatamente 1 NFC-e (modelo 65) para o autorizador pedir a
        autorizacao de uso. O XML de cada nota ja vai assinado. Por padrao o processamento e assincrono: a resposta imediata
        traz apenas cStat 103 e um numero de recibo (nRec) que depois e consultado no NfeRetAutorizacao. Com indSinc=1 e uma
        unica NF-e no lote, o autorizador que implementa o modo sincrono devolve o protocolo na mesma conexao, sem gerar recibo.
        Existe tambem o metodo alternativo NfeAutorizacaoLoteZip, que recebe a mesma mensagem enviNFe compactada em GZip e
        codificada em Base64 no parametro nfeDadosMsgZip.


        Quando usar: Sempre que a empresa precisar autorizar um documento fiscal novo. E a unica porta de entrada de NF-e
        e NFC-e: nao existe rascunho nem pre-emissao no autorizador. Use o modo sincrono no varejo (NFC-e e balcao), onde
        o caixa precisa da resposta na hora; use o modo assincrono para faturamento em lote.


        Transporte: SOAP 1.2 sobre HTTPS com autenticacao mutua (certificado ICP-Brasil). O corpo e um envelope soap12:Envelope
        com nfeCabecMsg (cUF e versaoDados) no Header e nfeDadosMsg no Body. O HTTP devolve sempre 200: o resultado de negocio
        esta em cStat e xMotivo.


        URL real deste servico: /ws/NfeAutorizacao/NFeAutorizacao4.asmx'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=LrBx7WT9PuA=
      x-acao-canonica: emitir
      x-entidade-canonica: NotaFiscal
      x-url-real: /ws/NfeAutorizacao/NFeAutorizacao4.asmx
      x-seguro-para-executar: false
      requestBody:
        required: true
        content:
          application/soap+xml:
            schema:
              type: string
              contentMediaType: application/soap+xml
              description: Envelope SOAP 1.2 completo. O conteudo de nfeDadosMsg segue o schema XSD indicado em x-schema-xsd.
            example: '{"observacao": "Envelope SOAP 1.2 resumido; o elemento NFe completo segue o MOC Anexo I e vai assinado.",
              "soap": "<soap12:Envelope xmlns:soap12=\"http://www.w3.org/2003/05/soap-envelope\"><soap12:Header><nfeCabecMsg
              xmlns=\"http://www.portalfiscal.inf.br/nfe/wsdl/NFeAutorizacao4\"><cUF>43</cUF><versaoDados>4.00</versaoDados></nfeCabecMsg></soap12:Header><soap12:Body><nfeDadosMsg
              xmlns=\"http://www.portalfiscal.inf.br/nfe/wsdl/NFeAutorizacao4\"><enviNFe versao=\"4.00\" xmlns=\"http://www.portalfiscal.inf.br/nfe\"><idLote>000000000000042</idLote><indSinc>1</indSinc><NFe><infNFe
              versao=\"4.00\" Id=\"NFe43260900000000000191550010000000011000000015\">...</infNFe><Signature>...</Signature></NFe></enviNFe></nfeDadosMsg></soap12:Body></soap12:Envelope>"}'
      responses:
        '200':
          description: Envelope SOAP 1.2 de resposta. cStat/xMotivo indicam sucesso ou rejeicao; consulte a lista de codigos
            em erros[] do endpoints.json.
          content:
            application/soap+xml:
              schema:
                type: string
                contentMediaType: application/soap+xml
              example: '{"assincrono": {"retEnviNFe": {"tpAmb": "2", "verAplic": "RS20260101", "cStat": "103", "xMotivo":
                "Lote recebido com sucesso", "cUF": "43", "dhRecbto": "2026-09-18T10:12:00-03:00", "infRec": {"nRec": "431000000000001"}}},
                "sincrono": {"retEnviNFe": {"tpAmb": "2", "cStat": "104", "xMotivo": "Lote processado", "protNFe": {"infProt":
                {"chNFe": "43260900000000000191550010000000011000000015", "nProt": "143260000000001", "cStat": "100", "xMotivo":
                "Autorizado o uso da NF-e"}}}}}'
        '500':
          description: SOAP Fault. Costuma indicar payload malformado, versaoDados incompativel ou indisponibilidade do autorizador.
      parameters:
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - application/soap+xml; charset=utf-8
        description: SOAP 1.2 usa application/soap+xml, nao text/xml.
  /ws/NfeRetAutorizacao/NFeRetAutorizacao4.asmx:
    post:
      operationId: sefaz-nfe__nota_fiscal__consultar_status__lote
      summary: NfeRetAutorizacao - metodo nfeRetAutorizacao (schema consReciNFe_v4.00.xsd)
      description: 'Consulta o resultado do processamento de um lote enviado ao NfeAutorizacao no modo assincrono, usando
        o numero do recibo (nRec) devolvido com cStat 103. A resposta traz o status do lote e, quando cStat=104 (lote processado),
        um elemento protNFe por documento com chave de acesso, protocolo, cStat individual e digest value. Este web service
        tambem serve de canal de comunicacao da SEFAZ com o emissor, pelos campos cMsg e xMsg.


        Quando usar: Logo apos enviar um lote assincrono, respeitando a espera minima de 15 segundos prevista no MOC, e em
        laco enquanto o retorno for cStat 105 (lote em processamento). Tambem e o caminho de recuperacao quando a conexao
        caiu depois do POST de autorizacao e voce guardou o recibo.


        Transporte: SOAP 1.2 sobre HTTPS com autenticacao mutua (certificado ICP-Brasil). O corpo e um envelope soap12:Envelope
        com nfeCabecMsg (cUF e versaoDados) no Header e nfeDadosMsg no Body. O HTTP devolve sempre 200: o resultado de negocio
        esta em cStat e xMotivo.


        URL real deste servico: /ws/NfeRetAutorizacao/NFeRetAutorizacao4.asmx'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=LrBx7WT9PuA=
      x-acao-canonica: consultar_status
      x-entidade-canonica: NotaFiscal
      x-url-real: /ws/NfeRetAutorizacao/NFeRetAutorizacao4.asmx
      x-seguro-para-executar: true
      requestBody:
        required: true
        content:
          application/soap+xml:
            schema:
              type: string
              contentMediaType: application/soap+xml
              description: Envelope SOAP 1.2 completo. O conteudo de nfeDadosMsg segue o schema XSD indicado em x-schema-xsd.
            example: '{"soap_body": "<consReciNFe versao=\"4.00\" xmlns=\"http://www.portalfiscal.inf.br/nfe\"><tpAmb>2</tpAmb><nRec>431000000000001</nRec></consReciNFe>"}'
      responses:
        '200':
          description: Envelope SOAP 1.2 de resposta. cStat/xMotivo indicam sucesso ou rejeicao; consulte a lista de codigos
            em erros[] do endpoints.json.
          content:
            application/soap+xml:
              schema:
                type: string
                contentMediaType: application/soap+xml
              example: '{"retConsReciNFe": {"tpAmb": "2", "verAplic": "RS20260101", "nRec": "431000000000001", "cStat": "104",
                "xMotivo": "Lote processado", "cUF": "43", "dhRecbto": "2026-09-18T10:12:20-03:00", "protNFe": [{"infProt":
                {"chNFe": "43260900000000000191550010000000011000000015", "nProt": "143260000000001", "cStat": "100", "xMotivo":
                "Autorizado o uso da NF-e", "digVal": "aBcDeFgHiJkLmNoPqRsTuVwXyZ01"}}]}}'
        '500':
          description: SOAP Fault. Costuma indicar payload malformado, versaoDados incompativel ou indisponibilidade do autorizador.
      parameters:
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - application/soap+xml; charset=utf-8
        description: SOAP 1.2 usa application/soap+xml, nao text/xml.
  /ws/NfeConsulta/NfeConsulta4.asmx:
    post:
      operationId: sefaz-nfe__nota_fiscal__consultar_status__protocolo
      summary: NfeConsultaProtocolo - metodo nfeConsulta (schema consSitNFe_4.00.xsd)
      description: 'Consulta a situacao atual de uma NF-e ou NFC-e na base do autorizador, exclusivamente pela chave de acesso
        de 44 digitos. A resposta traz o cStat da consulta e, conforme o caso, o protocolo de autorizacao (protNFe), o protocolo
        de cancelamento (retCancNFe) e a lista de eventos ja registrados para aquela chave (procEventoNFe), incluindo Carta
        de Correcao e manifestacoes do destinatario.


        Quando usar: E o servico de verdade de campo: use para confirmar se uma nota foi mesmo autorizada depois de uma falha
        de rede, para descobrir se ja existe cancelamento ou CC-e antes de tentar um novo evento, e para conciliar o que o
        ERP acha que emitiu com o que o Fisco registrou. Tambem e o caminho para recuperar o numero do protocolo, exigido
        no evento de cancelamento.


        Transporte: SOAP 1.2 sobre HTTPS com autenticacao mutua (certificado ICP-Brasil). O corpo e um envelope soap12:Envelope
        com nfeCabecMsg (cUF e versaoDados) no Header e nfeDadosMsg no Body. O HTTP devolve sempre 200: o resultado de negocio
        esta em cStat e xMotivo.


        URL real deste servico: /ws/NfeConsulta/NfeConsulta4.asmx'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=LrBx7WT9PuA=
      x-acao-canonica: consultar_status
      x-entidade-canonica: NotaFiscal
      x-url-real: /ws/NfeConsulta/NfeConsulta4.asmx
      x-seguro-para-executar: true
      requestBody:
        required: true
        content:
          application/soap+xml:
            schema:
              type: string
              contentMediaType: application/soap+xml
              description: Envelope SOAP 1.2 completo. O conteudo de nfeDadosMsg segue o schema XSD indicado em x-schema-xsd.
            example: '{"soap_body": "<consSitNFe versao=\"4.00\" xmlns=\"http://www.portalfiscal.inf.br/nfe\"><tpAmb>2</tpAmb><xServ>CONSULTAR</xServ><chNFe>43260900000000000191550010000000011000000015</chNFe></consSitNFe>"}'
      responses:
        '200':
          description: Envelope SOAP 1.2 de resposta. cStat/xMotivo indicam sucesso ou rejeicao; consulte a lista de codigos
            em erros[] do endpoints.json.
          content:
            application/soap+xml:
              schema:
                type: string
                contentMediaType: application/soap+xml
              example: '{"retConsSitNFe": {"tpAmb": "2", "cStat": "100", "xMotivo": "Autorizado o uso da NF-e", "cUF": "43",
                "chNFe": "43260900000000000191550010000000011000000015", "protNFe": {"infProt": {"nProt": "143260000000001",
                "cStat": "100", "xMotivo": "Autorizado o uso da NF-e", "dhRecbto": "2026-09-18T10:12:20-03:00"}}, "procEventoNFe":
                [{"evento": {"infEvento": {"tpEvento": "110110", "nSeqEvento": "1"}}, "retEvento": {"infEvento": {"cStat":
                "135", "nProt": "143260000000099"}}}]}}'
        '500':
          description: SOAP Fault. Costuma indicar payload malformado, versaoDados incompativel ou indisponibilidade do autorizador.
      parameters:
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - application/soap+xml; charset=utf-8
        description: SOAP 1.2 usa application/soap+xml, nao text/xml.
  /ws/NfeStatusServico/NfeStatusServico4.asmx:
    post:
      operationId: sefaz-nfe__nota_fiscal__consultar_status__servico
      summary: NfeStatusServico - metodo nfeStatusServico (schema consStatServ_v4.00.xsd)
      description: 'Consulta a disponibilidade do ambiente autorizador. Devolve cStat 107 (Servico em Operacao), 108 (Servico
        Paralisado Momentaneamente) ou 109 (Servico Paralisado sem Previsao), o tempo medio de resposta dos ultimos 5 minutos
        (tMed), a previsao de retorno (dhRetorno) e observacoes livres da UF (xObs).


        Quando usar: Antes de abrir o caixa ou o turno de faturamento, e como sonda periodica para decidir entrada e saida
        de contingencia. O MOC exige espera minima de 3 minutos entre consultas quando a aplicacao fica em laco permanente,
        para nao sobrecarregar o autorizador.


        Transporte: SOAP 1.2 sobre HTTPS com autenticacao mutua (certificado ICP-Brasil). O corpo e um envelope soap12:Envelope
        com nfeCabecMsg (cUF e versaoDados) no Header e nfeDadosMsg no Body. O HTTP devolve sempre 200: o resultado de negocio
        esta em cStat e xMotivo.


        URL real deste servico: /ws/NfeStatusServico/NfeStatusServico4.asmx'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://www.nfe.fazenda.gov.br/portal/exibirArquivo.aspx?conteudo=LrBx7WT9PuA=
      x-acao-canonica: consultar_status
      x-entidade-canonica: NotaFiscal
      x-url-real: /ws/NfeStatusServico/NfeStatusServico4.asmx
      x-seguro-para-executar: true
      requestBody:
        required: true
        content:
          application/soap+xml:
            schema:
              type: string
              contentMediaType: application/soap+xml
              description: Envelope SOAP 1.2 completo. O conteudo de nfeDadosMsg segue o schema XSD indicado em x-schema-xsd.
            example: '{"soap_body": "<consStatServ versao=\"4.00\" xmlns=\"http://www.portalfiscal.inf.br/nfe\"><tpAmb>2</tpAmb><cUF>43</cUF><xServ>STATUS</xServ></consStatServ>"}'
      responses:
        '200':
          description: Envelope SOAP 1.2 de resposta. cStat/xMotivo indicam sucesso ou rejeicao; consulte a lista de codigos
            em erros[] do endpoints.json.
          content:
            application/soap+xml:
              schema:
                type: string
                contentMediaType: application/soap+xml
              example: '{"retConsStatServ": {"tpAmb": "2", "verAplic": "RS20260101", "cStat": "107", "xMotivo": "Servico em
                Operacao", "cUF": "43", "dhRecbto": "2026-09-18T09:00:00-03:00", "tMed": "1"}}'
        '500':
          description: SOAP Fault. Costuma indicar payload malformado, versaoDados incompativel ou indisponibilidade do autorizador.
      parameters:
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
          enum:
