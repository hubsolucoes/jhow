        nao foi ativada para aquela UF. A NF-e precisa ser gerada com tpEmis=4 e numero diferente de qualquer nota ja transmitida
        com outro tpEmis. Cessado o problema, a NF-e correspondente tem de ser transmitida ao autorizador de origem dentro
