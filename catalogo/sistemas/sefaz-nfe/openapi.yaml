      summary: NFeDistribuicaoDFe - metodo nfeDistDFeInteresse (schema distDFeInt_v9.99.xsd), versao 1.00
      description: 'Servico do Ambiente Nacional que entrega ao interessado os documentos fiscais eletronicos e resumos que
        nao foram gerados por ele: NF-e emitidas contra o seu CNPJ, eventos de cancelamento, Carta de Correcao, resumos de
        eventos de CT-e e MDF-e e outros. Aceita tres modos: distNSU (lote a partir do ultimo NSU conhecido), consNSU (um
        NSU especifico, para fechar lacuna) e consChNFe (uma NF-e por chave de acesso). Devolve ate 50 documentos por chamada,
        cada um em docZip compactado em GZip e codificado em Base64, com o atributo schema identificando o tipo.


        Quando usar: E o unico mecanismo de notificacao do ecossistema NF-e: nao ha webhook. Use em rotina agendada para descobrir
        notas recebidas de fornecedores, alimentar contas a pagar e entrada de mercadoria, e disparar a manifestacao do destinatario.
        Tambem serve para montar base analitica de compras a partir do XML oficial.


        Transporte: SOAP 1.2 sobre HTTPS com autenticacao mutua (certificado ICP-Brasil). O corpo e um envelope soap12:Envelope
        com nfeCabecMsg (cUF e versaoDados) no Header e nfeDadosMsg no Body. O HTTP devolve sempre 200: o resultado de negocio
        esta em cStat e xMotivo.


