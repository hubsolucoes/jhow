        mais recente precisa conter todas as correcoes. O sequencial nSeqEvento vai de 1 a 20.


        Quando usar: Para corrigir erro que nao mexe no valor do imposto, nem troca remetente ou destinatario, nem altera
        data de emissao ou de saida: tipicamente descricao do produto, dados de transporte, informacoes complementares. Nao
        existe CC-e para NFC-e: o autorizador rejeita com cStat 784.


