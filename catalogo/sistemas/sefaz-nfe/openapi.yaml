      x-acao-canonica: obter
      x-entidade-canonica: Pessoa
      x-url-real: /ws/cadconsultacadastro/cadconsultacadastro4.asmx
      x-seguro-para-executar: true
      requestBody:
        required: true
        content:
          application/soap+xml:
            schema:
              type: string
              contentMediaType: application/soap+xml
              description: Envelope SOAP 1.2 completo. O conteudo de nfeDadosMsg segue o schema XSD indicado em x-schema-xsd.
            example: '{"soap_body": "<ConsCad versao=\"2.00\" xmlns=\"http://www.portalfiscal.inf.br/nfe\"><infCons><xServ>CONS-CAD</xServ><UF>RS</UF><CNPJ>00000000000191</CNPJ></infCons></ConsCad>"}'
      responses:
        '200':
          description: Envelope SOAP 1.2 de resposta. cStat/xMotivo indicam sucesso ou rejeicao; consulte a lista de codigos
            em erros[] do endpoints.json.
          content:
            application/soap+xml:
              schema:
                type: string
                contentMediaType: application/soap+xml
              example: '{"retConsCad": {"infCons": {"cStat": "111", "xMotivo": "Consulta cadastro com uma ocorrencia", "UF":
                "RS", "CNPJ": "00000000000191", "dhCons": "2026-09-18T14:00:00-03:00", "infCad": [{"IE": "0000000000", "CNPJ":
                "00000000000191", "UF": "RS", "cSit": "1", "indCredNFe": "1", "indCredCTe": "0", "xNome": "EMPRESA EXEMPLO
                LTDA", "CNAE": "4711302", "dIniAtiv": "2010-01-04", "Ender": {"xLgr": "RUA EXEMPLO", "nro": "100", "xBairro":
                "CENTRO", "cMun": "4314902", "xMun": "PORTO ALEGRE", "CEP": "90000000"}}]}}}'
        '500':
          description: SOAP Fault. Costuma indicar payload malformado, versaoDados incompativel ou indisponibilidade do autorizador.
      parameters:
      - name: Content-Type
        in: header
        required: true
        schema:
          type: string
          enum:
          - application/soap+xml; charset=utf-8
        description: SOAP 1.2 usa application/soap+xml, nao text/xml.
      servers:
      - url: https://cad.svrs.rs.gov.br
        description: SVRS consulta cadastro - producao (host proprio, diferente dos demais servicos do SVRS)
      - url: https://cad-homologacao.svrs.rs.gov.br
        description: 'SVRS consulta cadastro - homologacao (INFERIDO: nao confirmado em fonte oficial nesta consulta)'
