      description: 'Consulta o cadastro de contribuintes do ICMS de uma unidade federada por CNPJ, IE ou CPF. Devolve situacao
        cadastral (habilitado ou nao), indicadores de credenciamento para NF-e e CT-e, razao social, nome fantasia, regime
        de apuracao, CNAE, datas de inicio de atividade, ultima alteracao e baixa, IE unica e endereco. Contribuinte com inscricao
        unica pode devolver varios estabelecimentos (cStat 112).


        Quando usar: Antes de faturar para um cliente novo ou para higienizar a base de clientes e fornecedores, evitando
        rejeicoes por IE invalida ou destinatario nao contribuinte. O servico e oferecido obrigatoriamente pelas UF que autorizam
        documentos fiscais eletronicos, mas o MOC avisa que a disponibilidade dele e menor que a dos demais web services.


        Transporte: SOAP 1.2 sobre HTTPS com autenticacao mutua (certificado ICP-Brasil). O corpo e um envelope soap12:Envelope
        com nfeCabecMsg (cUF e versaoDados) no Header e nfeDadosMsg no Body. O HTTP devolve sempre 200: o resultado de negocio
        esta em cStat e xMotivo.


