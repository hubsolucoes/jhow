      description: Cadastra um recebedor (seller/parceiro) que receberá parte das vendas via split, com dados cadastrais de PF ou PJ, conta bancária
        de destino e regras de transferência e de antecipação automática. Cada recebedor é criado uma vez e reutilizado em quantos pedidos forem
