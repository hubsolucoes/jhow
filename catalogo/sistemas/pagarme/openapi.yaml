openapi: 3.1.0
info:
  title: Pagar.me Core API v5 (reconstrucao do catalogo)
  version: '5'
  description: Subconjunto detalhado reconstruido a partir da referencia oficial docs.pagar.me (API v5 / Core API). Consulta em 2026-09-17. Teste
    e producao usam a MESMA base; o que define o ambiente e o prefixo da chave secreta (sk_test_ = teste, sk_ = producao).
servers:
- url: https://api.pagar.me
  description: Producao e teste (o ambiente vem do prefixo da chave)
- url: https://sdx-api.pagar.me
  description: 'Ambiente de mocks das mudancas de contrato (header X-Use-Mocks: true)'
security:
- basicAuth: []
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
      description: 'HTTP Basic: usuario = chave secreta (sk_...), senha vazia.'
  schemas:
    Erro:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          description: Mapa campo -> mensagens, em erros de validacao.
        request:
          type: object
          description: Eco do corpo recebido, em erros de validacao.
  responses:
    NaoAutorizado:
      description: Credencial ausente, invalida ou de outro ambiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    LimiteExcedido:
      description: Rate limit da rota excedido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
paths:
  /core/v5/customers:
    post:
      operationId: pagarme__cliente__criar
      summary: Criar cliente
      description: Cadastra um comprador na carteira de clientes da loja. O cliente criado pode ser reaproveitado em pedidos, assinaturas e links
        de pagamento pelo customer_id, e é ele que ancora cartões e endereços salvos.
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://docs.pagar.me/reference/criar-cliente-1
      x-acao-canonica: criar
      x-seguro-para-executar: false
      security:
      - basicAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nome.
                email:
                  type: string
                  description: E-mail do cliente.
                code:
                  type: string
                  description: Seu identificador do registro (referência externa). Serve para localizar o objeto depois sem guardar o id do Pagar.me.
                document:
                  type: string
                  description: 'Número do documento: CPF, CNPJ ou passaporte, sem máscara.'
                document_type:
                  type: string
                  enum:
                  - CPF
                  - CNPJ
                  - PASSPORT
                  description: 'Natureza do documento informado: CPF, CNPJ ou PASSPORT.'
                type:
                  type: string
                  description: Tipo do registro; os valores válidos variam por recurso.
                gender:
                  type: string
                  enum:
                  - male
                  - female
                  description: 'Gênero declarado: male ou female.'
                address:
                  type: object
                  description: Endereço vinculado ao registro.
                phones:
                  type: object
                  description: Telefones do cliente (residencial e/ou celular).
                birthdate:
                  type: string
                  format: date
                  description: Data de nascimento.
                metadata:
                  type: string
                  description: Pares chave/valor livres, gravados junto ao registro e devolvidos nas consultas e nos webhooks. Bom lugar para
                    o identificador do seu ERP.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
    get:
      operationId: pagarme__cliente__listar
      summary: Listar clientes
      description: Devolve a carteira de clientes da loja, paginada por page/size, com filtros por nome, documento, e-mail, gênero e pelo seu
        código externo (code).
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://docs.pagar.me/reference/listar-clientes-1
      x-acao-canonica: listar
      x-seguro-para-executar: true
      security:
      - basicAuth: []
      parameters:
      - name: name
        in: query
        required: false
        description: Nome.
        schema:
          type: string
      - name: document
        in: query
        required: false
        description: 'Número do documento: CPF, CNPJ ou passaporte, sem máscara.'
        schema:
          type: string
      - name: email
        in: query
        required: false
        description: E-mail do cliente.
        schema:
          type: string
      - name: gender
        in: query
        required: false
        description: 'Gênero declarado: male ou female.'
        schema:
          type: string
          enum:
          - male
          - female
      - name: page
        in: query
        required: false
        description: Número da página a recuperar, começando em 1.
        schema:
          type: integer
      - name: size
        in: query
        required: false
        description: Quantidade de registros por página.
        schema:
          type: integer
      - name: code
        in: query
        required: false
        description: Seu identificador do registro (referência externa). Serve para localizar o objeto depois sem guardar o id do Pagar.me.
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /core/v5/customers/{customer_id}:
    get:
      operationId: pagarme__cliente__obter
      summary: Obter cliente
      description: Retorna um cliente pelo identificador cus_. Traz o endereço principal, os telefones e o metadata gravado.
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://docs.pagar.me/reference/obter-cliente-1
      x-acao-canonica: obter
      x-seguro-para-executar: true
      security:
      - basicAuth: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: Identificador do cliente no Pagar.me (prefixo cus_).
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
    put:
      operationId: pagarme__cliente__atualizar
      summary: Editar cliente
      description: Substitui os dados cadastrais do cliente informado. Como o verbo é PUT, reenvie o conjunto completo de campos que deve permanecer
        no cadastro.
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://docs.pagar.me/reference/editar-cliente-1
      x-acao-canonica: atualizar
      x-seguro-para-executar: false
      security:
      - basicAuth: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: Identificador do cliente no Pagar.me (prefixo cus_).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Nome.
                email:
                  type: string
                  description: E-mail do cliente.
                code:
                  type: string
                  description: Seu identificador do registro (referência externa). Serve para localizar o objeto depois sem guardar o id do Pagar.me.
                document:
                  type: string
                  description: 'Número do documento: CPF, CNPJ ou passaporte, sem máscara.'
                document_type:
                  type: string
                  enum:
                  - CPF
                  - CNPJ
                  - PASSPORT
                  description: 'Natureza do documento informado: CPF, CNPJ ou PASSPORT.'
                type:
                  type: string
                  description: Tipo do registro; os valores válidos variam por recurso.
                gender:
                  type: string
                  enum:
                  - male
                  - female
                  description: 'Gênero declarado: male ou female.'
                address:
                  type: object
                  description: Endereço vinculado ao registro.
                phone:
                  type: object
                  description: Telefone de contato.
                birthdate:
                  type: string
                  format: date
                  description: Data de nascimento.
                metadata:
                  type: string
                  description: Pares chave/valor livres, gravados junto ao registro e devolvidos nas consultas e nos webhooks. Bom lugar para
                    o identificador do seu ERP.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /core/v5/customers/{customer_id}/cards:
    post:
      operationId: pagarme__cartao__criar
      summary: Criar cartão
      description: Salva um cartão na carteira (wallet) do cliente e devolve um card_id reutilizável. Aceita os dados abertos do cartão (exige
        ambiente PCI-DSS) ou um token gerado pelo tokenizecard.js.
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://docs.pagar.me/reference/criar-cart%C3%A3o
      x-acao-canonica: criar
      x-seguro-para-executar: false
      security:
      - basicAuth: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: Identificador do cliente no Pagar.me (prefixo cus_).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                number:
                  type: string
                  description: Número, sem máscara. Em telefones, o número da linha; em cartões, o PAN.
                holder_name:
                  type: string
                  description: Nome do portador exatamente como impresso no cartão (sem números nem caracteres especiais).
                holder_document:
                  type: string
                  description: CPF ou CNPJ do portador. Obrigatório para cartões voucher (VR, Pluxee).
                exp_month:
                  type: integer
                  description: Mês de validade do cartão, de 1 a 12.
                exp_year:
                  type: integer
                  description: Ano de validade do cartão, com 2 ou 4 dígitos.
                cvv:
                  type: string
                  description: Código de segurança do cartão (3 ou 4 dígitos, conforme a bandeira).
                brand:
                  type: string
                  description: 'Bandeira do cartão (ex.: visa, mastercard, elo, amex, hipercard; VR e Pluxee em voucher).'
                label:
                  type: string
                  description: Rótulo do cartão, usado em cartões multiaplicação.
                billing_address_id:
                  type: string
                  description: Identificador de um endereço já cadastrado, usado no lugar de billing_address.
                billing_address:
                  type: object
                  description: Endereço de cobrança do cartão.
                options:
                  type: object
                  description: Opções de responsabilidade e de cobrança de taxas do recebedor nesta regra.
                metadata:
                  type: string
                  description: Pares chave/valor livres, gravados junto ao registro e devolvidos nas consultas e nos webhooks. Bom lugar para
                    o identificador do seu ERP.
                token:
                  type: string
                  description: Token de cartão obtido previamente, usado no lugar dos dados abertos.
              required:
              - number
              - holder_name
              - exp_month
              - exp_year
              - cvv
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
    get:
      operationId: pagarme__cartao__listar
      summary: Listar cartões
      description: Lista os cartões salvos na carteira do cliente, sempre mascarados (BIN e quatro últimos dígitos).
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://docs.pagar.me/reference/listar-cart%C3%A3o
      x-acao-canonica: listar
      x-seguro-para-executar: true
      security:
      - basicAuth: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: Identificador do cliente no Pagar.me (prefixo cus_).
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /core/v5/customers/{customer_id}/cards/{card_id}:
    get:
      operationId: pagarme__cartao__obter
      summary: Obter cartão
      description: Retorna um cartão específico da carteira do cliente, com bandeira, validade, status e endereço de cobrança.
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://docs.pagar.me/reference/obter-cart%C3%A3o
      x-acao-canonica: obter
      x-seguro-para-executar: true
      security:
      - basicAuth: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: Identificador do cliente no Pagar.me (prefixo cus_).
        schema:
          type: string
      - name: card_id
        in: path
        required: true
        description: Identificador de um cartão já salvo na carteira do cliente (prefixo card_).
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
    delete:
      operationId: pagarme__cartao__excluir
      summary: Excluir cartão
      description: Remove o cartão da carteira do cliente. O cartão deixa de ser utilizável por card_id.
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://docs.pagar.me/reference/excluir-cart%C3%A3o
      x-acao-canonica: excluir
      x-seguro-para-executar: false
      security:
      - basicAuth: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: Identificador do cliente no Pagar.me (prefixo cus_).
        schema:
          type: string
      - name: card_id
        in: path
        required: true
        description: Identificador de um cartão já salvo na carteira do cliente (prefixo card_).
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /core/v5/tokens:
    post:
      operationId: pagarme__cartao__criar__token
      summary: Criar token de cartão
      description: Troca os dados abertos de um cartão por um token de uso único. É a alternativa ao tokenizecard.js quando não dá para embarcar
        o script no checkout. Autentica-se com a CHAVE PÚBLICA na query (appId), não com a chave secreta.
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://docs.pagar.me/reference/criar-token-cart%C3%A3o-1
      x-acao-canonica: criar
      x-seguro-para-executar: false
      security:
      - basicAuth: []
      parameters:
      - name: appId
        in: query
        required: true
        description: Chave pública da conta (pk_...). É o único parâmetro de autenticação desta rota; não use a chave secreta aqui.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
                  description: Tipo do registro; os valores válidos variam por recurso.
                card:
                  type: object
                  description: Dados do cartão. Enviar o cartão aberto exige ambiente PCI-DSS; prefira card_id ou card_token.
              required:
              - type
              - card
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /core/v5/customers/{customer_id}/addresses:
    post:
      operationId: pagarme__endereco__criar
      summary: Criar endereço
      description: Adiciona um endereço à carteira do cliente e devolve um addr_ reutilizável como billing_address_id de cartões e cobranças.
      tags:
      - Endereco
      x-confianca: verificado
      x-fonte-url: https://docs.pagar.me/reference/criar-endere%C3%A7o-1
      x-acao-canonica: criar
      x-seguro-para-executar: false
      security:
      - basicAuth: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: Identificador do cliente no Pagar.me (prefixo cus_).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                line_1:
                  type: string
                  description: 'Primeira linha do endereço: número, logradouro e bairro, nesta ordem e separados por vírgula.'
                line_2:
                  type: string
                  description: 'Segunda linha do endereço: complemento e referências.'
                zip_code:
                  type: string
                  description: CEP, só dígitos.
                city:
                  type: string
                  description: Município.
                state:
                  type: string
                  description: 'Unidade federativa no padrão ISO 3166-2 (só a sigla, ex.: SP).'
                country:
                  type: string
                  description: 'País no padrão ISO 3166-1 alpha-2 (ex.: BR).'
                metadata:
                  type: string
                  description: Pares chave/valor livres, gravados junto ao registro e devolvidos nas consultas e nos webhooks. Bom lugar para
                    o identificador do seu ERP.
              required:
              - line_1
              - zip_code
              - city
              - state
              - country
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
    get:
      operationId: pagarme__endereco__listar
      summary: Listar endereços
      description: Lista os endereços cadastrados na carteira de um cliente, com paginação page/size.
      tags:
      - Endereco
      x-confianca: verificado
      x-fonte-url: https://docs.pagar.me/reference/listar-endere%C3%A7os-1
      x-acao-canonica: listar
      x-seguro-para-executar: true
      security:
      - basicAuth: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: Identificador do cliente no Pagar.me (prefixo cus_).
        schema:
          type: string
      - name: page
        in: query
        required: false
        description: Número da página a recuperar, começando em 1.
        schema:
          type: integer
      - name: size
        in: query
        required: false
        description: Quantidade de registros por página.
        schema:
          type: integer
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /core/v5/customers/{customer_id}/addresses/{address_id}:
    put:
      operationId: pagarme__endereco__atualizar
      summary: Editar endereço
      description: Atualiza os dados complementares de um endereço da carteira do cliente.
      tags:
      - Endereco
      x-confianca: verificado
      x-fonte-url: https://docs.pagar.me/reference/editar-endere%C3%A7o-1
      x-acao-canonica: atualizar
      x-seguro-para-executar: false
      security:
      - basicAuth: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: Identificador do cliente no Pagar.me (prefixo cus_).
        schema:
          type: string
      - name: address_id
        in: path
        required: true
        description: Identificador do endereço no Pagar.me (prefixo addr_).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                line_2:
                  type: string
                  description: 'Segunda linha do endereço: complemento e referências.'
                metadata:
                  type: string
                  description: Pares chave/valor livres, gravados junto ao registro e devolvidos nas consultas e nos webhooks. Bom lugar para
                    o identificador do seu ERP.
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
    delete:
      operationId: pagarme__endereco__excluir
      summary: Excluir endereço
      description: Remove um endereço da carteira do cliente; o registro passa a status deleted.
      tags:
      - Endereco
      x-confianca: verificado
      x-fonte-url: https://docs.pagar.me/reference/excluir-endere%C3%A7o-1
      x-acao-canonica: excluir
      x-seguro-para-executar: false
      security:
      - basicAuth: []
      parameters:
      - name: customer_id
        in: path
        required: true
        description: Identificador do cliente no Pagar.me (prefixo cus_).
        schema:
          type: string
      - name: address_id
        in: path
        required: true
        description: Identificador do endereço no Pagar.me (prefixo addr_).
        schema:
          type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/NaoAutorizado'
        '429':
          $ref: '#/components/responses/LimiteExcedido'
  /core/v5/orders:
    post:
      operationId: pagarme__pedido__criar
      summary: Criar pedido
      description: Rota principal de venda da API v5. Um pedido reúne itens, comprador e um ou mais pagamentos; cada elemento de payments[] vira
        uma cobrança (charge). Suporta cartão de crédito e débito, boleto, Pix, voucher, private label e dinheiro, além de regras de split entre
        recebedores.
      tags:
      - Pedido
      x-confianca: verificado
      x-fonte-url: https://docs.pagar.me/reference/criar-pedido-com-split-1
      x-acao-canonica: criar
      x-seguro-para-executar: false
      security:
      - basicAuth: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        description: Chave de idempotência gerada por você. Requisições repetidas com a mesma chave em até 24 h (5 min no ambiente de teste) devolvem
          a mesma operação, sem duplicar.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Seu identificador do registro (referência externa). Serve para localizar o objeto depois sem guardar o id do Pagar.me.
                items:
                  type: array
                  description: Itens que compõem o registro.
                customer_id:
                  type: string
                  description: Identificador do cliente no Pagar.me (prefixo cus_).
                customer:
