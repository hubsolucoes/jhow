        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Seu identificador do registro (referência externa). Serve para localizar o objeto depois sem guardar o id do Pagar.me.
                register_information:
                  type: object
                  description: Dados cadastrais do recebedor. O conjunto obrigatório muda conforme type seja individual (PF) ou company (PJ).
                default_bank_account:
                  type: object
                  description: Conta bancária padrão para onde vão os pagamentos do recebedor.
                transfer_settings:
                  type: object
                  description: Regras de transferência automática do saldo do recebedor.
                automatic_anticipation_settings:
                  type: object
                  description: Regras de antecipação automática dos recebíveis.
