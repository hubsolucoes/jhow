openapi: 3.1.0
info:
  title: API SAGI (SyGeCom) — recorte de leitura do catálogo
  version: 1.0.0
  summary: Reconstrução do recorte de leitura da API SAGI, do ERP SyGeCom para gestão de resíduos e reciclagem.
  description: Reconstruído a partir da spec oficial em https://api.sagierp.com.br/api/v1/spec (OpenAPI 3.0.1, info.version
    1.0.0, 'API para integracao com sistema SAGI - 18/03/2026'), consultada em 2026-09-17. Este arquivo cobre a autenticação
    e as leituras detalhadas no catálogo; as demais 63 operações estão catalogadas em endpoints.json > endpoints_secundarios.
    As descrições são autorais; nomes de path, parâmetro e campo são fatos técnicos e estão exatos.
  contact:
    name: Sygecom Informatica
    url: https://sygecom.com.br/contato-suporte/
  x-fonte-url: https://api.sagierp.com.br/api/v1/spec
  x-data-consulta: '2026-09-17'
externalDocs:
  description: Passo a passo oficial para liberar o acesso à API
  url: https://sagierp.com.br/doc_api/
servers:
- url: https://api.sagierp.com.br/api/v1
  description: Produção. Em 2026-09-17 https://api.sygecom.com.br/api/v1 servia a mesma aplicação e a mesma spec, byte a byte.
x-sandbox: 'Não há URL base de homologação publicada. A spec oficial instrui a enviar "homol": true no corpo do POST /login
  para gerar um token de homologação e avisa que o token só funciona no ambiente em que foi gerado, sem dizer qual é esse
  ambiente. Registrado em system.json > lacunas.'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT obtido em POST /login.
paths:
  /login:
    post:
      operationId: sygecom__autenticacao__autenticar
      summary: createSessionLogin (Autorização)
      description: 'Troca e-mail e senha de um usuário cadastrado dentro do SAGI/SGR por um token JWT, devolvendo junto os
        dados do usuário, as empresas/filiais a que ele tem acesso e a versão do sistema instalado. É o primeiro passo obrigatório
        de qualquer integração.


        Quando usar: Sempre, antes da primeira chamada, e de novo sempre que uma rota responder 401. Não existe refresh token:
        renovar é repetir este login. Prefira a rota /login à rota /auth porque ela devolve a lista de empresas e a versão
        do ERP, informações úteis para saber o que a integração vai conseguir ler.'
      tags:
      - Autenticacao
      x-confianca: verificado
      x-fonte-url: https://api.sagierp.com.br/api/v1/spec
      x-data-consulta: '2026-09-17'
      x-id-canonico: sygecom.autenticacao.autenticar
      x-entidade-canonica: Autenticacao
      x-acao-canonica: autenticar
      x-seguro-para-executar: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  description: E-mail cadastrado no usuário do ERP (aba E-mail do Cadastro de Usuários).
                password:
                  type: string
                  description: Senha desse usuário no ERP.
                origem:
                  type: string
                  enum:
                  - SAGI
                  - SGR
                  - APP_SYGECOM
                  - SRM
                  - LOGVERDE
                  - API_MTR
                  - DEVOLVA
                  - VIRA_VERDE
                  - REVER
                  - API
                  default: API
                  description: Sistema de origem da chamada. Para integração própria use API.
                app:
                  type: string
                  enum:
                  - SAGI
                  - SGR
                  - APP_SYGECOM
                  - SRM
                  - LOGVERDE
                  - API_MTR
                  - DEVOLVA
                  - VIRA_VERDE
                  - REVER
                  - API
                  default: APP_SYGECOM
                  description: Aplicação que está autenticando; mesmo conjunto de valores de origem.
                homol:
                  type: boolean
                  default: false
                  description: Quando true, gera token do ambiente de homologação. A documentação avisa que o token só funciona
                    no ambiente em que foi gerado, mas não publica a URL base de homologação.
            example:
              email: integracao@example.com
              password: <<SENHA>>
              origem: API
      responses:
        '200':
          description: Sucesso. Estrutura resumida em x-schema-resumido.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                user:
                - idempresa: '1'
                  iduser: '1'
                  usuario: INTEGRACAO
                  email: integracao@example.com
                  empresa: TODAS
                  bloqueia: N
                  bloq_portal_cli: false
                  empresas:
                  - cnpj: 00000000000191
                    sistema: AD
                    nome_empresa: EMPRESA EXEMPLO LTDA
                    nome_filial: MATRIZ
                    versao: 9.4.0.000
                token: <<SEU_TOKEN_JWT>>
        '400':
          description: should have required property 'email' — Corpo sem email ou sem password.
        '401':
          description: Usuário não encontrado / User not found — E-mail não cadastrado, senha errada, ou usuário do ERP com
            a opção 'Bloquear Acesso ao SAGI Mobile' marcada.
        '403':
          description: Acesso bloqueado por pendência financeira — A data_limite do contrato do cliente com a Sygecom está
            vencida; o bloqueio é aplicado no login.
      x-schema-resumido:
        user:
        - idempresa: string
          iduser: string
          usuario: string
          email: string
          empresa: string
          bloqueia: string
          bloq_portal_cli: boolean
          empresas:
          - cnpj: string
            sistema: string
            nome_empresa: string
            nome_filial: string
            versao: string
        token: string (JWT)
      security: []
  /auth:
    post:
      operationId: sygecom__autenticacao__autenticar__app
      summary: createSession (Autorização)
      description: 'Rota alternativa de autenticação, usada pelo aplicativo móvel. Aceita e-mail e senha e devolve o usuário
        com uma chave e o token JWT, sem a lista de empresas que a rota /login traz.


        Quando usar: Quando você precisa reproduzir o comportamento do App Sygecom ou quando /login não estiver disponível.
        Para integração de dados, prefira /login, que devolve mais contexto (empresas e versão do ERP).'
      tags:
      - Autenticacao
      x-confianca: verificado
      x-fonte-url: https://api.sagierp.com.br/api/v1/spec
      x-data-consulta: '2026-09-17'
      x-id-canonico: sygecom.autenticacao.autenticar.app
      x-entidade-canonica: Autenticacao
      x-acao-canonica: autenticar
      x-seguro-para-executar: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  description: E-mail do usuário do ERP.
                password:
                  type: string
                  description: Senha do usuário do ERP.
                app:
                  type: string
                  default: APP_SYGECOM
                  description: Aplicação de origem.
                homol:
                  type: boolean
                  default: false
                  description: Quando true, gera token de homologação.
            example:
              email: integracao@example.com
              password: <<SENHA>>
      responses:
        '200':
          description: Sucesso. Estrutura resumida em x-schema-resumido.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                user:
                - idempresa: 1
                  iduser: 1
                  usuario: INTEGRACAO
                  email: integracao@example.com
                  chave: <<CHAVE_DO_USUARIO>>
                  empresa: TODAS
                  bloqueia: N
                  bloq_portal_cli: false
                  token: <<SEU_TOKEN_JWT>>
        '400':
          description: should have required property 'email' — Corpo incompleto.
        '401':
          description: User not found — Usuário inexistente ou senha incorreta.
      x-schema-resumido:
        user:
        - idempresa: integer
          iduser: integer
          usuario: string
          email: string
          chave: string
          empresa: string
          bloqueia: string
          bloq_portal_cli: boolean
          token: string (JWT)
      security: []
  /filiais:
    get:
      operationId: sygecom__empresa__listar
      summary: listarFiliais (Filiais)
      description: 'Lista as filiais que o usuário autenticado tem permissão de acessar, com id, CNPJ, nome, código da filial
        e status, em resposta paginada com total de registros e de páginas.


        Quando usar: Logo depois do login, para descobrir o universo real que aquele token enxerga antes de disparar qualquer
        extração. É também a melhor rota para validar que a credencial funciona, porque é barata, paginada e tem contrato
        de resposta bem definido.'
      tags:
      - Empresa
      x-confianca: verificado
      x-fonte-url: https://api.sagierp.com.br/api/v1/spec
      x-data-consulta: '2026-09-17'
      x-id-canonico: sygecom.empresa.listar
      x-entidade-canonica: Empresa
      x-acao-canonica: listar
      x-seguro-para-executar: true
      parameters:
      - name: page
        in: query
        required: false
        description: Página, base 1.
        schema:
          type: integer
          default: 1
          minimum: 1
      - name: pageSize
        in: query
        required: false
        description: Registros por página.
        schema:
          type: integer
          default: 50
          minimum: 1
          maximum: 500
      - name: filial
        in: query
        required: false
        description: 'Código da filial (ex.: MATRIZ, FILIAL1).'
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: 'Status da filial (ex.: ATIVO, INATIVO).'
        schema:
          type: string
      - name: cnpj
        in: query
        required: false
        description: CNPJ com 14 dígitos, sem máscara.
        schema:
          type: string
          pattern: ^[0-9]{14}$
      - name: nome
        in: query
        required: false
        description: Nome da filial; busca parcial, sem diferenciar maiúsculas.
        schema:
          type: string
      - name: id
        in: query
        required: false
        description: ID da filial.
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Sucesso. Estrutura resumida em x-schema-resumido.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                data:
                - id: 1
                  cnpj: 00000000000191
                  nome: EMPRESA EXEMPLO LTDA
                  filial: MATRIZ
                  status: ATIVO
                paginaAtual: 1
                totalPaginas: 1
                totalRegistros: 1
        '400':
          description: PageSize não pode exceder 500 / CNPJ deve ter 14 dígitos — pageSize acima de 500, page menor que 1
            ou CNPJ com máscara.
        '401':
          description: Token not provided / Usuário não autenticado — Header Authorization ausente, sem o prefixo 'Bearer
            ' ou com token expirado.
        '408':
          description: Timeout ao buscar filiais. A consulta demorou mais de 10 segundos. — Base grande combinada com filtro
            pouco seletivo.
        '500':
          description: Erro interno ao processar a requisição — Falha do lado do servidor.
      x-schema-resumido:
        data:
        - id: integer
          cnpj: string
          nome: string
          filial: string
          status: string
        paginaAtual: integer
        totalPaginas: integer
        totalRegistros: integer
      security:
      - BearerAuth: []
  /movimentos:
    get:
      operationId: sygecom__estoque__listar__movimentos
      summary: buscarMovimentos (Movimentações)
      description: 'Lista as movimentações de material por período e tipo (entrada, saída ou serviço): é o boleto de balança
        do ERP, com peso bruto, tara, peso líquido, impureza, desconto, preço unitário, valor total, produto, categoria, fornecedor
        ou cliente, placa, motorista, classificador, filial, nota fiscal e impostos.


        Quando usar: É o endpoint central para análise deste ERP. Use para margem por material, volume comprado e vendido
        por período, produtividade por comprador, conferência de pesagem e conciliação com o financeiro. Para o recorte por
        fornecedor específico, /cargas/fornecedores é mais direto, mas traz muito menos campos.'
      tags:
      - Estoque
      x-confianca: verificado
      x-fonte-url: https://api.sagierp.com.br/api/v1/spec
      x-data-consulta: '2026-09-17'
      x-id-canonico: sygecom.estoque.listar.movimentos
      x-entidade-canonica: Estoque
      x-acao-canonica: listar
      x-seguro-para-executar: true
      parameters:
      - name: datainicial
        in: query
        required: true
        description: Início do período.
        schema:
          type: string
          format: date
          default: '1800-01-01'
      - name: datafinal
        in: query
        required: true
        description: Fim do período.
        schema:
          type: string
          format: date
          default: '2500-12-31'
      - name: tipo
        in: query
        required: true
        description: Tipo de movimento.
        schema:
          type: string
          enum:
          - ENTRADA
          - SAIDA
          - SERVICO
          default: ENTRADA
      - name: numbol
        in: query
        required: false
        description: Número do boleto de balança; 0 traz todos.
        schema:
          type: integer
          default: 0
      - name: codforcli
        in: query
        required: false
        description: Código do fornecedor (entrada) ou do cliente (saída); 0 traz todos.
        schema:
          type: integer
          default: 0
      - name: ordem
        in: query
        required: false
        description: Número da ordem de coleta/embarque; 0 traz todas.
        schema:
          type: integer
          default: 0
      - name: limit
        in: query
        required: true
        description: Quantidade de registros por página.
        schema:
          type: integer
          default: 100
      - name: offset
        in: query
        required: true
        description: 'Registro inicial. Atenção: base 1 — offset=1 com limit=10 devolve os 10 primeiros.'
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: Sucesso. Estrutura resumida em x-schema-resumido.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
              example:
              - data: '2026-08-14'
                boleto: 366
                nota_fiscal: 106233-1
                codigo: 430
                nome: FORNECEDOR EXEMPLO LTDA
                cnpj_cpf: 00000000000191
                des_cat_for: SUCATEIRO
                comp_vend: NOME DO COMPRADOR
                placa: AAA1A11
                codpro: '02'
                subcod: S
                produto: APARA BRANCA
                unidade: TN
                des_cat_pro: PAPEL
                peso_bruto: 4810
                peso_tara: 3630
                peso_liquido: 1180
                desconto: 0
                preco: 430
                valor_total: 507.4
                filial: FILIAL1
                movimento: ENTRADA
                origem: BOLETO
                hora_peso: '10:32:06'
                estado: SP
        '400':
          description: 'should match format ''date'' — Data enviada fora do formato AAAA-MM-DD (ex.: 17/09/2026 ou 2026/09/17).'
        '204':
          description: 'No Content — O filtro não retornou registros. Não é erro: esta API usa 204 no lugar de lista vazia.'
        '401':
          description: Token not provided / Usuário não autenticado — Header Authorization ausente, sem o prefixo 'Bearer
            ' ou com token expirado.
        '503':
          description: Falha no servidor do cliente — O banco/serviço da instalação do cliente não respondeu.
      x-schema-resumido:
        '[]':
          data: date
          boleto: integer
          nota_fiscal: string
          codigo: integer
          nome: string
          cnpj_cpf: string
          des_cat_for: string
          comp_vend: string
          placa: string
          codpro: string
          subcod: string
          produto: string
          unidade: string
          des_cat_pro: string
          peso_bruto: number
          peso_tara: number
          peso_liquido: number
          desconto: number
          preco: number
          valor_total: number
          impureza: string
          frete_por_conta: string
          classificador: string
          transportadora: string
          filial: string
          movimento: string
          origem: string
          valor_icms: number
          motorista: string
          hora_peso: string
          estado: string
          usuario: string
          val_frete: number
          val_despesa: number
          volumes: integer
          pedido: integer
          tipo_boleto: string
          prest_servico: boolean
      security:
      - BearerAuth: []
  /produtos:
    get:
      operationId: sygecom__produto__listar
      summary: buscarProdutos (Produtos)
      description: 'Lista os produtos com o saldo de estoque na data e hora informadas, trazendo código, subcódigo, descrição,
        unidade, categoria, status, quantidade em estoque, quantidade reservada, previsão de chegada, custo médio, valor total
        e a tabela de preços de compra/venda e serviço.


        Quando usar: Para foto de estoque por filial, custo médio por material e conferência de inventário, e como tabela
        de apoio para dar nome e categoria aos códigos que aparecem em /movimentos.'
      tags:
      - Produto
      x-confianca: verificado
      x-fonte-url: https://api.sagierp.com.br/api/v1/spec
      x-data-consulta: '2026-09-17'
      x-id-canonico: sygecom.produto.listar
      x-entidade-canonica: Produto
      x-acao-canonica: listar
      x-seguro-para-executar: true
      parameters:
      - name: codpro
        in: query
        required: false
        description: Código do produto; vazio traz todos.
        schema:
          type: string
      - name: subcod
        in: query
        required: false
        description: Subcódigo do produto (variação/qualidade do material).
        schema:
          type: string
      - name: data
        in: query
        required: false
        description: Data de referência do saldo.
        schema:
          type: string
          format: date
      - name: hora
        in: query
        required: false
        description: Hora de referência do saldo (HH:MM:SS).
        schema:
          type: string
      - name: filial
        in: query
        required: false
        description: Filial ou TODAS.
        schema:
          type: string
          default: TODAS
      - name: ecommerce
        in: query
        required: false
        description: Restringe a produtos marcados para e-commerce.
        schema:
          type: boolean
          enum:
          - true
          - false
          default: true
      - name: unidade_negocio
        in: query
        required: false
        description: Unidade de negócio; 0 traz todas.
        schema:
          type: integer
          default: 0
          maximum: 9999
      responses:
        '200':
          description: Sucesso. Estrutura resumida em x-schema-resumido.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
              example:
              - codpro: '50'
                subcod: F
                produto: RAFIA
                un: TN
                categoria: PLASTICO
                status: ATIVO
                estoque: 228405
                reservado: 0
                medioc: 0.000537602
                totalc: 0.12
                tabela:
                - - tabela: T
                    preco_buscar: 0
                    preco_trazer: 0
                    preco_serv1: 0
                    preco_serv2: 0
        '204':
          description: 'No Content — O filtro não retornou registros. Não é erro: esta API usa 204 no lugar de lista vazia.'
        '401':
          description: Token not provided / Usuário não autenticado — Header Authorization ausente, sem o prefixo 'Bearer
            ' ou com token expirado.
        '503':
          description: Falha no servidor do cliente — O banco/serviço da instalação do cliente não respondeu.
      x-schema-resumido:
        '[]':
          codpro: string
          subcod: string
          produto: string
          un: string
          categoria: string
          status: string
          estoque: number
          reservado: number
          qtd_achegar: number
          previsao_chegada: number
          medioc: number
          mediov: number
          totalc: number
          totalv: number
          peso_produto: number
          nota_fiscal: string
          data: string
          hora: string
          tabela: array
      security:
      - BearerAuth: []
  /fornecedores:
    get:
      operationId: sygecom__fornecedor__listar
      summary: buscarFornecedores (Fornecedores)
      description: 'Lista os fornecedores cadastrados, com código interno, razão social, nome fantasia, CNPJ ou CPF, inscrição
        estadual, endereço completo, município IBGE, contatos, categoria, região, condição de pagamento, status, limite de
        crédito, CNAE, coordenadas e cadastro FEPAM com vencimento.


        Quando usar: Para montar a dimensão de fornecedores do painel, cruzar com /movimentos e /pagamentos/fornecedores,
        checar vencimento de licença ambiental (FEPAM) e enriquecer análise por região ou categoria de sucateiro.'
      tags:
      - Fornecedor
      x-confianca: verificado
      x-fonte-url: https://api.sagierp.com.br/api/v1/spec
      x-data-consulta: '2026-09-17'
      x-id-canonico: sygecom.fornecedor.listar
      x-entidade-canonica: Fornecedor
      x-acao-canonica: listar
      x-seguro-para-executar: true
      parameters:
      - name: cnpj
        in: query
        required: false
        description: CNPJ para filtrar.
        schema:
          type: string
      - name: cpf
        in: query
        required: false
        description: CPF para filtrar.
        schema:
          type: string
      - name: nome
        in: query
        required: false
        description: Nome ou parte do nome.
        schema:
          type: string
      - name: status
        in: query
        required: false
        description: Situação do cadastro.
        schema:
          type: string
          enum:
          - ATIVO
          - INATIVO
          default: ATIVO
      - name: limit
        in: query
        required: false
        description: Tamanho da página.
        schema:
          type: integer
      - name: page
        in: query
        required: false
        description: Número da página.
        schema:
          type: integer
          default: 1
      responses:
        '200':
          description: Sucesso. Estrutura resumida em x-schema-resumido.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
              example:
              - codfor: 1
                fornecedor: FORNECEDOR EXEMPLO LTDA
                fanta: EXEMPLO
                cgc: 00000000000191
                cpf: ''
                iest: '0000000000'
                tip: J
                ende: RUA EXEMPLO
                numende: '1420'
                bairro: CENTRO
                cidade: BELO HORIZONTE
                uf: MG
                cep: '31130380'
                numcid: 3106200
                email: contato@example.com
                categoria: GRAFICA
                regiao: 1
                condicao: A-AVISTA
                status: ATIVO
                limite: 0
                cnae: '1811302'
                fepam: ''
                vctofepam: null
        '204':
          description: 'No Content — O filtro não retornou registros. Não é erro: esta API usa 204 no lugar de lista vazia.'
