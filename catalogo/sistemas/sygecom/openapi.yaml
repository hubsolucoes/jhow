  /sql-query:
    post:
      operationId: sygecom__tabela_auxiliar__listar__sql
      summary: Execução segura de consultas SQL (Consultas SQL)
      description: 'Executa uma consulta SQL do tipo SELECT no banco de dados do tenant do usuário autenticado, com paginação
        por page e pageSize, teto de 1000 registros retornados e timeout de 5 segundos. A documentação declara bloqueio automático
        de comandos de escrita (DELETE, UPDATE, INSERT, CREATE, DROP, ALTER e afins) e sanitização contra SQL injection.


        Quando usar: Quando a informação pedida não tem endpoint dedicado, ou quando um agregado (soma por material, ranking
        de fornecedor, saldo consolidado) resolveria em uma chamada o que os endpoints REST resolveriam em centenas. É o endpoint
        mais poderoso da API e também o que exige mais cuidado: use sempre SELECT com filtro de período, coluna explícita
        e LIMIT.'
      tags:
      - TabelaAuxiliar
      x-confianca: verificado
      x-fonte-url: https://api.sagierp.com.br/api/v1/spec
      x-data-consulta: '2026-09-17'
      x-id-canonico: sygecom.tabela_auxiliar.listar.sql
      x-entidade-canonica: TabelaAuxiliar
      x-acao-canonica: listar
      x-seguro-para-executar: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - query
              properties:
                query:
                  type: string
                  description: Comando SELECT a executar. Somente SELECT é aceito; qualquer outro comando é recusado com 400.
                page:
                  type: integer
                  default: 1
                  description: Página do resultado, base 1.
                pageSize:
                  type: integer
                  default: 50
                  description: Registros por página.
            example:
              query: SELECT filial, produto, SUM(peso_liquido) AS peso FROM <<TABELA_DE_MOVIMENTO>> WHERE data BETWEEN '2026-08-01'
                AND '2026-08-31' GROUP BY filial, produto ORDER BY peso DESC
              page: 1
              pageSize: 100
      responses:
        '200':
          description: Sucesso. Estrutura resumida em x-schema-resumido.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
              example:
                data:
                - filial: MATRIZ
                  produto: APARA BRANCA
                  peso: 128.4
                page: 1
                pageSize: 100
                recordsReturned: 1
        '400':
          description: Operação não permitida. Apenas SELECT é permitido. — A consulta contém comando de escrita ou DDL.
        '401':
          description: Token not provided / Usuário não autenticado — Header Authorization ausente, sem o prefixo 'Bearer
            ' ou com token expirado.
        '408':
          description: Timeout de execução. Query demorou mais de 5 segundos. — Consulta sem filtro seletivo, sem índice ou
            com junção pesada.
        '500':
          description: 'Erro ao executar query: relation "..." does not exist — Nome de tabela ou coluna incorreto para o
            esquema daquele tenant.'
      x-schema-resumido:
        data:
        - <coluna>: <valor>
        page: integer
        pageSize: integer
        recordsReturned: integer
      security:
      - BearerAuth: []
