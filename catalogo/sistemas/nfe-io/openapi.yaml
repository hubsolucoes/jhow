      x-entidade-canonica: Webhook
      x-acao-canonica: listar
      x-host: https://api.nfse.io
      x-seguro-para-executar: true
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                webHooks:
                - id: 5f2c1a7e9b3d4c0001aa77bd
                  uri: https://meu-sistema.example.com/webhooks/nfeio
                  contentType: json
                  insecureSsl: false
                  status: Active
                  filters:
                  - service_invoice.issued_successfully
                  - product_invoice.issued_error
                  createdOn: '2026-05-02T13:00:00Z'
        '401':
          description: (corpo vazio)
        '403':
          description: Proibido
        '500':
          description: Erro no processamento
    post:
      operationId: nfe-io__webhook__assinar_webhook
      summary: Criar um Webhook
      description: 'Cadastra uma URL para receber os eventos da plataforma, com filtros por tipo de evento, secret para a assinatura HMAC e cabeçalhos fixos opcionais.


        Quando usar: No lugar de polling. Como emissão, cancelamento e captura fiscal são assíncronos, o webhook é o caminho recomendado pelo fornecedor para saber o desfecho sem ficar consultando.'
      tags:
      - Webhook
      security:
      - ApiKeyAuth: []
      x-confianca: verificado
      x-fonte-url: https://nfe.io/docs/documentacao/webhooks/integracao/
      x-entidade-canonica: Webhook
      x-acao-canonica: assinar_webhook
      x-host: https://api.nfse.io
      x-seguro-para-executar: false
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                webHook:
                  id: 5f2c1a7e9b3d4c0001aa77bd
                  uri: https://meu-sistema.example.com/webhooks/nfeio
                  status: Active
                  filters:
                  - service_invoice.issued_successfully
        '400':
          description: Algum parâmetro informado não é válido
        '401':
          description: (corpo vazio)
        '403':
          description: Proibido
        '500':
          description: Erro no processamento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                webHook.uri:
                  type: string
                  description: 'URL que receberá os POSTs. É validada no cadastro: precisa responder 200 a uma requisição de teste.'
                webHook.filters:
                  type: array
                  description: Lista de tipos de evento assinados, obtida em GET /v2/webhooks/eventtypes.
                webHook.secret:
                  type: string
                  description: Segredo de 32 a 64 caracteres usado no HMAC-SHA1 enviado em X-Hub-Signature.
                webHook.contentType:
                  type: string
                  description: Formato do corpo.
                webHook.insecureSsl:
                  type: boolean
                  description: Aceitar certificado TLS inválido no destino.
                webHook.headers:
                  type: object
                  description: Cabeçalhos fixos que a NFE.io envia ao seu endpoint, por exemplo um Authorization do seu lado.
            example:
              webHook:
                uri: https://meu-sistema.example.com/webhooks/nfeio
                contentType: json
                insecureSsl: false
                secret: <<SEGREDO_HMAC_32_A_64_CARACTERES>>
                filters:
                - service_invoice.issued_successfully
                - service_invoice.issued_error
                - service_invoice.issued_failed
                - product_invoice.issued_successfully
                headers:
                  Authorization: <<TOKEN_DO_SEU_ENDPOINT>>
