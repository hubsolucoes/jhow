      description: 'Devolve o detalhe de um documento capturado. O mesmo endpoint aceita tanto o id interno quanto a chave de acesso de 50 dígitos — o servidor detecta qual foi enviado.


        Quando usar: Depois do webhook de NFS-e recebida, ou ao investigar uma nota de prestador específica. Também é o ponto de partida para baixar XML, PDF ou o JSON convertido.'
      tags:
      - NotaFiscal
      security:
      - ApiKeyAuth: []
      x-confianca: verificado
      x-fonte-url: https://nfe.io/docs/distribuicao-nfse-inbound-integracao-rest/
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: obter
      x-host: https://api.nfse.io
      x-seguro-para-executar: true
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                id: 66b2c3d4e5f6a7890bcdef12
                nsu: 1850
                type: serviceInvoice
                accessKey: <chave de 50 digitos>
                issuedOn: '2026-08-20T21:15:48Z'
                accrualOn: 2026-08
                provider:
                  federalTaxNumber: 00000000000191
                  name: PRESTADOR EXEMPLO LTDA
                  cityCode: '3106200'
                  state: MG
                servicesAmount: 1200.0
                serviceCode: '100501.004'
                status: Processed
                webhookStatus: Delivered
                hasPdf: true
                xmlSizeBytes: 9718
        '400':
          description: Requisição inválida
        '401':
          description: (corpo vazio)
        '403':
          description: Proibido
        '429':
          description: Too Many Requests
        '503':
          description: Serviço indisponível
        '404':
          description: Não encontrado
        '500':
          description: Erro no processamento
      parameters:
      - name: companyId
        in: path
        required: true
        description: Identificador da empresa na NFE.io.
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: Id interno do documento (ObjectId) OU a chave de acesso de 50 dígitos.
        schema:
          type: string
