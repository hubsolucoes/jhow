    get:
      operationId: nfe-io__webhook__listar
      summary: Listar os Webhooks
      description: 'Lista os webhooks cadastrados na conta, com a URL de destino, os filtros de evento assinados, o tipo de conteúdo e o status.


        Quando usar: Auditoria de integração: descobrir para onde a conta está mandando evento, se alguém cadastrou uma URL de teste esquecida e quais eventos estão realmente assinados.'
      tags:
      - Webhook
