openapi: 3.1.0
info:
  title: NFE.io — API reconstruída para o catálogo
  version: '2026-09-17'
  description: 'Reconstrução das operações da NFE.io documentadas no catálogo, a partir das especificações OpenAPI oficiais publicadas em https://nfe.io/docs/api/ e da documentação do portal. ATENÇÃO: a NFE.io usa mais de um host. Este documento tem como servidor padrão https://api.nfse.io (NF-e, NFC-e, empresas, certificados, webhooks e distribuição); as operações de NFS-e e as consultas cadastrais declaram o host correto em ''servers'' dentro da própria operação e em x-host. Não existe host de sandbox: o ambiente é atributo da Inscrição Municipal (NFS-e) ou Estadual (NF-e/NFC-e).'
  contact:
    url: https://nfe.io/docs/
servers:
- url: https://api.nfse.io
  description: Produção — NF-e, NFC-e, empresas, webhooks e distribuição
- url: https://api.nfe.io
  description: Produção — NFS-e (mesmo host serve o ambiente de testes; o ambiente vem da Inscrição Municipal)
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Chave de API estática, sem prefixo Bearer. Use a Chave de Nota Fiscal em api.nfe.io e api.nfse.io e a Chave de Dados nos subdomínios de consulta.
security:
- ApiKeyAuth: []
tags:
- name: NotaFiscal
  description: NFS-e, NF-e, NFC-e e documentos fiscais recebidos
- name: Empresa
  description: Empresas emissoras, certificados, inscrições e captura fiscal
- name: Webhook
  description: Assinaturas de eventos
- name: Pessoa
  description: Consultas cadastrais de CNPJ e CPF
- name: Endereco
  description: Consulta de endereço e CEP
- name: TabelaAuxiliar
  description: Listas de domínio da plataforma
paths:
  /v1/companies/{company_id}/serviceinvoices:
    get:
      operationId: nfe-io__nota_fiscal__listar__nfse
      summary: Listar as Notas Fiscais de Serviço (NFSE)
      description: 'Devolve a coleção paginada de NFS-e da empresa, com o documento inteiro em cada item (prestador, tomador, valores, impostos retidos e status de fluxo). É a rota que alimenta relatório de faturamento de serviço e conciliação com o sistema de vendas.


        Quando usar: Use quando o cliente pedir ''as notas de serviço do mês'', um relatório de ISS retido, ou a conferência entre pedidos e notas emitidas. Para uma nota específica já conhecida, prefira obter por id ou por externalId — é mais barato que varrer a listagem.'
      tags:
      - NotaFiscal
      security:
      - ApiKeyAuth: []
      x-confianca: verificado
      x-fonte-url: https://nfe.io/docs/api/nf-servico-v1.yaml
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: listar
      x-host: https://api.nfe.io
      x-seguro-para-executar: true
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                serviceInvoices:
                - id: 6a6898a87864720001efa2dc
                  number: 1042
                  status: Issued
                  flowStatus: Issued
                  environment: Production
                  issuedOn: '2026-08-14T10:12:00Z'
                  cityServiceCode: '0107'
                  description: Licenca de uso de software - agosto/2026
                  servicesAmount: 4500.0
                  issTaxAmount: 90.0
                  issRate: 2.0
                  externalId: PED-2026-8891
                  checkCode: A1B2C3D4
                  borrower:
                    name: CLIENTE EXEMPLO LTDA
                    federalTaxNumber: 00000000000191
                    email: financeiro@example.com
                totalResults: 137
                totalPages: 3
                page: 1
        '401':
          description: (corpo vazio)
        '400':
          description: Algum parâmetro informado não é válido
        '500':
          description: Erro no processamento
      servers:
      - url: https://api.nfe.io
      parameters:
      - name: company_id
        in: path
        required: true
        description: Identificador da empresa emissora na NFE.io (obtido em GET /v2/companies em api.nfse.io ou no painel).
        schema:
          type: string
      - name: pageCount
        in: query
        required: false
        description: Quantidade de itens por página.
        schema:
          type: integer
      - name: pageIndex
        in: query
        required: false
        description: Número da página, começando em 1.
        schema:
          type: integer
      - name: issuedBegin
        in: query
        required: false
        description: Início do intervalo de data de competência (emissão).
        schema:
          type: string
          format: date
      - name: issuedEnd
        in: query
        required: false
        description: Fim do intervalo de data de competência (emissão).
        schema:
          type: string
          format: date
      - name: createdBegin
        in: query
        required: false
        description: Início do intervalo de data de criação do registro na NFE.io.
        schema:
          type: string
          format: date
      - name: createdEnd
        in: query
        required: false
        description: Fim do intervalo de data de criação do registro na NFE.io.
        schema:
          type: string
          format: date
      - name: hasTotals
        in: query
        required: false
        description: Quando verdadeiro, a resposta traz os totais de resultados e de páginas.
        schema:
          type: boolean
    post:
      operationId: nfe-io__nota_fiscal__emitir__nfse
      summary: Emitir uma Nota Fiscal de Serviço (NFSE)
      description: 'Enfileira a emissão de uma NFS-e para a prefeitura do município da Inscrição Municipal da empresa. Responde 202 com o documento em estado inicial; a autorização chega depois, por consulta ou webhook.


        Quando usar: Quando o cliente fatura um serviço e precisa da nota. Só três campos são obrigatórios (cityServiceCode, description, servicesAmount), porque por padrão a NFE.io calcula os impostos a partir do código de serviço municipal — se você preencher issRate/issTaxAmount manualmente, assume o cálculo.'
      tags:
      - NotaFiscal
      security:
      - ApiKeyAuth: []
      x-confianca: verificado
      x-fonte-url: https://nfe.io/docs/api/nf-servico-v1.yaml
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: emitir
      x-host: https://api.nfe.io
      x-seguro-para-executar: false
      responses:
        '202':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                id: 6a6898a87864720001efa2dc
                environment: Production
                status: Created
                flowStatus: WaitingCalculateTaxes
                externalId: PED-2026-8891
                cityServiceCode: '0107'
                servicesAmount: 4500.0
        '400':
          description: Algum parâmetro informado não é válido
        '401':
          description: (corpo vazio)
        '408':
          description: Tempo de resposta do servidor excedeu o limite (60s)
        '500':
          description: Erro no processamento
      servers:
      - url: https://api.nfe.io
      parameters:
      - name: company_id
        in: path
        required: true
        description: Identificador da empresa emissora na NFE.io (obtido em GET /v2/companies em api.nfse.io ou no painel).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cityServiceCode:
                  type: string
                  description: Código de serviço do município (lista da prefeitura). É por ele que a NFE.io calcula o ISS automaticamente.
                description:
                  type: string
                  description: Descrição do serviço prestado que sai no corpo da nota.
                servicesAmount:
                  type: number
                  description: Valor total dos serviços.
                borrower:
                  type: object
                  description: 'Tomador do serviço: type (LegalEntity ou NaturalPerson), name, federalTaxNumber, email e address com city.code do IBGE.'
                externalId:
                  type: string
                  description: Identificador do documento no seu sistema; habilita a busca por /serviceinvoices/external/{id}.
                federalServiceCode:
                  type: string
                  description: Item da lista nacional (LC 116).
                cnaeCode:
                  type: string
                  description: CNAE da atividade, exigido por alguns municípios.
                taxationType:
                  type: string
                  description: Natureza da tributação do ISS.
                  enum:
                  - None
                  - WithinCity
                  - OutsideCity
                  - Export
                  - Free
                  - Immune
                  - SuspendedCourtDecision
                  - SuspendedAdministrativeProcedure
                  - OutsideCityFree
                  - OutsideCityImmune
                  - OutsideCitySuspended
                  - OutsideCitySuspendedAdministrativeProcedure
                  - ObjectiveImune
                issRate:
                  type: number
                  description: Alíquota de ISS. Informar desliga o cálculo automático.
                issAmountWithheld:
                  type: number
                  description: ISS retido pelo tomador.
                retentionType:
                  type: string
                  description: Quem retém o ISS.
                  enum:
                  - NotWithheld
                  - WithheldByBuyer
                  - WithheldByIntermediary
                issuedOn:
                  type: string
                  description: Data de competência.
                rpsNumber:
                  type: integer
                  description: Número do RPS, quando você controla a numeração.
                additionalInformation:
                  type: string
                  description: Observações que saem na nota.
                ibsCbs:
                  type: object
                  description: Grupo da Reforma Tributária (IBS/CBS) para municípios no Ambiente Nacional.
            example:
              borrower:
                type: LegalEntity
                name: CLIENTE EXEMPLO LTDA
                federalTaxNumber: 00000000000191
                email: financeiro@example.com
                address:
                  country: BRA
                  postalCode: '01310100'
                  street: Avenida Paulista
                  number: '1000'
                  district: Bela Vista
                  state: SP
                  city:
                    code: '3550308'
                    name: Sao Paulo
              cityServiceCode: '0107'
              description: Licenca de uso de software - agosto/2026
              servicesAmount: 4500.0
              externalId: PED-2026-8891
              taxationType: WithinCity
  /v1/companies/{company_id}/serviceinvoices/{id}:
    get:
      operationId: nfe-io__nota_fiscal__obter__nfse
      summary: Obter os detalhes de uma Nota Fiscal de Serviço (NFSE)
      description: 'Retorna o documento completo de uma NFS-e pelo id gerado pela NFE.io na emissão, incluindo o estágio atual do fluxo e a mensagem de erro quando a prefeitura rejeitou.


        Quando usar: É o endpoint de polling depois de uma emissão: o POST responde 202 e só diz que entrou na fila; quem confirma a autorização é esta consulta (ou o webhook). Use também para conferir o motivo de uma falha, em flowMessage.'
      tags:
      - NotaFiscal
      security:
      - ApiKeyAuth: []
      x-confianca: verificado
      x-fonte-url: https://nfe.io/docs/api/nf-servico-v1.yaml
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: obter
      x-host: https://api.nfe.io
      x-seguro-para-executar: true
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                id: 6a6898a87864720001efa2dc
                environment: Production
                status: Issued
                flowStatus: Issued
                flowMessage: null
                number: 1042
                checkCode: A1B2C3D4
                rpsNumber: 1042
                rpsSerialNumber: IO
                issuedOn: '2026-08-14T10:12:00Z'
                cityServiceCode: '0107'
                servicesAmount: 4500.0
                issRate: 2.0
                issTaxAmount: 90.0
                amountNet: 4410.0
                externalId: PED-2026-8891
                borrower:
                  name: CLIENTE EXEMPLO LTDA
                  federalTaxNumber: 00000000000191
        '401':
          description: (corpo vazio)
        '400':
          description: Algum parâmetro informado não é válido
        '500':
          description: Erro no processamento
      servers:
      - url: https://api.nfe.io
      parameters:
      - name: company_id
        in: path
        required: true
        description: Identificador da empresa emissora na NFE.io (obtido em GET /v2/companies em api.nfse.io ou no painel).
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: Identificador da NFS-e devolvido pela NFE.io no 202 da emissão.
        schema:
          type: string
    delete:
      operationId: nfe-io__nota_fiscal__cancelar__nfse
      summary: Cancelar uma Nota Fiscal de Serviços (NFSE)
      description: 'Solicita à prefeitura o cancelamento de uma NFS-e já autorizada. Assim como a emissão, é assíncrono: o resultado aparece em flowStatus (Cancelled ou CancelFailed).


        Quando usar: Quando a nota saiu errada e o município ainda aceita cancelamento. O prazo e as regras são da prefeitura, não da NFE.io — vários municípios só permitem no mesmo mês de competência.'
      tags:
      - NotaFiscal
      security:
      - ApiKeyAuth: []
      x-confianca: verificado
      x-fonte-url: https://nfe.io/docs/api/nf-servico-v1.yaml
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: cancelar
      x-host: https://api.nfe.io
      x-seguro-para-executar: false
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                id: 6a6898a87864720001efa2dc
                status: Issued
                flowStatus: WaitingSendCancel
                cancelledOn: null
        '400':
          description: Algum parâmetro informado não é válido
        '401':
          description: (corpo vazio)
        '408':
          description: Tempo de resposta do servidor excedeu o limite (60s)
        '500':
          description: Erro no processamento
      servers:
      - url: https://api.nfe.io
      parameters:
      - name: company_id
        in: path
        required: true
        description: Identificador da empresa emissora na NFE.io (obtido em GET /v2/companies em api.nfse.io ou no painel).
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: Identificador da NFS-e na NFE.io.
        schema:
          type: string
  /v1/companies/{company_id}/serviceinvoices/external/{id}:
    get:
      operationId: nfe-io__nota_fiscal__obter__nfse_externo
      summary: Obter os detalhes de uma NFS-e pelo ID externo (externalId)
      description: 'Busca a NFS-e pelo identificador que o seu sistema enviou no campo externalId da emissão, sem precisar guardar o id gerado pela NFE.io.


        Quando usar: Use na conciliação: você tem o número do pedido, do contrato ou da fatura no seu ERP e quer saber se existe nota para ele. Também serve como rede de proteção quando a resposta 202 da emissão se perdeu (timeout, deploy no meio).'
      tags:
      - NotaFiscal
      security:
      - ApiKeyAuth: []
      x-confianca: verificado
      x-fonte-url: https://nfe.io/docs/api/nf-servico-v1.yaml
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: obter
      x-host: https://api.nfe.io
      x-seguro-para-executar: true
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                id: 6a6898a87864720001efa2dc
                status: Issued
                flowStatus: Issued
                number: 1042
                externalId: PED-2026-8891
                servicesAmount: 4500.0
                borrower:
                  name: CLIENTE EXEMPLO LTDA
                  federalTaxNumber: 00000000000191
        '401':
          description: (corpo vazio)
        '400':
          description: Algum parâmetro informado não é válido
        '500':
          description: Erro no processamento
      servers:
      - url: https://api.nfe.io
      parameters:
      - name: company_id
        in: path
        required: true
        description: Identificador da empresa emissora na NFE.io (obtido em GET /v2/companies em api.nfse.io ou no painel).
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: Valor enviado no campo externalId no momento da emissão (o identificador do seu sistema).
        schema:
          type: string
  /v1/companies/{company_id}/serviceinvoices/{id}/pdf:
    get:
      operationId: nfe-io__nota_fiscal__baixar_arquivo__nfse_pdf
      summary: Download do PDF da Nota Fiscal de Serviço (NFSE)
      description: 'Baixa a representação em PDF da NFS-e autorizada, para anexar em e-mail, portal do cliente ou arquivo contábil.


        Quando usar: Quando o cliente pede ''o PDF da nota''. Só existe depois que a nota está autorizada; antes disso a resposta é 404.'
      tags:
      - NotaFiscal
      security:
      - ApiKeyAuth: []
      x-confianca: verificado
      x-fonte-url: https://nfe.io/docs/desenvolvedores/rest-api/nota-fiscal-de-servico-v1/service-invoices-get-document-pdf/
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: baixar_arquivo
      x-host: https://api.nfe.io
      x-seguro-para-executar: true
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                observacao: conteúdo binário do PDF; não há JSON de resposta
        '401':
          description: (corpo vazio)
        '404':
          description: Não foi possível o download
        '408':
          description: Tempo de resposta do servidor excedeu o limite (60s)
        '500':
          description: Erro no processamento
      servers:
      - url: https://api.nfe.io
      parameters:
      - name: company_id
        in: path
        required: true
        description: Identificador da empresa emissora na NFE.io (obtido em GET /v2/companies em api.nfse.io ou no painel).
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: Identificador da NFS-e na NFE.io.
        schema:
          type: string
  /v1/companies/{company_id}/serviceinvoices/{id}/xml:
    get:
      operationId: nfe-io__nota_fiscal__baixar_arquivo__nfse_xml
      summary: Download do XML da Nota Fiscal de Serviço (NFSE)
      description: 'Baixa o XML autorizado da NFS-e, que é o documento que a empresa precisa guardar pelo prazo legal e entregar ao contador.


        Quando usar: No fechamento mensal, para montar o pacote de XMLs do período, e sempre que o contador pedir o arquivo original. Combine com a listagem por competência para baixar em lote.'
      tags:
      - NotaFiscal
      security:
      - ApiKeyAuth: []
      x-confianca: verificado
      x-fonte-url: https://nfe.io/docs/desenvolvedores/rest-api/nota-fiscal-de-servico-v1/service-invoices-get-document-xml/
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: baixar_arquivo
      x-host: https://api.nfe.io
      x-seguro-para-executar: true
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                observacao: conteúdo XML conforme o padrão do município ou do Ambiente Nacional
        '401':
          description: (corpo vazio)
        '404':
          description: Não foi possível o download
        '500':
          description: Erro no processamento
      servers:
      - url: https://api.nfe.io
      parameters:
      - name: company_id
        in: path
        required: true
        description: Identificador da empresa emissora na NFE.io (obtido em GET /v2/companies em api.nfse.io ou no painel).
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: Identificador da NFS-e na NFE.io.
        schema:
          type: string
  /v1/companies/{company_id}/serviceinvoices/{id}/sendemail:
    put:
      operationId: nfe-io__nota_fiscal__enviar__nfse_email
      summary: Enviar email para o Tomador com a Nota Fiscal de Serviço (NFSE)
      description: 'Dispara o e-mail da NFE.io para o tomador com a nota anexada, usando o endereço registrado no campo borrower.email da nota.


        Quando usar: Quando o cliente quer que a NFE.io faça a entrega ao tomador em vez de montar o próprio disparo. Útil para reenviar quando o cliente diz que não recebeu.'
      tags:
      - NotaFiscal
      security:
      - ApiKeyAuth: []
      x-confianca: verificado
      x-fonte-url: https://nfe.io/docs/api/nf-servico-v1.yaml
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: enviar
      x-host: https://api.nfe.io
      x-seguro-para-executar: false
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                observacao: A spec documenta o sucesso sem detalhar o corpo da resposta.
        '400':
          description: Algum parâmetro informado não é válido
        '401':
          description: (corpo vazio)
        '500':
          description: Erro no processamento
      servers:
      - url: https://api.nfe.io
      parameters:
      - name: company_id
        in: path
        required: true
        description: Identificador da empresa emissora na NFE.io (obtido em GET /v2/companies em api.nfse.io ou no painel).
        schema:
          type: string
      - name: id
        in: path
        required: true
        description: Identificador da NFS-e na NFE.io.
        schema:
          type: string
  /v2/companies/{companyId}/productinvoices:
    get:
      operationId: nfe-io__nota_fiscal__listar__nfe
      summary: Listar as Notas Fiscais Eletrônicas (NFE)
      description: 'Lista as NF-e (modelo 55) emitidas pela empresa, com paginação por cursor e busca por query string no estilo Elasticsearch. O parâmetro environment é obrigatório.


        Quando usar: Relatório de faturamento de mercadoria, conciliação com pedidos e auditoria de notas rejeitadas. Para achar uma nota por cliente, valor ou número, use o parâmetro q em vez de varrer páginas.'
      tags:
      - NotaFiscal
      security:
      - ApiKeyAuth: []
      x-confianca: verificado
      x-fonte-url: https://nfe.io/docs/api/nf-produto-v2.yaml
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: listar
      x-host: https://api.nfse.io
      x-seguro-para-executar: true
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
              example:
                productInvoices:
                - id: 6b1f2a3c4d5e6f7890abcdef
                  serie: 1
                  number: 5821
                  status: Issued
                  operationNature: Venda de mercadoria
                  issuedOn: '2026-08-20T09:30:00Z'
                  operationType: Outgoing
                  environmentType: Production
                  purposeType: Normal
                  authorization:
                    accessKey: '35260100000000000191550010000058211000058216'
                    receiptOn: '2026-08-20T09:31:14Z'
                    message: Autorizado o uso da NF-e
                  buyer:
                    name: CLIENTE EXEMPLO LTDA
                    federalTaxNumber: 00000000000191
                  totals:
                    icms:
                      invoiceAmount: 1250.0
                hasMore: true
        '400':
          description: Algum parâmetro informado não é válido
        '401':
          description: (corpo vazio)
        '500':
          description: Erro no processamento
      parameters:
      - name: companyId
        in: path
        required: true
        description: Identificador da empresa emissora na NFE.io (GET /v2/companies).
        schema:
          type: string
      - name: environment
        in: query
        required: true
        description: Ambiente das notas a listar. OBRIGATÓRIO nesta rota.
        schema:
          type: string
          enum:
          - None
          - Production
          - Test
      - name: limit
        in: query
        required: false
