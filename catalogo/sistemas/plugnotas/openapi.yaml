  /nfse/tomador:
    post:
      operationId: plugnotas__cliente__criar__tomador
      summary: Cadastrar tomador
      description: 'Cadastra um tomador de serviço (o cliente do prestador) com CPF/CNPJ, razão social, endereço completo,
        inscrições e telefone. O cadastro é opcional: existe para simplificar a emissão, permitindo enviar só {"tomador":
        {"id": "..."}} no JSON da nota em vez de repetir o bloco inteiro.


        Quando usar: Vale a pena quando o mesmo tomador se repete muito (contratos mensais, carteira fixa). Se cada nota é
        para um cliente diferente, mande os dados direto no payload da NFS-e e pule este cadastro.'
      tags:
      - Cliente
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/addTomador
      x-entidade-canonica: Cliente
      x-acao-canonica: criar
      x-seguro-para-executar: false
      responses:
        '201':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"message": "string", "data": {"cnpj": "string"}}'
        '409':
          description: 'duplicidade: Já existe um(a) <recurso> com os parâmetros informados.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '401':
          description: 'token_invalido: O token informado é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '400':
          description: 'falha_validacao_tomador: Falha na validação do JSON de Tomador.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cpfCnpj:
                  type: string
                  description: CPF ou CNPJ do tomador, sem máscara.
                razaoSocial:
                  type: string
                  description: Razão social ou nome do tomador.
                nomeFantasia:
                  type: string
                  description: Nome fantasia.
                endereco:
                  type: object
                  description: 'Endereço do tomador. Obrigatórios: bairro, cep, codigoCidade, estado, logradouro, numero e
                    tipoLogradouro.'
                email:
                  type: string
                  description: E-mail para envio do PDF e do XML.
                telefone:
                  type: object
                  description: 'Telefone: {ddd, numero}. O campo numero é obrigatório quando o objeto é enviado.'
                inscricaoMunicipal:
                  type: string
                  description: Inscrição municipal do tomador.
                inscricaoEstadual:
                  type: string
                  description: Inscrição estadual do tomador.
                inscricaoSuframa:
                  type: string
                  description: Inscrição Suframa.
                indicadorInscricaoEstadual:
                  type: integer
                  description: Indicador de contribuinte de ICMS.
                orgaoPublico:
                  type: boolean
                  description: Indica se o tomador é órgão público.
                codigoEstrangeiro:
                  type: string
                  description: Documento do tomador estrangeiro.
                naoNif:
                  type: string
                  description: Indicador de tomador estrangeiro sem NIF.
              required:
              - cpfCnpj
              - endereco
            example:
              cpfCnpj: 00000000000191
              razaoSocial: Cliente Exemplo LTDA
              email: contato@example.com
              endereco:
                tipoLogradouro: Rua
                logradouro: das Flores
                numero: '100'
                bairro: Centro
                cep: '87020025'
                codigoCidade: '4115200'
                estado: PR
              telefone:
                ddd: '44'
                numero: '30000000'
