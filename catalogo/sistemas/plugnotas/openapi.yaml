                cpfCnpj:
                  type: string
                  description: CNPJ do emitente.
                serie:
                  type: number
                  description: Série da numeração a inutilizar.
                numeracao:
                  type: object
                  description: 'Faixa a inutilizar: {inicial, final}. O número inicial não pode ser maior que o final.'
                ano:
                  type: number
                  description: Ano da numeração.
                justificativa:
