  /nfe:
    post:
      operationId: plugnotas__nota_fiscal__emitir__nfe
      summary: Emitir nota de produto
      description: 'Envia uma ou mais NF-e para a SEFAZ. O corpo é um array de documentos com emitente, destinatário, itens
        (com NCM, CFOP e o bloco completo de tributos), pagamento, transporte e totais. A API valida o schema e as regras
        de negócio e, passando, devolve um id por nota e um protocolo de lote com a mensagem de processamento. A autorização
        é assíncrona.


        Quando usar: É a emissão de nota de produto. Atenção: HTTP 200 não é autorização — é aceite do JSON. A situação real
        aparece no resumo ou no webhook, e rejeição da SEFAZ chega como status REJEITADO com cStat, não como erro HTTP. Escrita
        fiscal: o assistente entrega o código, quem executa é o cliente.'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/addNFe
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: emitir
      x-seguro-para-executar: false
      responses:
        '200':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"documents": [{"idIntegracao": "string", "Emitente": "string", "id": "string"}], "message":
                  "string", "protocol": "string"}'
        '400':
          description: 'falha_validacao_json: Falha na validação do JSON de <documento>.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '409':
          description: 'duplicidade: Já existe um(a) <recurso> com os parâmetros informados.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '401':
          description: 'token_invalido: O token informado é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '500':
          description: 'erro_interno: Ocorreu um erro interno, nossa equipe já foi notificada do problema.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  idIntegracao:
                    type: string
                    description: Identificador único da nota no seu sistema; protege contra duplicidade (mesmo valor devolve
                      409).
                  emitente:
                    type: object
                    description: Emitente da nota; o cpfCnpj precisa ser de empresa cadastrada com NF-e ativa.
                  destinatario:
                    type: object
                    description: 'Destinatário: cpfCnpj, razaoSocial, inscrições, endereço e indicador de IE.'
                  itens:
                    type: array
                    description: 'Itens da nota. Obrigatórios em cada item: descricao, ncm, cfop, tributos e valorUnitario.
                      Outros campos comuns: codigo, cest, unidade, quantidade, valor, valorTotal e, na Reforma Tributária,
                      tributos.ibscbs e tributos.is.'
                  pagamentos:
                    type: array
                    description: 'Formas de pagamento (grupo YA). Em cada item, meio e valor são obrigatórios; o enum de meio
                      vai de 01 a 99 (01 dinheiro, 03 cartão de crédito, 15 boleto, 17 e 20 Pix, 90 sem pagamento, 99 outros).
                      Opcionais: aVista, data, cartao, descricaoMeio, cnpjTransacional, ufTransacional.'
                  total:
                    type: object
                    description: Totalizadores da nota (grupo W01). Quando omitido, o PlugNotas soma a partir dos itens.
                  natureza:
                    type: string
                    description: Natureza da operação.
                  numero:
                    type: string
                    description: Número da nota; dispensável quando a numeração automática está ligada no cadastro da empresa.
                  serie:
                    type: number
                    description: Série da nota.
                  dataEmissao:
                    type: string
                    format: date-time
                    description: Data e hora de emissão; sem fuso a API assume -03:00.
                  dataSaidaEntrada:
                    type: string
                    format: date-time
                    description: Data e hora de saída ou entrada da mercadoria.
                  finalidade:
                    type: string
                    enum:
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                    - '5'
                    - '6'
                    description: Finalidade da emissão.
                  saida:
                    type: boolean
                    description: Indica operação de saída (true) ou entrada (false).
                  presencial:
                    type: string
                    enum:
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                    - '5'
                    - '9'
                    description: Indicador de presença do comprador.
                  tipoImpressao:
                    type: string
                    enum:
                    - '0'
                    - '1'
                    - '2'
                    - '3'
                    description: Formato de impressão do DANFE.
                  tipoEmissao:
                    type: string
                    enum:
                    - '1'
                    - '2'
                    - '5'
                    - '6'
                    - '7'
                    description: Forma de emissão (normal ou contingências).
                  codigoIdentificacaoDestino:
                    type: string
                    enum:
                    - '1'
                    - '2'
                    - '3'
                    description: Identificação do destino da operação (interna, interestadual, exterior).
                  transporte:
                    type: object
                    description: Grupo de transporte (X01); modalidadeFrete é obrigatório quando o objeto é enviado. Aceita
                      transportador, veiculo, reboque, volumes e retencaoICMS.
                  informacoesComplementares:
                    type: string
                    description: Informações complementares de interesse do contribuinte, impressas no DANFE.
                  observacoes:
                    type: array
                    description: Observações adicionais da nota.
                  enviaremail:
                    type: boolean
                    description: 'Envia PDF e XML por e-mail depois da autorização. Atenção ao nome: é tudo minúsculo, diferente
                      do enviarEmail usado na NFS-e.'
                  notaReferenciada:
                    type: object
                    description: Documentos referenciados (nfe, nfePapel, cupomFiscal, produtorRural).
                  intermediadorTransacao:
                    type: object
                    description: Dados do intermediador em vendas por marketplace.
                required:
                - emitente
                - destinatario
                - itens
                - pagamentos
            example:
            - idIntegracao: PED-2026-000813
              natureza: Venda de mercadoria
              emitente:
                cpfCnpj: 00000000000191
              destinatario:
                cpfCnpj: '00000000000'
                razaoSocial: Cliente Exemplo
                endereco:
                  logradouro: Rua das Flores
                  numero: '100'
                  bairro: Centro
                  codigoCidade: '4115200'
                  descricaoCidade: Maringá
                  estado: PR
                  cep: '87020025'
              itens:
              - codigo: SKU-001
                descricao: Produto de exemplo
                ncm: '84713012'
                cfop: '5102'
                unidade: UN
                quantidade:
                  comercial: 1
