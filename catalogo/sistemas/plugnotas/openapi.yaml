  /nfce:
    post:
      operationId: plugnotas__nota_fiscal__emitir__nfce
      summary: Emitir nota do consumidor
      description: 'Envia uma ou mais NFC-e para a SEFAZ. O corpo segue a mesma estrutura da NF-e, com os enums restritos
        ao modelo 65: finalidade sempre 1, tipoEmissao 1 e tipoImpressao 4 ou 5 (DANFE NFC-e normal ou eletrônico). Devolve
        id por nota e protocolo de lote; a autorização é assíncrona.


        Quando usar: É a nota do varejo e do PDV. Quem precisa emitir offline quando a SEFAZ cai usa o produto de contingência
        (Neverstop), que roda como agente local e não faz parte desta API na nuvem. Escrita fiscal: o assistente não executa.'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/addNFCe
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: emitir
      x-seguro-para-executar: false
      responses:
        '200':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"documents": [{"idIntegracao": "string", "Emitente": "string", "id": "string"}], "message":
                  "string", "protocol": "string"}'
        '400':
          description: 'falha_validacao_json: Falha na validação do JSON de <documento>.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '409':
          description: 'duplicidade: Já existe um(a) <recurso> com os parâmetros informados.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '401':
          description: 'token_invalido: O token informado é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '500':
          description: 'erro_interno: Ocorreu um erro interno, nossa equipe já foi notificada do problema.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  idIntegracao:
                    type: string
                    description: Identificador único da venda no seu sistema; protege contra duplicidade.
                  emitente:
                    type: object
                    description: Emitente da nota; precisa ser empresa cadastrada com NFC-e ativa e CSC configurado.
                  destinatario:
                    type: object
                    description: Consumidor; pode ser omitido em venda sem identificação, conforme a regra da UF.
                  itens:
                    type: array
                    description: 'Itens da venda. Obrigatórios em cada item: descricao, ncm, cfop, tributos e valorUnitario.
                      Outros campos comuns: codigo, unidade, quantidade, valor, valorDesconto.'
                  pagamentos:
                    type: array
                    description: Formas de pagamento da venda, obrigatórias na NFC-e. Em cada item, meio (enum de 01 a 99)
                      e valor são obrigatórios.
                  total:
                    type: object
                    description: Totalizadores da venda; quando omitido, o PlugNotas soma a partir dos itens.
                  consumidorFinal:
                    type: boolean
                    description: Indica operação com consumidor final.
                  valorTroco:
                    type: number
                    description: Valor do troco entregue ao consumidor.
                  natureza:
                    type: string
                    description: Natureza da operação.
                  serie:
                    type: number
                    description: Série da NFC-e.
                  numero:
                    type: string
                    description: Número da NFC-e; dispensável com numeração automática.
                  dataEmissao:
                    type: string
                    format: date-time
                    description: Data e hora de emissão; sem fuso a API assume -03:00.
                  presencial:
                    type: string
                    enum:
                    - '1'
                    - '4'
                    - '5'
                    description: Indicador de presença; na NFC-e os valores aceitos são 1, 4 e 5.
                  tipoImpressao:
                    type: string
                    enum:
                    - '4'
                    - '5'
                    description: Formato do DANFE NFC-e.
                  informacoesComplementares:
                    type: string
                    description: Informações complementares impressas no DANFE NFC-e.
                required:
                - emitente
                - itens
                - pagamentos
            example:
            - idIntegracao: PDV-2026-000813
              emitente:
                cpfCnpj: 00000000000191
              itens:
              - codigo: SKU-001
                descricao: Produto de exemplo
                ncm: '84713012'
                cfop: '5102'
                unidade: UN
                quantidade:
                  comercial: 1
                  tributavel: 1
                valorUnitario:
                  comercial: 89.9
                  tributavel: 89.9
                valor: 89.9
                tributos:
                  icms:
                    origem: '0'
                    cst: '102'
                  pis:
                    cst: 08
                  cofins:
                    cst: 08
              pagamentos:
              - meio: '01'
                valor: 89.9
