        três campos obrigatórios no primeiro nível: idIntegracao, emitente e informacoesNFCom. Dentro de informacoesNFCom
        são obrigatórios versao, identificacaoNFCom (código da UF, tipo de ambiente, modelo, série, número e data), destinatario,
        assinante e detalheProdutoServico; total, grupoFatura e informacoesAdicionais completam o documento. É assíncrona
        e devolve um id por documento mais o protocolo do lote.


        Quando usar: É o documento das operadoras de telecomunicação e provedores de internet, que substituiu os modelos 21
        e 22. Se o seu cliente é ISP ou operadora, é aqui que a fatura mensal vira documento fiscal. Escrita: o assistente
        não executa.'
