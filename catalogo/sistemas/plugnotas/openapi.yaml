      description: 'Pede à SEFAZ a inutilização de uma faixa de numeração de NF-e que não foi e não será usada, informando
        CNPJ, série, ano, faixa (inicial e final) e justificativa. É assíncrona e devolve um protocolo para consulta.


        Quando usar: Use quando houve salto de numeração (falha de sistema, nota descartada antes do envio) e o fisco exige
        justificar o buraco. Escrita destrutiva: a faixa inutilizada não volta a ser usada nunca mais. O assistente não executa.'
      tags:
