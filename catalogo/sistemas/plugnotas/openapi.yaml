  /mdfe:
    post:
      operationId: plugnotas__nota_fiscal__emitir__mdfe
      summary: Emitir manifesto eletrônico (MDF-e)
      description: 'Envia o Manifesto Eletrônico de Documentos Fiscais para a SEFAZ. O corpo traz emitente, tipo de emitente,
        modalidade de transporte (1 rodoviário, 2 aéreo, 3 aquaviário, 4 ferroviário), municípios de carregamento e de descarregamento
        com as chaves dos documentos vinculados, e os totalizadores da carga. É assíncrono e devolve um id por manifesto mais
        o protocolo do lote.


        Quando usar: É o documento que ampara a viagem quando há mais de um documento fiscal no veículo. Atenção ao ciclo
        de vida: além de cancelar, o MDF-e precisa ser encerrado ao fim do trajeto, senão a SEFAZ bloqueia a emissão do próximo.
        Escrita: o assistente não executa.'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/addMDFe
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: emitir
      x-seguro-para-executar: false
      responses:
        '200':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"documents": [{"idIntegracao": "string", "emitente": "string", "id": "string"}], "message":
                  "string", "protocol": "string"}'
        '400':
          description: 'falha_validacao_json: Falha na validação do JSON de <documento>.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '409':
          description: 'duplicidade: Já existe um(a) <recurso> com os parâmetros informados.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '401':
          description: 'token_invalido: O token informado é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '500':
          description: 'erro_interno: Ocorreu um erro interno, nossa equipe já foi notificada do problema.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  idIntegracao:
                    type: string
                    description: Identificador único do manifesto no seu sistema.
                  emitente:
                    type: object
                    description: Emitente do manifesto; o cpfCnpj precisa ser de empresa cadastrada com MDF-e ativo.
                  tipoEmitente:
                    type: string
                    enum:
                    - '1'
                    - '2'
                    - '3'
                    description: 'Tipo do emitente: 1 prestador de serviço de transporte, 2 transportador de carga própria,
                      3 prestador de serviço de transporte que emite CT-e Globalizado.'
                  modalidadeDeTransporte:
                    type: string
                    enum:
                    - '1'
                    - '2'
                    - '3'
                    - '4'
                    description: 'Modalidade do transporte: 1 rodoviário, 2 aéreo, 3 aquaviário, 4 ferroviário.'
                  carregamento:
                    type: object
                    description: 'Municípios de carregamento: {estado, municipios[{codigo, nome}]}.'
                  descarregamento:
                    type: object
                    description: 'Municípios de descarregamento: {estado, municipios[{codigo, nome, nfes[], ctes[]}]}, com
                      as chaves dos documentos vinculados.'
                  total:
                    type: object
                    description: 'Totalizadores da carga: quantidadeNFe, quantidadeCTe, quantidadeMDFe, valorTotalDaCarga,
                      pesoDaCarga e unidadeDeMedidadeDoPeso.'
                  modalRodoviario:
                    type: object
                    description: 'Dados do modal rodoviário: agenciaReguladora (RNTRC e contratantes), veiculoComTracao (placa,
                      proprietário, tara, capacidade, condutores, tipoRodado, tipoCarroceria) e reboques. Não aparece na lista
                      de propriedades do schema publicado, só nos exemplos oficiais da rota. Campo documentado apenas por
                      exemplo; confirmar o leiaute completo com o fornecedor.'
                  percursos:
                    type: array
                    description: 'UFs de percurso entre a origem e o destino: [{estado}].'
                  produtoPredominante:
                    type: object
                    description: 'Produto predominante da carga: tipoCarga, descricao, codigoEAN, codigoNCM e localizações
                      de carregamento e descarregamento.'
                  segurosDaCarga:
                    type: array
                    description: 'Seguros da carga: responsável, seguradora, número da apólice e averbações.'
                  tipoTransportador:
                    type: string
                    enum:
                    - '1'
                    - '2'
                    - '3'
                    description: 'Tipo do transportador: 1 ETC, 2 TAC, 3 CTC.'
                  lacres:
                    type: array
                    description: Lacres do veículo ou do contêiner.
                  serie:
                    type: string
                    description: Série do manifesto.
                  numero:
                    type: string
                    description: Número do manifesto; dispensável com numeração automática.
                  dataEmissao:
                    type: string
                    format: date-time
                    description: Data e hora de emissão.
                  previsaoDeInicioDaViagem:
                    type: string
                    format: date-time
                    description: Data e hora previstas para o início da viagem.
                  tipoEmissao:
                    type: string
                    enum:
                    - '1'
                    - '2'
                    - '3'
                    description: Forma de emissão (normal ou contingência).
                  enviarEmail:
                    type: boolean
                    description: Envia o DAMDFE e o XML por e-mail depois da autorização.
                  versaoModal:
                    type: string
                    description: Versão do leiaute do modal.
                required:
                - emitente
                - tipoEmitente
                - modalidadeDeTransporte
                - carregamento
                - descarregamento
                - total
            example:
            - idIntegracao: VIAGEM-2026-000123
              serie: '765'
              tipoEmitente: '1'
              tipoTransportador: '2'
              modalidadeDeTransporte: '1'
              emitente:
                cpfCnpj: 00000000000191
              carregamento:
                estado: PR
                municipios:
                - codigo: '4115200'
                  nome: MARINGA
              descarregamento:
                estado: SP
                municipios:
                - codigo: '3550308'
                  nome: SAO PAULO
                  nfes:
                  - chave: '41200900000000000191550010000000131609769080'
              total:
                quantidadeNFe: 1
                valorTotalDaCarga: 1290.5
                unidadeDeMedidadeDoPeso: KG
                pesoDaCarga: 320
              modalRodoviario:
                agenciaReguladora:
                  rntrc: '12345678'
                veiculoComTracao:
                  placa: ABC1D23
                  taraEmKg: 15100
                  condutores:
                  - nome: Condutor Exemplo
                    cpf: '00000000000'
