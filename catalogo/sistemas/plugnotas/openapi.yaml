            application/json:
              schema:
                type: object
                description: '{"message": "string", "protocol": "string"}'
        '400':
          description: 'faixa_invalida: Falha na validação do JSON de inutilização de numeração NFe.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '409':
          description: 'inutilizacao_duplicada: Já existe uma Inutilização de numeração com os parâmetros informados.'
