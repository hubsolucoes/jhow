  /nfse:
    post:
      operationId: plugnotas__nota_fiscal__emitir__nfse
      summary: Emitir nota de serviço
      description: 'Envia uma ou mais NFS-e para a prefeitura (ou para o Ambiente Nacional, quando a empresa está com nfseNacional
        ligado). O corpo é um array de documentos; cada um traz prestador, tomador, serviço, RPS e cidade de prestação. A
        API valida o schema e algumas regras de negócio na hora e, passando, devolve um id por nota mais um protocolo do lote,
        com a mensagem de que as notas estão em processamento. A autorização em si é assíncrona.


        Quando usar: É a rota central de quem fatura serviço. Um HTTP 200 aqui não quer dizer nota autorizada: significa que
        o PlugNotas aceitou o JSON. A situação real vem do webhook ou da consulta de resumo. Escrita com efeito fiscal e cobrança:
        o assistente explica e gera o código, mas quem executa é o cliente.'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/post-nfse
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: emitir
      x-seguro-para-executar: false
      responses:
        '200':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"documents": [{"idIntegracao": "string", "prestador": "string", "id": "string"}], "message":
                  "string", "protocol": "string"}'
        '400':
          description: 'falha_validacao_json: Falha na validação do JSON de <documento>.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '409':
          description: 'duplicidade: Já existe um(a) <recurso> com os parâmetros informados.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '401':
          description: 'token_invalido: O token informado é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '500':
          description: 'erro_interno: Ocorreu um erro interno, nossa equipe já foi notificada do problema.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  idIntegracao:
                    type: string
                    description: Identificador único da nota no seu sistema; é a proteção contra duplicidade (reenvio do mesmo
                      valor devolve 409 em vez de emitir outra nota).
                  prestador:
                    type: object
                    description: Emitente do serviço. Obrigatório o cpfCnpj de uma empresa já cadastrada; os demais dados
                      vêm do cadastro quando omitidos.
                  tomador:
                    type: object
                    description: 'Tomador do serviço: cpfCnpj, razaoSocial, endereco, email, inscrições. Pode ser substituído
                      por {"id": "..."} de um tomador cadastrado. No schema oficial só prestador e servico são obrigatórios,
                      mas a maioria das prefeituras exige o tomador.'
                  servico:
                    type: array
                    description: 'Itens de serviço. Obrigatórios em cada item: codigo, discriminacao, iss e valor. Opcionais
                      úteis: cnae, codigoTributacao, codigoServicoNacional, codigoCidadeIncidencia, deducao e ibscbs. Pode
                      usar {"id": "..."} de serviço cadastrado.'
                  rps:
                    type: object
                    description: 'Dados do RPS: dataEmissao e competencia são obrigatórios quando o objeto é enviado; serie
                      e numero só quando a numeração automática está desligada.'
                  cidadePrestacao:
                    type: object
                    description: 'Município onde o serviço foi prestado: codigo (IBGE) e descricao obrigatórios quando enviado;
                      sem ele vale a cidade do prestador. Exterior usa 9999999.'
                  enviarEmail:
                    type: boolean
                    default: false
                    description: Envia PDF e XML por e-mail ao tomador.
                  idNotaSubstituida:
                    type: string
                    description: Identificador da nota que está sendo substituída, nos municípios que suportam substituição.
                  informacoesComplementares:
                    type: object
                    description: Observações e informações complementares impressas na nota.
                  intermediario:
                    type: object
                    description: Intermediário do serviço, quando houver.
                  camposPrefeitura:
                    type: object
                    description: Campos exigidos apenas por determinadas prefeituras, fora do padrão comum.
                  parcelas:
                    type: array
                    description: Parcelamento do serviço, nos municípios que aceitam.
                  naturezaTributacao:
                    type: string
                    description: Natureza da tributação do serviço, quando o município exige.
                  modoEnvio:
                    type: string
                    description: Modo de envio à prefeitura, quando o município oferece mais de um.
                required:
                - prestador
                - servico
            example:
            - idIntegracao: OS-2026-000123
              prestador:
                cpfCnpj: 00000000000191
              tomador:
                cpfCnpj: '00000000000'
                razaoSocial: Cliente Exemplo
                email: contato@example.com
                endereco:
                  tipoLogradouro: Rua
                  logradouro: das Flores
                  numero: '100'
                  bairro: Centro
                  cep: '87020025'
                  codigoCidade: '4115200'
                  estado: PR
              cidadePrestacao:
                codigo: '4115200'
                descricao: MARINGA
              servico:
              - codigo: '0107'
                discriminacao: Suporte técnico mensal em software
                cnae: '6209100'
                iss:
                  aliquota: 2.0
                  exigibilidade: 1
                  retido: false
                valor:
                  servico: 425.0
                  unitario: 425.0
                quantidade: 1
              rps:
                dataEmissao: '2026-08-21T00:00:00-03:00'
                competencia: '2026-08-21'
              enviarEmail: true
