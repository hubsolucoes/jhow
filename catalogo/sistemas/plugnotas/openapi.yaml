                  "string", "protocol": "string"}'
        '400':
          description: 'falha_validacao_json: Falha na validação do JSON de <documento>.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '409':
          description: 'duplicidade: Já existe um(a) <recurso> com os parâmetros informados.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '401':
          description: 'token_invalido: O token informado é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '500':
          description: 'erro_interno: Ocorreu um erro interno, nossa equipe já foi notificada do problema.'
