openapi: 3.1.0
info:
  title: PlugNotas (Tecnospeed) - catálogo
  version: 2.4.2
  description: Reconstrução do catálogo a partir da especificação oficial publicada em https://docs.plugnotas.com.br/api.json
    (info.version 2.4.2, consulta em 2026-09-17). Contém os endpoints detalhados do catálogo; os demais estão em endpoints.json
    > endpoints_secundarios. Autenticação por cabeçalho x-api-key.
  contact:
    name: TecnoSpeed S/A - PlugNotas
    url: https://docs.plugnotas.com.br/
servers:
- url: https://api.plugnotas.com.br
  description: Produção (também usada para homologação fiscal, via flag config.producao da empresa)
- url: https://api.sandbox.plugnotas.com.br
  description: Sandbox (mock, token fixo público, não chega à SEFAZ nem à prefeitura)
security:
- xApiKey: []
components:
  securitySchemes:
    xApiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: Token da organização, sem prefixo.
paths:
  /nfse/cidades:
    get:
      operationId: plugnotas__tabela_auxiliar__listar__cidades
      summary: Consultar todos os municípios atendidos e metadados
      description: 'Devolve a lista inteira dos municípios em que o PlugNotas consegue emitir NFS-e, cada um com o padrão
        do fornecedor da prefeitura (ABRASF, DSF, INFISC, sistemas próprios) e com as particularidades que mudam a integração:
        se exige certificado digital, se exige login e senha do portal, se aceita cancelamento por webservice, tamanho máximo
        da discriminação do serviço e fuso horário.


        Quando usar: Use antes de prometer emissão de NFS-e para um cliente novo, e para montar no seu produto uma tela de
        ''municípios atendidos''. É a lista completa; para um município só, prefira a consulta por código IBGE, que é bem
        mais barata.'
      tags:
      - TabelaAuxiliar
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/getCidade
      x-entidade-canonica: TabelaAuxiliar
      x-acao-canonica: listar
      x-seguro-para-executar: true
      responses:
        '200':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"[]": {"id": "number (código IBGE)", "nome": "string", "uf": "string", "padrao": "string",
                  "certificado": "boolean", "login": "boolean", "senha": "boolean", "cancelamento": "boolean", "substituicao":
                  "boolean", "upload": "boolean", "fuso": "string", "padraoNacional": {"producao": "boolean", "homologacao":
                  "boolean"}}}'
        '401':
          description: 'token_invalido: O token informado é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '500':
          description: 'erro_interno: Ocorreu um erro interno, nossa equipe já foi notificada do problema.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
  /nfse/cidades/{codigoIbge}:
    get:
      operationId: plugnotas__tabela_auxiliar__obter__cidade
      summary: Consultar disponibilidade do município e metadados
      description: 'Informa se um município específico já está homologado para NFS-e no PlugNotas e devolve os metadados dele:
        padrão da prefeitura, exigência de certificado e de credenciais do portal, suporte a cancelamento e substituição,
        limites de texto e disponibilidade no Ambiente Nacional.


        Quando usar: É o primeiro passo de qualquer integração de NFS-e: rode esta consulta com o código IBGE do prestador
        antes de montar o payload, porque é daqui que sai a resposta para ''preciso de certificado?'' e ''dá para cancelar
        por API?''. Município ainda não homologado responde HTTP 400 com o nome da cidade.'
      tags:
      - TabelaAuxiliar
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/getCidadeById
      x-entidade-canonica: TabelaAuxiliar
      x-acao-canonica: obter
      x-seguro-para-executar: true
      responses:
        '200':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"id": "number", "nome": "string", "uf": "string", "padrao": "string", "certificado": "boolean",
                  "login": "boolean", "senha": "boolean", "cancelamento": "boolean", "substituicao": "boolean", "lote": {"max":
                  "number", "numeracaoAutomatica": "boolean"}, "detalhesEmissao": {"tamanhoMaxDescricao": "number"}, "metodosDisponiveis":
                  {"envioSincrono": "boolean", "envioLote": "boolean", "consultaNfse": "boolean"}}'
        '400':
          description: 'cidade_nao_homologada: A cidade vinculada ao código IBGE utilizado ainda não foi homologada.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '404':
          description: 'nao_encontrado: Não localizamos qualquer <recurso> com os parâmetros informados.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '401':
          description: 'token_invalido: O token informado é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
      parameters:
      - name: codigoIbge
        in: path
        required: true
        description: Código IBGE do município, com 7 dígitos.
        schema:
          type: string
          pattern: ^[0-9]{7}$
          description: Código IBGE do município, com 7 dígitos.
  /cep/{cep}:
    get:
      operationId: plugnotas__endereco__obter__cep
      summary: Consultar endereço através do CEP
      description: 'Traduz um CEP em logradouro, complemento, bairro, município, UF e código IBGE do município. É uma conveniência
        para preencher o endereço do tomador ou do destinatário já no formato que o PlugNotas espera, inclusive com o código
        IBGE que a nota exige.


        Quando usar: Use no cadastro de clientes e antes de montar a nota, para não tomar rejeição por município ou CEP inconsistente.
        A documentação avisa que por trás há uma API de terceiros, então não conte com disponibilidade garantida nem faça
        disso um caminho crítico.'
      tags:
      - Endereco
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/get-cep
      x-entidade-canonica: Endereco
      x-acao-canonica: obter
      x-seguro-para-executar: true
      responses:
        '200':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"cep": "string", "logradouro": "string", "complemento": "string", "bairro": "string", "municipio":
                  "string", "uf": "string", "ibge": "string"}'
        '400':
          description: 'cep_invalido: O CEP utilizado na consulta é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '401':
          description: 'token_invalido: O token informado é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '500':
          description: 'erro_interno: Ocorreu um erro interno, nossa equipe já foi notificada do problema.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
      parameters:
      - name: cep
        in: path
        required: true
        description: CEP com 8 dígitos, sem máscara.
        schema:
          type: string
          pattern: ^[0-9]{8}$
          description: CEP com 8 dígitos, sem máscara.
  /cnpj/{cnpj}:
    get:
      operationId: plugnotas__pessoa__obter__cnpj
      summary: Consultar dados do CNPJ
      description: 'Consulta o cadastro de um CNPJ na Receita Federal e devolve razão social, nome fantasia, situação cadastral,
        natureza jurídica, capital social, endereço completo, telefone, e-mail, CNAEs e a lista de sócios. Se o CNPJ foi atualizado
        há menos de 30 dias, a resposta vem do cache do PlugNotas (campo cached).


        Quando usar: Serve para preencher e conferir o cadastro do emitente ou do destinatário antes de emitir. Cuidado: a
        resposta traz nomes de sócios, que são dado pessoal — só consulte com base legal e não guarde o que não vai usar.
        Outra armadilha: rejeição da Receita não vira erro HTTP, vem com status 200 e uma mensagem no corpo.'
      tags:
      - Pessoa
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/get-cnpj
      x-entidade-canonica: Pessoa
      x-acao-canonica: obter
      x-seguro-para-executar: true
      responses:
        '200':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"status": "string", "cpf_cnpj": "string", "razao_social": "string", "nome": "string", "tipo":
                  "string (MATRIZ|FILIAL)", "situacao": "string", "data_situacao": "string", "data_abertura": "string", "natureza_juridica":
                  "string", "capital_social": "string", "telefone": "string", "email": "string", "cached": "boolean", "endereco":
                  {"cep": "string", "logradouro": "string", "numero": "string", "bairro": "string", "municipio": "string",
                  "uf": "string"}, "socios": [{"nome": "string", "qualificacao": "string"}], "atividades": [{"codigo": "string",
                  "descricao": "string", "tipo": "string"}]}'
        '400':
          description: 'cnpj_invalido: O CNPJ utilizado na operação é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '401':
          description: 'token_invalido: O token informado é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '500':
          description: 'erro_interno: Ocorreu um erro interno, nossa equipe já foi notificada do problema.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
      parameters:
      - name: cnpj
        in: path
        required: true
        description: CNPJ com 14 dígitos, sem máscara.
        schema:
          type: string
          pattern: ^[0-9]{14}$
          description: CNPJ com 14 dígitos, sem máscara.
  /calculadora/versao:
    get:
      operationId: plugnotas__tabela_auxiliar__obter__versao_calculadora
      summary: Consultar versão da calculadora de tributos
      description: 'Devolve a versão da calculadora de tributos que o PlugNotas está usando e a versão publicada pela SEFAZ,
        tanto da aplicação quanto da base de dados. Serve para descobrir se o cálculo do ambiente está defasado em relação
        ao que o fisco publicou.


        Quando usar: Consulte ao investigar divergência de imposto calculado, especialmente durante a Reforma Tributária,
        quando as tabelas mudam com frequência. Se versaoDbLocal estiver atrás de versaoDbRemota, a diferença de cálculo pode
        ser justamente essa.'
      tags:
      - TabelaAuxiliar
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/get-calculadora-versao
      x-entidade-canonica: TabelaAuxiliar
      x-acao-canonica: obter
      x-seguro-para-executar: true
      responses:
        '200':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"versaoAplicacaoLocal": "string", "versaoAplicacaoEstavel": "string", "versaoAplicacaoRemota":
                  "string", "versaoDbLocal": "string", "versaoDbLocalEstavel": "string", "versaoDbRemota": "string"}'
        '401':
          description: 'token_invalido: O token informado é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '500':
          description: 'erro_interno: Ocorreu um erro interno, nossa equipe já foi notificada do problema.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
  /certificado:
    get:
      operationId: plugnotas__empresa__listar__certificado
      summary: Consultar certificados
      description: 'Lista todos os certificados digitais cadastrados na organização, com identificador interno, nome do titular
        (o campo nome traz o distinguished name do certificado ICP-Brasil), hash, CNPJ, e-mail de aviso e data de vencimento.


        Quando usar: É o relatório de vencimento de certificados de uma software house: rode periodicamente e avise o cliente
        antes de o certificado expirar, porque certificado vencido derruba a emissão de todos os documentos daquele CNPJ.'
      tags:
      - Empresa
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/get-certificado
      x-entidade-canonica: Empresa
      x-acao-canonica: listar
      x-seguro-para-executar: true
      responses:
        '200':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"[]": {"id": "string", "nome": "string (DN do certificado)", "hash": "string", "vencimento":
                  "string (DD/MM/AAAA HH:mm:ss)", "email": "string", "cnpj": "string", "cadastro": "string (ISO-8601)"}}'
        '401':
          description: 'token_invalido: O token informado é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '500':
          description: 'erro_interno: Ocorreu um erro interno, nossa equipe já foi notificada do problema.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
    post:
      operationId: plugnotas__empresa__criar__certificado
      summary: Cadastro de certificado
      description: 'Envia o arquivo do certificado digital A1 (.pfx/.p12) e a senha, em multipart/form-data, e devolve o identificador
        que será usado no cadastro da empresa. Um mesmo identificador pode ser reaproveitado por várias empresas quando matriz
        e filiais compartilham o certificado.


        Quando usar: É o primeiro passo do onboarding de um emitente novo. Guarde o id devolvido: ele vai no campo certificado
        do cadastro de empresa. Não é leitura e o assistente não executa: envie você mesmo, porque a operação trafega a senha
        do certificado.'
      tags:
      - Empresa
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/post-certificado
      x-entidade-canonica: Empresa
      x-acao-canonica: criar
      x-seguro-para-executar: false
      responses:
        '201':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"message": "string", "data": {"id": "string"}}'
        '400':
          description: 'senha_incorreta: A senha utilizada na tentativa de upload do Certificado está incorreta.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '401':
          description: 'token_invalido: O token informado é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '500':
          description: 'erro_interno: Ocorreu um erro interno, nossa equipe já foi notificada do problema.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                arquivo:
                  type: string
                  format: binary
                  description: Arquivo do certificado A1 em formato PFX/P12, enviado como parte de multipart/form-data.
                senha:
                  type: string
                  description: 'Senha do certificado. Segredo: nunca registre em log nem em planilha.'
                email:
                  type: string
                  description: E-mail que receberá avisos de vencimento do certificado.
              required:
              - arquivo
              - senha
  /certificado/{idCertificadoOrCpfCnpj}:
    get:
      operationId: plugnotas__empresa__obter__certificado
      summary: Consultar um certificado específico
      description: 'Devolve os dados de um certificado já cadastrado, buscando pelo identificador interno ou pelo CPF/CNPJ
        do titular. Traz os mesmos campos da listagem, sem o arquivo e sem a senha.


        Quando usar: Use quando já tem o CNPJ do cliente e quer saber, na hora, se existe certificado cadastrado e quando
        ele vence — por exemplo, na tela de diagnóstico do seu suporte.'
      tags:
      - Empresa
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/get-certificado-idCertificado
      x-entidade-canonica: Empresa
      x-acao-canonica: obter
      x-seguro-para-executar: true
      responses:
        '200':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"id": "string", "nome": "string", "hash": "string", "vencimento": "string", "email": "string",
                  "cnpj": "string", "cadastro": "string"}'
        '404':
          description: 'nao_encontrado: Não localizamos qualquer <recurso> com os parâmetros informados.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '401':
          description: 'token_invalido: O token informado é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '500':
          description: 'erro_interno: Ocorreu um erro interno, nossa equipe já foi notificada do problema.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
      parameters:
      - name: idCertificadoOrCpfCnpj
        in: path
        required: true
        description: Identificador do certificado devolvido no cadastro, ou o CPF/CNPJ do titular.
        schema:
          type: string
          description: Identificador do certificado devolvido no cadastro, ou o CPF/CNPJ do titular.
  /certificado/{idCertificado}:
    put:
      operationId: plugnotas__empresa__substituir__certificado
      summary: Alterar certificado
      description: 'Substitui o arquivo de um certificado já cadastrado, mantendo o vínculo com todas as empresas que o usavam.
        A resposta traz o id de um novo registro de certificado criado internamente.


        Quando usar: É a rota da renovação anual: com certificado compartilhado entre matriz e filiais, troca-se o arquivo
        em um lugar só, sem editar empresa por empresa. Operação de escrita sensível — o assistente não executa.'
      tags:
      - Empresa
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/updateCertificado
      x-entidade-canonica: Empresa
      x-acao-canonica: substituir
      x-seguro-para-executar: false
      responses:
        '200':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"message": "string", "data": {"id": "string"}}'
        '400':
          description: 'senha_incorreta: A senha utilizada na tentativa de upload do Certificado está incorreta.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '404':
          description: 'nao_encontrado: Não localizamos qualquer <recurso> com os parâmetros informados.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
        '401':
          description: 'token_invalido: O token informado é inválido.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: object
                    properties:
                      message:
                        type: string
                      data:
                        type: object
      parameters:
      - name: idCertificado
        in: path
        required: true
        description: Identificador do certificado que será substituído.
        schema:
          type: string
          description: Identificador do certificado que será substituído.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                arquivo:
                  type: string
                  format: binary
                  description: Novo arquivo do certificado A1, em multipart/form-data.
                senha:
                  type: string
                  description: Senha do novo certificado.
                email:
                  type: string
                  description: E-mail para avisos de vencimento.
              required:
              - arquivo
              - senha
    delete:
      operationId: plugnotas__empresa__excluir__certificado
      summary: Deletar um certificado
      description: 'Remove um certificado digital cadastrado na organização.


        Quando usar: Use só em limpeza de cadastro, depois de confirmar que nenhuma empresa ativa aponta para esse certificado.
        Excluir um certificado em uso derruba a emissão. O assistente não executa exclusões.'
      tags:
      - Empresa
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/delete-certificado-idCertificado
      x-entidade-canonica: Empresa
      x-acao-canonica: excluir
      x-seguro-para-executar: false
      responses:
        '200':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"message": "string", "data": {"id": "string"}}'
        '404':
          description: 'nao_encontrado: Não localizamos qualquer <recurso> com os parâmetros informados.'
          content:
