                type: object
                properties:
                  idIntegracao:
                    type: string
                    description: Identificador único do documento no seu sistema.
                  emitente:
                    type: object
                    description: 'Emitente: cpfCnpj (obrigatório), ieUFDestino, inscricaoEmitenteSuframa.'
                  informacoesNFCom:
                    type: object
                    description: 'Bloco principal do documento. Obrigatórios: versao, identificacaoNFCom (codUF, tipoAmbiente,
                      codMod, serie, numero, dataEmissao), destinatario, assinante e detalheProdutoServico. Opcionais: total,
                      grupoFatura, grupoSubstituicao, grupoVinculacaoPagamento, informacoesAdicionais e responsavelTecnico.'
                required:
                - idIntegracao
                - emitente
                - informacoesNFCom
