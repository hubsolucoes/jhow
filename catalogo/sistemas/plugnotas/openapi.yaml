    post:
      operationId: plugnotas__nota_fiscal__cancelar__nfse
      summary: Solicitar cancelamento da NFS-e
      description: 'Abre uma solicitação de cancelamento de NFS-e junto à prefeitura. Só vale para nota em situação CONCLUIDO.
        A resposta traz um protocolo de cancelamento que deve ser consultado depois; quando o cancelamento é homologado, a
        situação da nota vira CANCELADO e o webhook é disparado. Algumas prefeituras exigem código e motivo no corpo; no Ambiente
        Nacional os códigos aceitos são 1 (erro na emissão), 2 (serviço não prestado) e 9 (outros), com 9 como padrão.


        Quando usar: Use dentro do prazo que a prefeitura permite. Nem todo município aceita cancelamento por webservice —
        o campo cancelamento em GET /nfse/cidades/{codigoIbge} diz se dá. Escrita destrutiva: o assistente nunca executa.'
      tags:
      - NotaFiscal
      x-confianca: verificado
      x-fonte-url: https://docs.plugnotas.com.br/#operation/cancelNFSe
      x-entidade-canonica: NotaFiscal
      x-acao-canonica: cancelar
      x-seguro-para-executar: false
      responses:
        '200':
          description: Resposta de sucesso.
          content:
            application/json:
              schema:
                type: object
                description: '{"message": "string", "data": {"protocol": "string"}}'
        '400':
          description: 'status_invalido_para_cancelar: A ação de Cancelar NFSe é permitida apenas para notas com status CONCLUIDO.'
